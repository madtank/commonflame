name: ${COMPOSE_PROJECT_NAME:-waystation}

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://waystation:${POSTGRES_PASSWORD:-waystation-local-only}@postgres:5432/waystation
  MCP_DATABASE_URL: postgresql://waystation:${POSTGRES_PASSWORD:-waystation-local-only}@postgres:5432/waystation
  REDIS_URL: redis://redis:6379/0
  AUTH_MODE: local
  ENVIRONMENT: local
  USE_SECRET_MANAGER: "false"
  USE_CLOUD_TASKS: "false"
  CLOUD_AGENT_CREATION_ENABLED: "false"
  ENABLE_CLOUD_AI: "false"
  ENABLE_LOCAL_TESTING: "false"
  WAITLIST_ENABLED: "false"
  AX_JWT_PRIVATE_KEY_FILE: /run/keys/signing.pem
  MCP_SERVER_URL: http://mcp:8080
  PUBLIC_MCP_SERVER_URL: ${PUBLIC_URL:-http://localhost:3000}/mcp
  AX_MCP_RESOURCE_URL: ${PUBLIC_URL:-http://localhost:3000}/mcp
  AX_AUTH_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:3000}
  AX_AUTH_SERVER_URL: ${PUBLIC_URL:-http://localhost:3000}
  AX_AUTH_SERVER_METADATA_MODE: ax
  BASE_URL: ${PUBLIC_URL:-http://localhost:3000}
  AX_OAUTH_LOGIN_URL: /auth/login
  FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SIGNUP_ALERTS_ENABLED: "false"
  AUTONOMOUS_AGENT_MESH_NAMES: ""
  UPLOAD_DIR: /app/uploads
  UPLOAD_STORAGE_BACKEND: local
  PORT: "8080"

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: waystation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waystation-local-only}
      POSTGRES_DB: waystation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U waystation -d waystation"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./services/backend
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8080"
    volumes:
      - signing-keys:/run/keys
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  dispatch-worker:
    build: ./services/backend
    command: [python, -m, app.workers.dispatch_worker]
    environment: *backend-env
    volumes:
      - signing-keys:/run/keys
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  reminders-worker:
    build: ./services/backend
    command: [python, -m, app.workers.task_reminders]
    environment: *backend-env
    volumes:
      - signing-keys:/run/keys
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: ./services/mcp-server
    environment:
      AX_AUTH_MODE: remote
      API_URL: http://backend:8080
      BACKEND_JWKS_URI: http://backend:8080/.well-known/jwks.json
      BACKEND_ISSUER: ax-backend
      AX_AUTH_SERVER_URL: ${PUBLIC_URL:-http://localhost:3000}
      AX_AUTH_SERVER_INTERNAL_URL: http://backend:8080
      MCP_SERVER_URL: ${PUBLIC_URL:-http://localhost:3000}
      MCP_STATELESS_HTTP: "true"
      REDIS_URL: redis://redis:6379/1
      PORT: "8080"
    ports:
      - "127.0.0.1:${MCP_PORT:-8002}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/health]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  signing-keys:
  uploads:
