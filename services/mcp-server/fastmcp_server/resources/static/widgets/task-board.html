        const message = errorMessageFromUnknown(error, "Could not load agent list.");
        state.agents = [];
        state.assignees = [];
        state.agentsLoaded = true;
        state.agentsLoadError = message;
        state.notice = { severity: "error", message };
      } finally {
        state.loadingAgents = false;
        if (state.view === "detail") {
          render();
          notifyHostHeight();
        }
      }
    }

    function taskMatchesAssigneeSelection(task, expectedAssignee) {
      if (!expectedAssignee) return true;
      const expectedId = expectedAssignee.assignee_id || "";
      const expectedType = expectedAssignee.assignee_type || "";
      const currentAssignee = task?.assignee || {};
      const currentId = currentAssignee.id || task?.assignee_id || task?.assigned_agent_id || "";
      const currentType = currentAssignee.type || task?.assignee_type || (task?.assigned_agent_id ? "agent" : "");

      if (!expectedId) return !currentId;
      return currentId === expectedId && (!expectedType || !currentType || currentType === expectedType);
    }

    async function nudgeTask(taskId) {
      try {
        const res = await host.callServerTool("tasks", { action: "nudge", task_id: taskId });
        return handleResult(res, "detail", { preserveViewport: true });
      } catch (error) {
        showTaskError(errorMessageFromUnknown(error));
        return false;
      }
    }

    async function setReminderPause(paused) {
      try {
        const res = await host.callServerTool("tasks", {
          action: "reminder_pause",
          reminder_paused: paused,
          reminder_pause_reason: paused ? "Muted from task board" : "Unmuted from task board",
        });
        const data = extractData(res);
        if (data?.state === "error" || data?.error) {
          showTaskError(data.error || "Failed to update reminder mute state.");
          return false;
        }
        state.notice = {
          severity: "info",
          message: paused ? "Task reminders muted for this space." : "Task reminders unmuted for this space.",
        };
        render();
        notifyHostHeight();
        return true;
      } catch (error) {
        showTaskError(errorMessageFromUnknown(error, "Failed to update reminder mute state."));
        return false;
      }
    }

    async function updateTask(taskId, fields, options = {}) {
      try {
        const payload = { action: "update", task_id: taskId, ...fields };
        const updateRes = await host.callServerTool("tasks", payload);
        const ok = handleResult(updateRes, "detail", { preserveViewport: true });
        if (ok && options.expectedAssignee && !taskMatchesAssigneeSelection(state.selected?.task, options.expectedAssignee)) {
          showTaskError("Assignment did not update. The server returned the previous assignee, so the change was not saved.");
          render();
          notifyHostHeight();
          return false;
        }
        return ok;
      } catch (error) {
        showTaskError(errorMessageFromUnknown(error));
        return false;
      }
    }

    function resetViewport() {
      try {
        window.scrollTo({ top: 0, left: 0, behavior: "auto" });
      } catch {
        window.scrollTo(0, 0);
      }
    }

    // XSS-safe text escaper: uses DOM textContent to neutralize HTML entities
    function esc(s) { const d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }

    // Safe DOM builder: creates element, sets textContent (not innerHTML), returns element
    function el(tag, attrs, text) {
      const e = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === "className") e.className = v;
        else if (k.startsWith("data-")) e.setAttribute(k, v);
        else e.setAttribute(k, v);
      });
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function render() {
      const root = document.getElementById("app");
      root.textContent = "";
      if (!state.hydrated) {
        renderBootstrapState(root);
        return;
      }
      if (state.notice) {
        const severity = typeof state.notice === "string" ? "error" : (state.notice.severity || "info");
        const message = typeof state.notice === "string" ? state.notice : (state.notice.message || "");
        // Signal cards own success/info receipts; the app surface only needs blocking errors.
        if (severity === "error") {
          root.appendChild(el("div", { className: "notice notice-error" }, message));
        }
      }
      if (state.showCreate) { renderCreate(root); return; }
      if (state.view === "detail" && state.selected) { renderDetail(root); return; }
      renderList(root);
    }

    function buildListArgs() {
      const args = { action: "list", limit: state.limit, offset: state.offset };
      if (state.activeFilter) args.filter = state.activeFilter;
      if (state.activeStatus) args.status = state.activeStatus;
      return args;
    }

    async function fetchList() {
      // Fetch first page
      const res = await host.callServerTool("tasks", buildListArgs());
      const ok = handleResult(res);
      if (!ok) {
        throw new Error(extractErrorMessage(res) || state.bootstrapError || "Task request failed.");
      }

      // If there are more tasks, fetch remaining pages in background for accurate counts
      if (state.total > state.tasks.length) {
        let offset = state.tasks.length;
        while (offset < state.total) {
          const args = buildListArgs();
          args.offset = offset;
          const more = await host.callServerTool("tasks", args);
          const moreData = extractData(more);
          if (!moreData) break;
          const moreItems = moreData.data?.items || moreData.tasks || [];
          if (moreItems.length === 0) break;
          state.tasks = state.tasks.concat(moreItems);
          offset += moreItems.length;
        }
        render(); // Re-render with accurate counts
      }
    }

    // DONE_STATUSES is declared at the top of the script block alongside
    // isTerminalTaskStatus / projectedReminder; the original declaration
    // here was kept for proximity to the status filter UI but is now
    // redundant. Keep this comment as a breadcrumb.
    const STATUS_OPTIONS = [
      { value: "not_started", label: "Open" },
      { value: "in_progress", label: "In progress" },
      { value: "blocked", label: "Blocked" },
      { value: "completed", label: "Completed" },
      { value: "cancelled", label: "Cancelled" },
    ];
    function canonicalStatusValue(value) {
      const status = String(value || "").trim().toLowerCase();
      if (!status || status === "open" || status === "pending" || status === "assigned") return "not_started";
      if (status === "canceled") return "cancelled";
      return status;
    }

    function getDisplayTasks() {
      let tasks = [...state.tasks];
      // Exclude completed/cancelled unless viewing that filter specifically
      if (state.excludeDone) {
        tasks = tasks.filter(t => !DONE_STATUSES.includes((t.status || "").toLowerCase()));
      }
      // Client-side priority/reminder/assignee filters (backend support is partial).
      if (state.activePriority) {
        tasks = tasks.filter(t => normalizePriorityValue(t.priority) === state.activePriority);
      }
      if (state.activeReminderFilter) {
        tasks = tasks.filter(t => matchesReminderFilter(t, state.activeReminderFilter));
      }
      if (state.activeAssignee) {
        tasks = tasks.filter(t => taskAssigneeKey(t) === state.activeAssignee);
      }
      tasks.sort((a, b) => {
        const aUpdated = new Date(a?.updated_at || a?.created_at || 0).getTime() || 0;
        const bUpdated = new Date(b?.updated_at || b?.created_at || 0).getTime() || 0;

        if (state.sortMode === "priority") {
          const priorityDelta = getPriorityWeight(b?.priority) - getPriorityWeight(a?.priority);
          if (priorityDelta !== 0) return priorityDelta;
          return bUpdated - aUpdated;
        }

        if (state.sortMode === "oldest") {
          return aUpdated - bUpdated;
        }

        return bUpdated - aUpdated;
      });
      return tasks;
    }

    function renderList(root) {
      const displayTasks = getDisplayTasks();
      const statusCounts = getStatusCounts(state.tasks, state.activeFilter);
      const hasActiveFilters = Boolean(state.activeFilter || state.activeStatus || state.activePriority || state.activeReminderFilter || state.activeAssignee || !state.excludeDone);

      headerMain.appendChild(stats);
      header.appendChild(headerMain);

      const headerActions = el("div", { className: "header-actions" });
      const createBtn = el(
        "button",

      createBtn.addEventListener("click", () => {

      // Status and priority filter rows

      const statusFilters = [

        { label: "My Tasks", filter: "my_tasks", status: "", excludeDone: true, count: statusCounts.my_tasks, testId: "tasks-filter-my-tasks" },
        { label: "Pending", filter: "", status: "pending", excludeDone: false, count: statusCounts.pending, testId: "tasks-filter-pending" },
        { label: "In Progress", filter: "", status: "in_progress", excludeDone: false, count: statusCounts.in_progress, testId: "tasks-filter-in-progress" },
        { label: "Completed", filter: "", status: "completed", excludeDone: false, count: statusCounts.completed, testId: "tasks-filter-completed" },
      ];
      for (const f of statusFilters) {
        const active = (state.activeFilter || "") === f.filter && (state.activeStatus || "") === f.status && state.excludeDone === !!f.excludeDone;
        const btn = el("button", {
          className: "filter-btn" + (active ? " active" : ""),

        }
        btn.addEventListener("click", async () => {
          state.activeFilter = f.filter || null;

          try {

          } catch (error) {

      filtersDiv.appendChild(statusRow);

      const priorityRow = el("div", { className: "filter-row", "data-testid": "tasks-priority-row" });
      priorityRow.appendChild(el("span", { className: "filter-row-label" }, "Priority"));
      const priorities = [
        { label: "Critical", value: "critical" },

        { label: "Medium", value: "medium" },
        { label: "Low", value: "low" },
      ];
      for (const p of priorities) {
        const active = state.activePriority === p.value;
        const btn = el("button", {
          className: "filter-btn" + (active ? " active" : ""),
          "data-testid": `tasks-priority-${p.value}`,
          type: "button",
        }, p.label);
        btn.addEventListener("click", () => {

          render();
          notifyHostHeight();

      filtersDiv.appendChild(priorityRow);

      const reminderRow = el("div", { className: "filter-row", "data-testid": "tasks-reminder-filter-row" });
      reminderRow.appendChild(el("span", { className: "filter-row-label" }, "Reminder"));
      for (const f of [
        { label: "Armed", value: "armed", testId: "tasks-reminder-filter-armed" },

        { label: "No reminder", value: "none", testId: "tasks-reminder-filter-none" },
        { label: "Snoozed", value: "snoozed", testId: "tasks-reminder-filter-snoozed" },
        { label: "Noisy", value: "noisy", testId: "tasks-reminder-filter-noisy" },
        { label: "Mine due", value: "mine_due", filter: "my_tasks", testId: "tasks-reminder-filter-mine-due" },
      ]) {
        const active = state.activeReminderFilter === f.value && (!f.filter || state.activeFilter === f.filter);
        const btn = el("button", { className: "filter-btn" + (active ? " active" : ""), "data-testid": f.testId, type: "button" }, f.label);
        btn.addEventListener("click", async () => {
          const nextActive = state.activeReminderFilter === f.value ? null : f.value;
          state.activeReminderFilter = nextActive;
          if (f.filter) state.activeFilter = nextActive ? f.filter : null;

          render();

      const seenAssignees = new Set();
      for (const task of state.tasks) {
        const key = taskAssigneeKey(task);
        if (!key || seenAssignees.has(key)) continue;
        seenAssignees.add(key);
        const option = el("option", { value: key }, assigneeLabel(task));
        if (state.activeAssignee === key) option.selected = true;

      }
      assigneeFilter.addEventListener("change", () => {
        state.activeAssignee = assigneeFilter.value;
        render();
        notifyHostHeight();

      filtersDiv.appendChild(assigneeRow);
      root.appendChild(filtersDiv);

        { value: "newest", label: "Newest" },
        { value: "oldest", label: "Oldest" },

      ]) {

        if (option.value === state.sortMode) opt.selected = true;
        sortSelect.appendChild(opt);
      }
      sortSelect.addEventListener("change", () => {
        state.sortMode = sortSelect.value;
        render();
        notifyHostHeight();
      });
      sortGroup.appendChild(sortSelect);
      toolbar.appendChild(sortGroup);
      root.appendChild(toolbar);

      // Task list
      const list = el("div", { className: "task-list", "data-testid": "tasks-widget-list" });
      if (displayTasks.length === 0) {
        const empty = el("div", { className: "empty-state", "data-testid": "tasks-empty-state" });
        const emptyMessage = hasActiveFilters
          ? "No tasks match the current filters."
          : "No open tasks. Check Completed for finished work, or create a task.";
        empty.appendChild(el("div", null, emptyMessage));
        const emptyActions = el("div", { className: "empty-actions" });

          completedBtn.addEventListener("click", async () => {
            state.activeStatus = "completed";

        card.addEventListener("click", () => { void openTaskDetail(); });

      deadlineInput.setAttribute("data-testid", "tasks-create-deadline");
      deadlineField.appendChild(deadlineInput);
      deadlineField.appendChild(el("div", { className: "field-help" }, "Leave blank to create the task without a deadline."));
      form.appendChild(deadlineField);

      const reminderCadenceField = el("div", { className: "form-field" });
      reminderCadenceField.appendChild(el("label", null, "Reminder cadence minutes"));
      const reminderCadenceInput = el("input", { id: "cf-reminder-cadence", type: "number", min: "1", placeholder: "10", "data-testid": "tasks-create-reminder-cadence" });
      reminderCadenceField.appendChild(reminderCadenceInput);
      form.appendChild(reminderCadenceField);

      const reminderMaxField = el("div", { className: "form-field" });
      reminderMaxField.appendChild(el("label", null, "Reminder max count"));
      const reminderMaxInput = el("input", { id: "cf-reminder-max-count", type: "number", min: "1", placeholder: "5", "data-testid": "tasks-create-reminder-max-count" });
      reminderMaxField.appendChild(reminderMaxInput);
      form.appendChild(reminderMaxField);

      const reminderNextField = el("div", { className: "form-field" });
      reminderNextField.appendChild(el("label", null, "Reminder next fire"));
      const reminderNextInput = el("input", { id: "cf-reminder-next-fire", type: "datetime-local", "data-testid": "tasks-create-reminder-next-fire" });
      reminderNextField.appendChild(reminderNextInput);
      form.appendChild(reminderNextField);

      const reminderUntilInput = el("input", { id: "cf-reminder-until-done", type: "checkbox", "data-testid": "tasks-create-reminder-until-done" });
      const reminderUntilRow = el("div", { className: "checkbox-row" });
      reminderUntilRow.appendChild(reminderUntilInput);
      reminderUntilRow.appendChild(el("label", { for: "cf-reminder-until-done" }, "Remind until done"));

      for (const assignee of state.assignees) {

        const opt = el("option", { value: assigneeOptionValue(assignee), title: fullLabel }, assigneeOptionLabel(assignee));

      form.appendChild(assigneeField);

      const actions = el("div", { className: "form-actions" });
      const submitBtn = el("button", { className: "btn-primary", type: "button", "data-testid": "tasks-create-submit" }, "Create task");

        const title = titleInput.value.trim();
        if (!title) return;
        const args = { action: "create", title, priority: prioSelect.value };
        const desc = descInput.value.trim();
        if (desc) args.description = desc;
        const requirementsDraft = parseRequirementsDraft(requirementsInput.value, false);
        if (!requirementsDraft.ok) {
          state.notice = { severity: "error", message: requirementsDraft.error };
          render();
          notifyHostHeight();
          return;
        }
        if (requirementsDraft.value) args.requirements = requirementsDraft.value;
        const deadline = fromDateTimeLocalValue(deadlineInput.value);
        if (deadline) args.deadline = deadline;
        const reminderArgs = buildReminderScheduleArgs(reminderCadenceInput, reminderMaxInput, reminderUntilInput, reminderNextInput);

        const selectedAssignee = parseAssigneeOptionValue(assigneeSelect.value);

    function renderDetail(root) {
      const detail = state.selected || {};
      const t = detail.task || {};
      const st = canonicalStatusValue(t.status || "not_started").replace(/ /g, "_").toLowerCase();
      const pr = normalizePriorityValue(t.priority);

        const refActions = el("div", { className: "detail-ref-actions", "data-testid": "task-detail-reference-actions" });
        if (detailRef) {
          refActions.appendChild(el("span", { className: "task-ref-chip", "data-testid": "task-detail-ref", title: detailRef }, detailRef));
          const detailCopyBtn = el("button", { className: "task-ref-action", type: "button", "data-testid": "task-detail-copy-ref" }, "Copy ref");
          detailCopyBtn.addEventListener("click", async () => {
            try {

            }
          });
          refActions.appendChild(detailCopyBtn);
        }
        if (detailLink) {
          const link = el("a", {
            className: "task-ref-link",
            href: detailLink,
            target: isExternalTaskLink(detailLink) ? "_blank" : undefined,

            "data-testid": "task-detail-deep-link",
          }, "Open task link");
          refActions.appendChild(link);
        }
        card.appendChild(refActions);

      card.appendChild(renderReminderActionStrip(detail, t));

        if (option.value === st) opt.selected = true;
        statusSel.appendChild(opt);

      statusSel.addEventListener("change", async () => {

      statusField.appendChild(statusSel);
      fields.appendChild(statusField);

      const priorityField = el("div", { className: "field" });
      priorityField.appendChild(el("div", { className: "field-label" }, "Priority"));
      const prioritySel = document.createElement("select");
      prioritySel.className = "status-select";
      prioritySel.setAttribute("data-testid", "task-detail-priority");
      for (const p of ["critical", "high", "medium", "low"]) {
        const opt = el("option", { value: p }, formatPriorityLabel(p));
        if (p === pr) opt.selected = true;
        prioritySel.appendChild(opt);

      prioritySel.addEventListener("change", async () => {
        await updateTask(t.id, { priority: prioritySel.value });

      priorityField.appendChild(prioritySel);
      fields.appendChild(priorityField);

      const assigneeField = el("div", { className: "field" });
      assigneeField.appendChild(el("div", { className: "field-label" }, "Assignee"));

      assigneeSel.appendChild(el("option", { value: "" }, state.loadingAgents ? "Loading assignees..." : "Unassigned"));
      for (const assignee of state.assignees) {
        const fullLabel = assignee.handle ? `${assignee.displayName} (@${assignee.handle})` : assignee.displayName;
        const optionValue = assigneeOptionValue(assignee);
        const opt = el("option", { value: optionValue, title: fullLabel }, assigneeOptionLabel(assignee));
        if (optionValue && selectedAssigneeValue === optionValue) opt.selected = true;

      if (!state.loadingAgents && t.assignee?.id && !state.assignees.some((assignee) => assigneeOptionValue(assignee) === selectedAssigneeValue)) {

      requirementsField.appendChild(el("div", { className: "field-help" }, "Plain language is fine. Paste JSON only if you need structured fields."));
      editor.appendChild(requirementsField);

      const reminderEditorField = el("div", { className: "form-field" });
      reminderEditorField.appendChild(el("label", null, "Reminder schedule"));
      const detailReminderCadenceInput = el("input", { type: "number", min: "1", placeholder: "Cadence minutes", value: reminder.cadence_minutes || "", "data-testid": "task-detail-reminder-cadence" });
      const detailReminderMaxInput = el("input", { type: "number", min: "1", placeholder: "Max count", value: reminder.max_count || "", "data-testid": "task-detail-reminder-max-count" });
      const detailReminderNextInput = el("input", { type: "datetime-local", value: toDateTimeLocalValue(nextReminderAt), "data-testid": "task-detail-reminder-next-fire" });
      const detailReminderUntilInput = el("input", { id: "df-reminder-until-done", type: "checkbox", "data-testid": "task-detail-reminder-until-done" });
      detailReminderUntilInput.checked = Boolean(reminder.until_done);
      const detailReminderUntilRow = el("div", { className: "checkbox-row" });
      detailReminderUntilRow.appendChild(detailReminderUntilInput);
      detailReminderUntilRow.appendChild(el("label", { for: "df-reminder-until-done" }, "Remind until done"));
      reminderEditorField.appendChild(detailReminderCadenceInput);
      reminderEditorField.appendChild(detailReminderMaxInput);
      reminderEditorField.appendChild(detailReminderNextInput);
      reminderEditorField.appendChild(detailReminderUntilRow);
      reminderEditorField.appendChild(el("div", { className: "field-help" }, "Changing reminder fields schedules a reminder when you save."));
      editor.appendChild(reminderEditorField);

      const editorActions = el("div", { className: "form-actions" });
      const saveBtn = el("button", { className: "btn-primary", type: "button", "data-testid": "task-detail-save" }, "Save changes");
      const saveFeedback = el("span", { className: "save-feedback", "data-testid": "task-detail-save-feedback", role: "status", "aria-live": "polite" });
      function setSaveFeedback(message, severity = "info") {
        saveFeedback.className = `save-feedback ${severity}`;
        saveFeedback.textContent = message || "";
      }
      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = "Checking...";
        setSaveFeedback("Checking for changes...", "info");
        const nextTitle = titleInput.value.trim();
        const nextDescription = descInput.value.trim();
        const fields = {};
        if (nextTitle !== (t.title || "")) fields.title = nextTitle;
        if (nextDescription !== (t.description || "")) fields.description = nextDescription;
        const requirementsDraft = parseRequirementsDraft(requirementsInput.value, Boolean(t.requirements));
        if (!requirementsDraft.ok) {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
          setSaveFeedback(requirementsDraft.error, "error");
          state.notice = { severity: "error", message: requirementsDraft.error };
          render();
          notifyHostHeight();
          return;
        }
        const currentRequirements = stringifyRequirements(t.requirements);
        const nextRequirements = stringifyRequirements(requirementsDraft.value);
        if (currentRequirements !== nextRequirements && requirementsDraft.value !== null) {
          fields.requirements = requirementsDraft.value;
        }
        const nextDeadline = fromDateTimeLocalValue(deadlineInput.value);
        const currentDeadline = t.due_at || null;
        if (nextDeadline && nextDeadline !== currentDeadline) {
          fields.deadline = nextDeadline;
        }
        const reminderArgs = buildReminderScheduleArgs(detailReminderCadenceInput, detailReminderMaxInput, detailReminderUntilInput, detailReminderNextInput);
        if (reminderArgs) Object.assign(fields, reminderArgs);
        if (!Object.keys(fields).length) {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
          setSaveFeedback("No changes to save.", "info");
          return;
        }
        saveBtn.textContent = "Saving...";
        setSaveFeedback("Saving changes...", "info");
        const ok = await updateTask(t.id, fields);
        if (!ok) {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
          setSaveFeedback("Save failed. Check the error above.", "error");
        }
      });
      editorActions.appendChild(saveBtn);
      editorActions.appendChild(saveFeedback);
      editor.appendChild(editorActions);
      card.appendChild(editor);

      if (Array.isArray(detail.activity) && detail.activity.length > 0) {
        const activityField = el("div", { className: "field", style: "margin-top:8px" });
        activityField.appendChild(el("div", { className: "field-label" }, "Recent activity"));
        for (const item of detail.activity.slice(0, 3)) {
          const summary = [item.actor_label, item.summary].filter(Boolean).join(": ");
          activityField.appendChild(el("div", { className: "detail-desc" }, summary || "Activity update"));
        }
        card.appendChild(activityField);
      }

      root.appendChild(card);
    }

    function extractData(result) {
      if (result.structuredContent) return result.structuredContent;
      const text = result.content?.find(c => c.type === "text");
      if (!text) return null;
      try {
        const parsed = JSON.parse(text.text);
        return parsed.structuredContent || parsed;
      } catch { return null; }
    }

    function extractErrorMessage(result) {
      if (!result || typeof result !== "object") return null;
      const text = result.content?.find(c => c.type === "text" && typeof c.text === "string");
      if (result.isError && text?.text) return text.text;
      return null;
    }

    function unwrapV2(data) {
      // Unwrap v2 envelope: {kind, version, state, data: {...}, actions}
      if (data && data.version && data.data && typeof data.data === "object") return data.data;
      return data;
    }

    function taskDetailFromSignalData(data) {
      const unwrapped = unwrapV2(data) || {};
      const items = Array.isArray(unwrapped.items)
        ? unwrapped.items
        : Array.isArray(unwrapped.tasks) ? unwrapped.tasks : [];
      const selectedId = data?.selected_task_id || unwrapped.selected_task_id || data?.task_id || unwrapped.task_id;
      const selected = selectedId
        ? items.find((task) => String(task?.id || task?.task_id || "") === String(selectedId))
        : items.length === 1 ? items[0] : null;
      if (!selected) return null;
      // Older CLI task signals used a selected_task_id plus one item before
      // they had an explicit kind/action. Keep that fallback, but never
      // promote an explicit list response to detail mode.
      // TODO: remove this fallback after all CLI agents emit kind/action.
      const isDetailSignal = data?.kind === "task" || unwrapped.kind === "task" ||
        data?.action === "get" || unwrapped.action === "get" ||
        (Boolean(selectedId) && items.length === 1 && data?.action !== "list" && unwrapped.action !== "list");
      return isDetailSignal ? selected : null;
    }

    function detailStateFromTask(task) {
      if (!task) return {};
      return task.task ? task : { task };
    }

    function taskCollectionFromSignalData(data) {
      const unwrapped = unwrapV2(data) || {};
      const items = Array.isArray(unwrapped.items)
        ? unwrapped.items
        : Array.isArray(unwrapped.tasks) ? unwrapped.tasks : [];
      const isCollectionSignal = data?.kind === "tasks" || data?.kind === "task_collection" ||
        (data?.action === "list" && Array.isArray(items));
      if (!isCollectionSignal) return null;
      return {
        items,
        total: data?.total || unwrapped.total || data?.count || unwrapped.count || items.length,
      };
    }

    function applyResultData(data, view) {
      const unwrapped = unwrapV2(data) || {};
      const errorNotice = Array.isArray(data.errors) && data.errors.length > 0 ? data.errors[0] : null;
      if (data.error || errorNotice || data.state === "error") {
        const message = data.error || errorNotice?.message || "Task request failed.";
        state.notice = { severity: "error", message };
        if (!state.hydrated) {
          state.bootstrapping = false;
          state.bootstrapError = message;
        }
        return false;
      }
      state.notice = data.notice || null;
      state.hydrated = true;
      state.bootstrapping = false;
      state.bootstrapError = null;
      const signalDetail = taskDetailFromSignalData(data);
      const signalCollection = taskCollectionFromSignalData(data);
      if (data.kind === "task_detail") {
        state.selected = detailStateFromTask(data.data || {});
        state.view = "detail";
        state.showCreate = false;
        return true;
      } else if (signalCollection) {
        state.tasks = signalCollection.items;
        state.total = signalCollection.total;
        state.view = "list";
        state.selected = null;
      } else if (signalDetail) {
        state.selected = detailStateFromTask(signalDetail);
        state.tasks = [signalDetail];
        state.total = data.total || unwrapped.total || data.count || unwrapped.count || 1;
        state.view = "detail";
        state.showCreate = false;
      } else if (view === "detail" || (unwrapped.tasks && unwrapped.tasks.length === 1 && data.filter !== "list")) {
        const selectedTask = (unwrapped.tasks || [])[0] || data;
        state.selected = detailStateFromTask(selectedTask);
        state.tasks = [selectedTask];
        state.total = data.total || unwrapped.total || data.count || unwrapped.count || 1;
        state.view = "detail";
        state.showCreate = false;
      } else {
        state.tasks = unwrapped.tasks || [];
        state.total = data.total || unwrapped.count || state.tasks.length;
        state.view = "list";
        state.selected = null;
      }
      return true;
    }

    function handleResult(res, view, options = {}) {
      const data = extractData(res);
      if (!data) {
        const message = extractErrorMessage(res) || "Task request failed.";
        showTaskError(message, { bootstrap: !state.hydrated });
        return false;
      }
      const ok = applyResultData(data, view);
      render();
      if (ok && !options.preserveViewport) {
        requestAnimationFrame(() => {
          resetViewport();
          notifyHostHeight();
        });
      } else {
        notifyHostHeight();
      }
      return ok;
    }

    function renderBootstrapState(root) {
      if (state.bootstrapError) {
        const failure = el("div", { className: "empty-state", "data-testid": "tasks-load-error" });
        failure.appendChild(el("div", null, "This widget could not load tasks."));
        failure.appendChild(el("div", { className: "field-help" }, state.bootstrapError));
        const actions = el("div", { className: "empty-actions" });
        const retry = el("button", { className: "btn-primary", type: "button", "data-testid": "tasks-load-retry" }, "Retry");
        retry.addEventListener("click", () => {
          void bootstrapList();
        });
        actions.appendChild(retry);
        failure.appendChild(actions);
        root.appendChild(failure);
        return;
      }

      root.appendChild(el("div", { className: "loading", "data-testid": "tasks-loading-state" }, "Loading tasks..."));
    }

    async function showTaskList() {
      state.view = "list";
      state.selected = null;
      state.showCreate = false;
      render();
      resetViewport();
      notifyHostHeight();
      try {
        const result = await host.callServerTool("tasks", { action: "list" });
        handleResult(result, "list");
      } catch (error) {
        if (!state.tasks.length || state.total > state.tasks.length) {
          showTaskError(errorMessageFromUnknown(error, "Failed to load tasks."));
        }
      }
    }

    async function bootstrapList() {
      if (state.bootstrapping) return;
      state.bootstrapping = true;
      state.bootstrapError = null;
      render();
      notifyHostHeight();
      try {
        await fetchList();
      } catch (error) {
        showTaskError(errorMessageFromUnknown(error), { bootstrap: true });
      }
    }

    function hasPartialTaskCollection() {
      return state.hydrated && state.view === "list" && state.total > state.tasks.length;
    }

    host.setHostCommandHandler((command) => {
      if (command === "tasks/all" || command === "tasks:return-to-list") {
        void showTaskList();
      }
    });

    host.setToolResultHandler((result) => {
      const data = extractData(result);
      if (!data) {
        const message = extractErrorMessage(result);
        if (!message) return;
        showTaskError(message, { bootstrap: !state.hydrated });
        return;
      }
      const ok = applyResultData(data);
      render();
      if (ok) {
        requestAnimationFrame(() => {
          resetViewport();
          notifyHostHeight();
        });
      } else {
        notifyHostHeight();
      }
    });

    await host.connect();
    if (!state.hydrated) {
      await bootstrapList();
    } else {
      notifyHostHeight();
      if (hasPartialTaskCollection()) {
        void fetchList().catch((error) => {
          showTaskError(errorMessageFromUnknown(error));
        });
      }
    }
  </script>
</body>
</html>
