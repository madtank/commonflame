<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board - Commonflame</title>
  <style>
    :root {
      --ax-bg: var(--color-background-primary, #0a0f1a);
      --ax-surface: var(--color-background-secondary, rgba(15,23,42,0.92));
      --ax-surface-strong: var(--color-background-tertiary, rgba(30,41,59,0.96));
      --ax-text: var(--color-foreground-primary, hsl(210, 40%, 98%));
      --ax-text-dim: var(--color-foreground-secondary, hsl(215, 20.2%, 65.1%));
      --ax-border: var(--color-border-default, rgba(255,255,255,0.1));
      --ax-accent: var(--color-accent-primary, #22d3ee);
      --ax-accent-soft: rgba(6,182,212,0.12);
      --ax-warning: #fbbf24;
      --ax-danger: #fb7185;
      --ax-shadow: 0 12px 24px -8px rgba(0,0,0,0.25);
      --ax-radius: 16px;
      --ax-font: var(--font-family-body, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; background: var(--ax-bg); color: var(--ax-text); font-family: var(--ax-font); }
    body { padding: 16px; }
    .shell { width: 100%; max-width: 1180px; margin: 0 auto; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .header-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .header h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    .count { font-size: 12px; color: var(--ax-text-dim); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .stat { white-space: nowrap; }
    .stat-num { font-weight: 700; color: var(--ax-text); }
    .stat-divider { color: rgba(255,255,255,0.16); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .primary-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, #e7c680, #d6b26b);
      color: #1a1408;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 10px 22px rgba(214,178,107,0.18);
    }
    .primary-action:hover { filter: brightness(1.04); }
    .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filter-row-label {
      min-width: 64px;
      font-size: 11px;
      color: var(--ax-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .filter-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--ax-border);
      background: var(--ax-surface);
      color: var(--ax-text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .filter-btn:hover { border-color: rgba(214,178,107,0.42); color: var(--ax-text); background: rgba(255,255,255,0.03); }
    .filter-btn.active {
      background: rgba(214,178,107,0.14);
      color: var(--ax-text);
      border-color: rgba(214,178,107,0.35);
      box-shadow: inset 0 0 0 1px rgba(214,178,107,0.06);
    }
    .filter-count { color: var(--ax-text-dim); font-size: 11px; }
    .filter-btn.active .filter-count { color: rgba(230,233,238,0.8); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-label { font-size: 11px; color: var(--ax-text-dim); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .sort-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--ax-border);
    }
    .sort-select, .status-select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--ax-border);
      background: var(--ax-surface);
      color: var(--ax-text);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--ax-border);
      border: 1px solid var(--ax-border);
      border-radius: 14px;
      overflow: hidden;
    }
    .task-card {
      width: 100%;
      display: grid;
      grid-template-columns: 6px minmax(0, 1.6fr) auto auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: none;
      background: var(--ax-surface);
      color: var(--ax-text);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .task-card:hover { background: rgba(255,255,255,0.05); }
    .task-card:focus-visible { outline: 2px solid rgba(214,178,107,0.45); outline-offset: -2px; }
    .task-marker {
      align-self: stretch;
      border-radius: 999px;
      background: var(--ax-text-dim);
    }
    .priority-critical, .priority-urgent { background: var(--ax-danger); }
    .priority-high { background: var(--ax-warning); }
    .priority-medium { background: var(--ax-accent); }
    .priority-low { background: rgba(148,163,184,0.65); }
    .task-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .task-title { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
    .task-summary {
      font-size: 12.5px;
      color: var(--ax-text-dim);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-secondary-meta {
      font-size: 11.5px;
      color: rgba(148,163,184,0.75);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
    }
    .status-open { background: rgba(106,169,255,0.12); color: #a8c8ff; border-color: rgba(106,169,255,0.24); }
    .status-pending { background: rgba(224,164,88,0.12); color: #f0c083; border-color: rgba(224,164,88,0.24); }
    .status-in_progress { background: rgba(79,192,141,0.12); color: #8fe0b5; border-color: rgba(79,192,141,0.24); }
    .status-completed, .status-cancelled, .status-canceled { background: rgba(148,163,184,0.12); color: rgba(226,232,240,0.8); border-color: rgba(148,163,184,0.18); }
    .task-assignee, .task-freshness, .task-due {
      font-size: 11.5px;
      color: rgba(148,163,184,0.8);
      white-space: nowrap;
    }
    .task-assignee { min-width: 0; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .task-due {
      color: rgba(226,232,240,0.82);
      font-weight: 650;
    }
    .task-due.overdue { color: var(--ax-danger); }
    .task-due.upcoming { color: var(--ax-warning); }
    .task-reminder {
      color: #8fe0b5;
      font-weight: 650;
    }
    .task-queue {
      color: rgba(226,232,240,0.82);
      font-weight: 650;
    }
    .task-ref-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 180px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.035);
      color: rgba(226,232,240,0.86);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-ref-action {
      padding: 5px 9px;
      border-radius: 9px;
      border: 1px solid var(--ax-border);
      background: rgba(255,255,255,0.03);
      color: var(--ax-text-dim);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .task-ref-action:hover { color: var(--ax-text); border-color: rgba(214,178,107,0.35); }
    .task-ref-link { color: #8fd5ff; text-decoration: none; }
    .task-ref-link:hover { text-decoration: underline; }
    .detail-ref-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0 10px; }
    .detail-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0 16px;
    }
    .btn-danger {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(251,113,133,0.34);
      background: rgba(251,113,133,0.12);
      color: #fecdd3;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .detail-card { background: var(--ax-surface-strong); border: 1px solid var(--ax-border); border-radius: var(--ax-radius); padding: 16px; box-shadow: var(--ax-shadow); }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 9px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text-dim); font-size: 13px; cursor: pointer; margin-bottom: 12px; }
    .back-btn:hover { border-color: rgba(214,178,107,0.3); color: var(--ax-text); }
    .detail-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
    .detail-summary { font-size: 14px; color: var(--ax-text-dim); margin-bottom: 10px; line-height: 1.45; }
    .task-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .detail-desc {
      font-size: 14px;
      color: var(--ax-text-dim);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .detail-desc > :first-child { margin-top: 0; }
    .detail-desc > :last-child { margin-bottom: 0; }
    .detail-desc p,
    .detail-desc ul,
    .detail-desc ol,
    .detail-desc pre,
    .detail-desc blockquote { margin: 0 0 14px; }
    .detail-desc h1,
    .detail-desc h2,
    .detail-desc h3,
    .detail-desc h4,
    .detail-desc h5,
    .detail-desc h6 {
      color: var(--ax-text);
      font-weight: 700;
      line-height: 1.3;
      margin: 18px 0 10px;
    }
    .detail-desc h1 { font-size: 20px; }
    .detail-desc h2 { font-size: 18px; }
    .detail-desc h3 { font-size: 16px; }
    .detail-desc h4,
    .detail-desc h5,
    .detail-desc h6 { font-size: 14px; }
    .detail-desc ul,
    .detail-desc ol { padding-left: 22px; }
    .detail-desc li + li { margin-top: 6px; }
    .detail-desc strong { color: var(--ax-text); }
    .detail-desc em { color: rgba(226,232,240,0.92); }
    .detail-desc a { color: #8fd5ff; }
    .detail-desc code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      padding: 0.12em 0.38em;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      color: #f8fafc;
    }
    .detail-desc pre {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(2,6,23,0.55);
      overflow-x: auto;
    }
    .detail-desc pre code {
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
    }
    .detail-desc blockquote {
      padding-left: 14px;
      border-left: 3px solid rgba(214,178,107,0.4);
      color: rgba(226,232,240,0.85);
    }
    .detail-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .detail-fields.primary-fields { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .detail-fields.signal-fields { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: stretch; }
    .field { min-width: 0; background: rgba(255,255,255,0.02); border-radius: 10px; padding: 10px; border: 1px solid rgba(255,255,255,0.04); }
    .field.optional-signal { background: rgba(255,255,255,0.016); }
    .field-label { font-size: 10px; color: var(--ax-text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
    .field-value { font-size: 14px; font-weight: 500; }
    .work-pulse {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin: 12px 0;
      padding: 10px;
      border: 1px solid rgba(214,178,107,0.16);
      border-radius: 14px;
      background: rgba(214,178,107,0.045);
    }
    .work-pulse.is-empty {
      display: block;
      color: var(--ax-text-dim);
      font-size: 13px;
      line-height: 1.45;
    }
    .metadata-drawer {
      margin: 4px 0 12px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      background: rgba(255,255,255,0.014);
    }
    .metadata-drawer summary {
      cursor: pointer;
      padding: 10px 12px;
      color: var(--ax-text-dim);
      font-size: 12px;
      font-weight: 650;
      list-style: none;
    }
    .metadata-drawer summary::-webkit-details-marker { display: none; }
    .metadata-drawer summary::after {
      content: "+";
      float: right;
      color: rgba(148,163,184,0.85);
    }
    .metadata-drawer[open] summary::after { content: "-"; }
    .metadata-drawer .detail-fields {
      padding: 0 10px 10px;
      margin-bottom: 0;
    }
    .audit-row {
      display: grid;
      grid-template-columns: minmax(86px, auto) minmax(0, 1fr);
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      color: var(--ax-text-dim);
      font-size: 12px;
      line-height: 1.35;
    }
    .audit-row strong { color: var(--ax-text); }
    .audit-empty { padding: 0 10px 10px; color: var(--ax-text-dim); font-size: 12px; }
    .reminder-action-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      margin: 10px 0 12px;
      padding: 9px 10px;
      border-radius: 13px;
      border: 1px solid rgba(6,182,212,0.16);
      background: rgba(6,182,212,0.055);
    }
    .reminder-strip-chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
    .strip-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.035);
      color: var(--ax-text);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
    }
    .strip-chip-muted { color: var(--ax-text-dim); font-weight: 500; }
    .strip-label { color: rgba(148,163,184,0.88); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .strip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ax-text-dim); box-shadow: 0 0 0 3px rgba(148,163,184,0.11); flex: 0 0 auto; }
    .strip-dot.active, .strip-dot.armed, .strip-dot.in_progress { background: #8fe0b5; box-shadow: 0 0 0 3px rgba(143,224,181,0.13); }
    .strip-dot.snoozed, .strip-dot.waiting, .strip-dot.queued { background: var(--ax-warning); box-shadow: 0 0 0 3px rgba(251,191,36,0.13); }
    .strip-dot.fired, .strip-dot.overdue, .strip-dot.stale { background: var(--ax-danger); box-shadow: 0 0 0 3px rgba(251,113,133,0.13); }
    .strip-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
    .strip-action-btn {
      padding: 5px 9px;
      border-radius: 9px;
      border: 1px solid var(--ax-border);
      background: rgba(255,255,255,0.03);
      color: var(--ax-text-dim);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .strip-action-btn:hover:not(:disabled) { color: var(--ax-text); border-color: rgba(214,178,107,0.35); }
    .strip-action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .pulse-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .pulse-label {
      font-size: 10px;
      color: rgba(148,163,184,0.82);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pulse-value {
      min-width: 0;
      color: var(--ax-text);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pulse-muted { color: var(--ax-text-dim); font-weight: 500; }
    .detail-editor { margin-top: 16px; padding: 18px; background: rgba(255,255,255,0.02); border: 1px solid var(--ax-border); border-radius: 14px; }
    .detail-editor h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ax-text-dim); margin-bottom: 14px; }
    .create-form { background: var(--ax-surface-strong); border: 1px solid var(--ax-border); border-radius: var(--ax-radius); padding: 20px; margin-bottom: 16px; }
    .form-field { margin-bottom: 12px; }
    .form-field label { display: block; font-size: 11px; color: var(--ax-text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .form-field input, .form-field textarea, .form-field select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--ax-border);
      background: rgba(255,255,255,0.02);
      color: var(--ax-text);
      font-size: 14px;
      font-family: inherit;
    }
    .form-field input[type="checkbox"] {
      width: 16px;
      min-width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
      accent-color: var(--ax-accent);
      cursor: pointer;
    }
    .checkbox-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .checkbox-row label {
      display: inline;
      margin: 0;
      color: var(--ax-text);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }
    .form-field textarea { resize: vertical; min-height: 60px; }
    .field-help { margin-top: 6px; font-size: 11px; color: rgba(148,163,184,0.76); }
    .form-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .save-feedback { font-size: 12px; color: var(--ax-text-dim); min-height: 18px; }
    .save-feedback.success { color: #8fe0b5; }
    .save-feedback.info { color: var(--ax-accent); }
    .save-feedback.error { color: var(--ax-danger); }
    .btn-primary {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, #e7c680, #d6b26b);
      color: #1a1408;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--ax-border); background: rgba(255,255,255,0.02); color: var(--ax-text-dim); font-size: 13px; cursor: pointer; }
    .loading { text-align: center; padding: 40px; color: var(--ax-text-dim); }
    .empty-state {
      padding: 28px 24px;
      text-align: center;
      background: var(--ax-surface);
      color: var(--ax-text-dim);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .empty-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .pager { display: flex; align-items: center; gap: 8px; margin-top: 16px; justify-content: center; }
    .pager-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text-dim); font-size: 13px; cursor: pointer; }
    .pager-btn:hover:not(:disabled) { border-color: var(--ax-accent); color: var(--ax-accent); }
    .pager-btn:disabled { opacity: 0.4; cursor: default; }
    .pager-info { font-size: 12px; color: var(--ax-text-dim); }
    .priority-filters { display: flex; gap: 4px; }
    .prio-btn { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--ax-border); background: var(--ax-surface); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .prio-btn:hover { opacity: 0.85; }
    .prio-btn[data-prio="critical"] { color: var(--ax-danger); }
    .prio-btn[data-prio="critical"].active { background: var(--ax-danger); border-color: var(--ax-danger); color: #fff; }
    .prio-btn[data-prio="high"] { color: var(--ax-danger); }
    .prio-btn[data-prio="high"].active { background: var(--ax-danger); border-color: var(--ax-danger); color: #fff; }
    .prio-btn[data-prio="medium"] { color: var(--ax-warning); }
    .prio-btn[data-prio="medium"].active { background: var(--ax-warning); border-color: var(--ax-warning); color: #fff; }
    .prio-btn[data-prio="low"] { color: var(--ax-accent); }
    .prio-btn[data-prio="low"].active { background: var(--ax-accent); border-color: var(--ax-accent); color: #fff; }
    .prio-btn.active { box-shadow: 0 10px 24px rgba(16,24,40,0.14); }
    .notice { margin-bottom: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
    .notice-info { background: rgba(6,182,212,0.12); color: var(--ax-accent); border: 1px solid rgba(6,182,212,0.18); }
    .notice-error { background: rgba(186,59,45,0.12); color: var(--ax-danger); border: 1px solid rgba(186,59,45,0.2); }
    @media (max-width: 640px) {
      body { padding: 14px; }
      .task-card {
        grid-template-columns: 6px minmax(0, 1fr);
        align-items: flex-start;
        row-gap: 6px;
      }
      .task-card .task-main,
      .task-card .status-pill,
      .task-card .task-ref-action,
      .task-card .task-assignee,
      .task-card .task-freshness {
        grid-column: 2;
      }
      .task-card .status-pill {
        justify-self: start;
      }
      .task-card .task-assignee,
      .task-card .task-freshness {
        white-space: normal;
      }
      .detail-fields { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .reminder-action-strip { grid-template-columns: minmax(0, 1fr); }
      .strip-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app"><div class="loading">Loading tasks...</div></div>
  <script type="module">
    import { App } from "__COMMONFLAME_MCP_APPS_BRIDGE_URL__";
    const app = new App({ name: "Task Board", version: "1.0.0" });
    const OPENAI_SET_GLOBALS_EVENT = "openai:set_globals";

    function getOpenAiBridge() {
      return typeof window !== "undefined" ? window.openai : undefined;
    }

    function normalizeToolResult(result) {
      if (result && typeof result === "object" && ("structuredContent" in result || "content" in result)) {
        return result;
      }
      return { structuredContent: result };
    }

    function notifyHostHeight() {
      const openaiBridge = getOpenAiBridge();
      if (openaiBridge && typeof openaiBridge.notifyIntrinsicHeight === "function") {
        requestAnimationFrame(() => {
          try {
            const appRoot = document.getElementById("app");
            const bodyStyles = window.getComputedStyle(document.body);
            const paddingTop = parseFloat(bodyStyles.paddingTop || "0") || 0;
            const paddingBottom = parseFloat(bodyStyles.paddingBottom || "0") || 0;
            const contentHeight = appRoot
              ? Math.ceil(appRoot.getBoundingClientRect().height + paddingTop + paddingBottom)
              : Math.ceil(document.body.getBoundingClientRect().height);
            openaiBridge.notifyIntrinsicHeight(Math.max(120, contentHeight));
          } catch {}
        });
      }
    }

    const host = {
      _toolResultHandler: null,
      _globalsListener: null,
      setToolResultHandler(handler) {
        this._toolResultHandler = handler;
        app.ontoolresult = handler;
        // Fallback: listen for raw postMessage from hosts that send
        // ui/notifications/tool-result directly (e.g., Commonflame frontend)
        window.addEventListener("message", (event) => {
          let msg = event.data;
          if (!msg) return;
          if (typeof msg === "string") {
            try { msg = JSON.parse(msg); } catch { return; }
          }
          if (typeof msg !== "object") return;
          // MCP Apps spec: {jsonrpc: "2.0", method: "ui/notifications/tool-result", params: {...}}
          if (msg.method === "ui/notifications/tool-result" && msg.params) {
            handler(normalizeToolResult(msg.params));
            return;
          }
          // Direct result push
          if (msg.type === "tool_result" && (msg.initial_data || msg.structuredContent || msg.content)) {
            handler(normalizeToolResult(msg.initial_data || msg));
            return;
          }
          // Flat structuredContent push
          if (msg.structuredContent || msg.kind) {
            handler(normalizeToolResult(msg));
          }
        });
      },
      _deliverToolOutput(globals) {
        const openaiBridge = getOpenAiBridge();
        const output = globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")
          ? globals.toolOutput
          : openaiBridge?.toolOutput;
        if (this._toolResultHandler && output !== undefined) {
          this._toolResultHandler(normalizeToolResult(output));
        }
      },
      async connect() {
        if (!this._globalsListener) {
          this._globalsListener = (event) => {
            const globals = event?.detail?.globals;
            if (globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")) {
              this._deliverToolOutput(globals);
            }
            notifyHostHeight();
          };
          window.addEventListener(OPENAI_SET_GLOBALS_EVENT, this._globalsListener, { passive: true });
        }
        await app.connect();
        this._deliverToolOutput();
        notifyHostHeight();
      },
      async callServerTool(name, args) {
        const openaiBridge = getOpenAiBridge();
        if (openaiBridge && typeof openaiBridge.callTool === "function") {
          return normalizeToolResult(await openaiBridge.callTool(name, args));
        }
        return app.callServerTool({ name, arguments: args });
      },
      setHostCommandHandler(handler) {
        window.addEventListener("message", (event) => {
          let msg = event.data;
          if (!msg) return;
          if (typeof msg === "string") {
            try { msg = JSON.parse(msg); } catch { return; }
          }
          if (!msg || typeof msg !== "object") return;
          if (msg.type === "ax/host-command") {
            handler(msg.command, msg);
          }
        });
      },
    };

    let state = {
      view: "list",
      tasks: [],
      total: 0,
      selected: null,
      hydrated: false,
      bootstrapping: false,
      bootstrapError: null,
      showCreate: false,
      activeFilter: null,
      activeStatus: null,
      activePriority: null,
      activeReminderFilter: null,
      activeAssignee: "",
      excludeDone: true,
      sortMode: "newest",
      limit: 100,
      offset: 0,
      notice: null,
      agents: [],
      assignees: [],
      agentsLoaded: false,
      loadingAgents: false,
      agentsLoadError: null,
    };

    function formatDuration(ms) {
      const abs = Math.abs(ms);
      const mins = Math.floor(abs / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h";
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + "d";
      return "";
    }

    function relDate(d) {
      if (!d) return "";
      const ts = new Date(d).getTime();
      if (isNaN(ts)) return String(d).slice(0, 10);
      const diff = Date.now() - ts;
      if (diff < 0) {
        const future = formatDuration(diff);
        return future ? "in " + future : new Date(ts).toLocaleDateString();
      }
      const past = formatDuration(diff);
      if (past) return past === "just now" ? past : past + " ago";
      return new Date(ts).toLocaleDateString();
    }

    function dueState(d) {
      if (!d) return "";
      const ts = new Date(d).getTime();
      if (isNaN(ts)) return "";
      const diff = ts - Date.now();
      if (diff < 0) return "overdue";
      if (diff <= 24 * 60 * 60 * 1000) return "upcoming";
      return "";
    }

    function formatDueLabel(d) {
      if (!d) return "";
      const ts = new Date(d).getTime();
      if (isNaN(ts)) return "Due " + String(d).slice(0, 10);
      const diff = ts - Date.now();
      const duration = formatDuration(diff);
      if (!duration) return "Due " + new Date(ts).toLocaleDateString();
      if (diff < 0) return "Overdue " + duration;
      return "Due in " + duration;
    }

    // Status values that mean a task is no longer accepting work. Defined
    // up here so the reminder helpers below can use it (the original
    // declaration further down at the filter section is the same list,
    // re-asserted there for visibility next to the status filter UI).
    const DONE_STATUSES = ["completed", "cancelled", "canceled"];

    function isTerminalTaskStatus(status) {
      return DONE_STATUSES.includes(String(status || "").toLowerCase());
    }

    function mergeReminderSource(target, source) {
      if (typeof source === "string") {
        target.policy = source;
        return target;
      }
      if (!source || typeof source !== "object") return target;
      for (const [key, value] of Object.entries(source)) {
        if (value !== undefined) target[key] = value;
      }
      return target;
    }

    function findListTaskForDetail(task) {
      const taskId = task?.id || task?.task_id;
      if (!taskId) return null;
      return state.tasks.find((item) => String(item?.id || item?.task_id || "") === String(taskId)) || null;
    }

    function mergeFlatReminderFields(target, source) {
      if (!source || typeof source !== "object") return target;
      // Last write wins, and this order is intentional: canonical field names
      // appear after legacy aliases so fresher/direct fields override fallbacks.
      const mapping = {
        reminder_state: "state",
        reminder_status: "status",
        reminder_next_fire_at: "next_fire_at",
        reminder_next_at: "next_reminder_at",
        next_fire_at: "next_fire_at",
        next_reminder_at: "next_reminder_at",
        reminder_last_fire_at: "last_fire_at",
        reminder_last_fired_at: "last_fired_at",
        last_fire_at: "last_fire_at",
        last_reminded_at: "last_reminded_at",
        last_reminder_at: "last_reminded_at",
        last_fired_at: "last_fired_at",
        reminder_snoozed_until: "snoozed_until",
        snoozed_until: "snoozed_until",
        reminder_cadence_minutes: "cadence_minutes",
        reminder_interval_minutes: "cadence_minutes",
        cadence_minutes: "cadence_minutes",
        reminder_max_count: "max_count",
        max_count: "max_count",
        reminder_until_done: "until_done",
        until_done: "until_done",
        reminder_policy: "policy",
        reminder_count: "reminder_count",
        fire_count: "fire_count",
      };
      for (const [sourceKey, targetKey] of Object.entries(mapping)) {
        const value = source[sourceKey];
        if (value !== undefined) target[targetKey] = value;
      }
      return target;
    }

    function reminderPayloadFromTask(task, detail = null) {
      const listTask = detail ? findListTaskForDetail(task) : null;
      const reminder = {};
      // Detail payloads can omit reminder fields that are already present in the
      // list projection. Merge list first, then detail/task so list/detail render
      // the same canonical state without letting stale list values override the
      // fresher selected payload.
      for (const source of [listTask, detail, task]) {
        mergeFlatReminderFields(reminder, source);
        mergeReminderSource(reminder, source?.reminder_policy);
        mergeReminderSource(reminder, source?.reminder);
      }
      return reminder;
    }

    // Spec 06-task-contract.md §6.9 rule 1: a reminder on a terminal task
    // MUST render as inactive everywhere the widget projects reminder state.
    // This helper is the single source of truth — every reminder-rendering
    // path goes through it so label, dot, drawer, and any future projection
    // stay consistent. It also preserves explicit inactive/cancelled reminder
    // states before inferring armed/overdue from timestamps.

    const ARMING_REMINDER_STATES = ["armed", "active", "scheduled", "queued", "in_progress", "looping", "exhausted"];
    const ACTIVE_REMINDER_STATES = ARMING_REMINDER_STATES.concat(["snoozed", "overdue", "fired", "due", "stale"]);

    function looksArmedReminder(rawState, reminder, nextAt) {
      // Caller handles explicit inactive/cancelled states before reaching this
      // armability heuristic; keep that ordering so stored policy/cadence data
      // on a cancelled reminder does not re-arm the projection.
      const policy = String(reminder.policy || "").toLowerCase();
      const policyArms = Boolean(reminder.policy) && !["none", "inactive", "off", "disabled", "cancelled", "canceled"].includes(policy);
      return ARMING_REMINDER_STATES.includes(rawState)
        || reminder.active === true
        || Boolean(nextAt || reminder.cadence_minutes || policyArms || reminder.until_done || reminder.max_count);
    }

    function canonicalReminderState(task, detail = null) {
      const reminder = reminderPayloadFromTask(task, detail);
      const nextAt = reminder.next_fire_at || reminder.next_reminder_at || reminder.reminder_next_fire_at || reminder.reminder_next_at;
      const lastAt = reminder.last_fire_at || reminder.last_reminded_at || reminder.last_fired_at || reminder.reminder_last_fire_at || reminder.reminder_last_fired_at;
      const snoozedUntil = reminder.snoozed_until || reminder.reminder_snoozed_until;
      const rawState = String(reminder.state || reminder.status || reminder.reminder_state || reminder.reminder_status || "").toLowerCase();
      const explicitInactive = ["inactive", "cancelled", "canceled", "stopped", "none", "off", "disabled"].includes(rawState);
      const terminal = isTerminalTaskStatus(task?.status);
      const now = Date.now();
      const nextMs = nextAt ? new Date(nextAt).getTime() : NaN;
      const snoozedMs = snoozedUntil ? new Date(snoozedUntil).getTime() : NaN;
      const hasFutureSnooze = Number.isFinite(snoozedMs) && snoozedMs > now;
      let stateValue = rawState || "none";
      if (terminal) stateValue = "inactive";
      else if (explicitInactive) stateValue = rawState;
      else if (rawState === "snoozed" && (!snoozedUntil || hasFutureSnooze)) stateValue = "snoozed";
      else if (hasFutureSnooze) stateValue = "snoozed";
      else if (["overdue", "fired", "due", "stale"].includes(rawState) || (Number.isFinite(nextMs) && nextMs <= now)) stateValue = "overdue";
      else if (looksArmedReminder(rawState, reminder, nextAt)) stateValue = "armed";
      else stateValue = "none";

      const hasReminder = !terminal && !explicitInactive && ACTIVE_REMINDER_STATES.includes(stateValue);
      let label = "";
      if (stateValue === "inactive") label = "Reminder: inactive";
      else if (stateValue === "cancelled" || stateValue === "canceled") label = "Reminder: cancelled";
      else if (stateValue === "snoozed") label = "Snoozed " + (snoozedUntil ? relDate(snoozedUntil) : "");
      else if (["overdue", "fired", "due", "stale"].includes(stateValue)) label = nextAt ? "Overdue " + relDate(nextAt) : "Reminder overdue";
      else if (hasReminder && nextAt) label = "Reminder " + relDate(nextAt);
      else if (hasReminder && reminder.policy) label = "Reminder: " + String(reminder.policy);
      else if (hasReminder) label = "Reminder: " + String(stateValue);
      else if (lastAt) label = "Last reminder " + relDate(lastAt);

      return Object.assign({}, reminder, {
        raw_state: rawState,
        state: stateValue,
        status: stateValue,
        next_fire_at: nextAt || reminder.next_fire_at,
        next_reminder_at: nextAt || reminder.next_reminder_at,
        last_fire_at: lastAt || reminder.last_fire_at,
        last_reminded_at: lastAt || reminder.last_reminded_at,
        snoozed_until: snoozedUntil || reminder.snoozed_until,
        active: hasReminder,
        has_reminder: hasReminder,
        label: label.trim(),
        queue_state: terminal ? "stopped" : reminder.queue_state,
      });
    }

    function projectedReminder(task, detail = null) {
      return canonicalReminderState(task, detail);
    }

    function hasArmedReminder(task, detail = null) {
      return Boolean(projectedReminder(task, detail).has_reminder);
    }

    function formatReminderLabel(reminder, task, detail = null) {
      const canonical = canonicalReminderState(Object.assign({}, task || {}, { reminder }), detail);
      return canonical.label;
    }

    function reminderStateValue(reminder, task, detail = null) {
      return canonicalReminderState(Object.assign({}, task || {}, { reminder }), detail).state;
    }

    function reminderNextAt(reminder) {
      return reminder?.next_fire_at || reminder?.next_reminder_at || reminder?.reminder_next_fire_at || reminder?.reminder_next_at || null;
    }

    function reminderFireCount(reminder) {
      const historyCounts = Array.isArray(reminder?.history)
        ? reminder.history.map(item => Number(item?.fire_count)).filter(Number.isFinite)
        : [];
      const raw = reminder?.fire_count ?? reminder?.reminder_count;
      const parsed = Number(raw);
      if (Number.isFinite(parsed)) return parsed;
      return historyCounts.length ? Math.max(...historyCounts) : 0;
    }

    function reminderMaxCount(reminder) {
      const parsed = Number(reminder?.max_count ?? reminder?.policy?.max_count);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function isReminderDue(task, reminder = projectedReminder(task)) {
      if (isTerminalTaskStatus(task?.status)) return false;
      const state = reminderStateValue(reminder, task);
      if (["inactive", "cancelled", "canceled", "stopped", "none"].includes(state)) return false;
      const nextAt = reminderNextAt(reminder);
      return Boolean(nextAt && new Date(nextAt).getTime() <= Date.now());
    }

    function isReminderSnoozed(task, reminder = projectedReminder(task)) {
      if (isTerminalTaskStatus(task?.status)) return false;
      return reminderStateValue(reminder, task) === "snoozed";
    }

    function isReminderNoisy(task, reminder = projectedReminder(task)) {
      if (isTerminalTaskStatus(task?.status)) return false;
      const state = reminderStateValue(reminder, task);
      const rawState = String(reminder.raw_state || "").toLowerCase();
      const maxCount = reminderMaxCount(reminder);
      return rawState === "looping" || rawState === "exhausted" || state === "looping" || state === "exhausted" || Boolean(maxCount && reminderFireCount(reminder) >= maxCount);
    }

    function matchesReminderFilter(task, filter) {
      if (!filter) return true;
      const reminder = projectedReminder(task);
      if (filter === "due" || filter === "overdue") return isReminderDue(task, reminder);
      if (filter === "snoozed") return isReminderSnoozed(task, reminder);
      if (filter === "noisy") return isReminderNoisy(task, reminder);
      if (filter === "has" || filter === "armed") return reminder.has_reminder;
      if (filter === "none") return !reminder.has_reminder;
      // The "mine" half is enforced by the paired backend `my_tasks` list filter
      // set when the Mine due chip is selected; this predicate owns due-ness.
      if (filter === "mine_due") return isReminderDue(task, reminder);
      return true;
    }

    function taskAssigneeKey(task) {
      const assignee = task?.assignee || {};
      const type = assignee.type || task?.assignee_type || (task?.assigned_agent_id ? "agent" : "");
      const id = assignee.id || task?.assignee_id || task?.assigned_agent_id || "";
      return id ? `${type || "agent"}:${id}` : "";
    }

    function supervisorPulseSource(detail, task) {
      const source = detail?.supervisor_pulse || detail?.supervisor || task?.supervisor_pulse || task?.supervisor || task?.pulse;
      return source && typeof source === "object" ? source : {};
    }

    function supervisorPulseStateValue(detail, task) {
      const pulse = supervisorPulseSource(detail, task);
      return pulse.state || pulse.status || pulse.mode || task?.supervisor_state || task?.pulse_state || "";
    }

    function formatSupervisorPulseLabel(detail, task) {
      const pulse = supervisorPulseSource(detail, task);
      const stateValue = supervisorPulseStateValue(detail, task);
      const label = pulse.label || pulse.summary || pulse.message;
      const lastAt = pulse.last_received_at || pulse.last_check_at || pulse.last_pulse_at || pulse.updated_at;
      if (label && stateValue) return `${formatQueueLabel(stateValue)} · ${shortenSummary(String(label), 72)}`;
      if (label) return shortenSummary(String(label), 86);
      if (stateValue && lastAt) return `${formatQueueLabel(stateValue)} · received ${relDate(lastAt)}`;
      if (stateValue) return formatQueueLabel(stateValue);
      if (lastAt) return "Supervisor pulse received " + relDate(lastAt);
      return "No supervisor pulse";
    }

    function supervisorPulseState(detail, task) {
      return String(supervisorPulseStateValue(detail, task) || "none").toLowerCase();
    }

    function formatPulseTimestamp(value) {
      return value ? relDate(value) : "";
    }

    function formatPulseCount(value, singular, plural) {
      if (value === undefined || value === null || value === "") return "";
      const num = Number(value);
      if (!Number.isFinite(num)) return "";
      const label = Math.abs(num) === 1 ? singular : plural;
      return `${num} ${label}`;
    }

    function formatStaleDuration(value, staleSince) {
      const seconds = Number(value);
      if (Number.isFinite(seconds) && seconds > 0) {
        const duration = formatDuration(seconds * 1000);
        return duration ? duration + " stale" : `${Math.round(seconds)}s stale`;
      }
      if (staleSince) return "Stale since " + relDate(staleSince);
      return "";
    }

    function formatSupervisorWorkingLabel(detail, task) {
      const pulse = supervisorPulseSource(detail, task);
      const parts = [];
      if (pulse.claimed_by) parts.push("claimed by " + String(pulse.claimed_by));
      if (pulse.claimed_at) parts.push("claimed " + relDate(pulse.claimed_at));
      if (pulse.current_activity) parts.push(shortenSummary(String(pulse.current_activity), 72));
      return parts.join(" · ");
    }

    function formatSupervisorResultLabel(detail, task) {
      const pulse = supervisorPulseSource(detail, task);
      const result = pulse.last_result || pulse.last_reply;
      const at = pulse.last_result_at || pulse.last_reply_at;
      const parts = [];
      if (result) parts.push(shortenSummary(String(result), 72));
      if (at) parts.push(relDate(at));
      return parts.join(" · ");
    }

    function formatSupervisorBacklogLabel(detail, task) {
      const pulse = supervisorPulseSource(detail, task);
      return [
        formatPulseCount(pulse.queue_depth, "queued", "queued"),
        formatPulseCount(pulse.backlog, "backlog", "backlog"),
      ].filter(Boolean).join(" · ");
    }

    function formatMissingSignalsLabel(detail, task) {
      const pulse = supervisorPulseSource(detail, task);
      if (!Array.isArray(pulse.missing_signals) || !pulse.missing_signals.length) return "";
      return pulse.missing_signals.map((item) => formatQueueLabel(item)).join(", ");
    }

    function normalizePriorityValue(value) {
      const priority = String(value || "medium").trim().toLowerCase();
      if (!priority) return "medium";
      return priority === "urgent" ? "critical" : priority;
    }

    function formatPriorityLabel(value) {
      const priority = normalizePriorityValue(value);
      return priority.charAt(0).toUpperCase() + priority.slice(1);
    }

    function getPriorityWeight(value) {
      switch (normalizePriorityValue(value)) {
        case "critical": return 4;
        case "high": return 3;
        case "medium": return 2;
        case "low": return 1;
        default: return 0;
      }
    }

    function getStatusCounts(tasks, activeFilter) {
      const counts = {
        open: 0,
        my_tasks: activeFilter === "my_tasks" ? tasks.length : null,
        pending: 0,
        in_progress: 0,
        completed: 0,
      };

      for (const task of tasks) {
        const status = String(task?.status || "").toLowerCase();
        if (DONE_STATUSES.includes(status)) counts.completed += 1;
        else counts.open += 1;
        if (status === "pending") counts.pending += 1;
        if (status === "in_progress") counts.in_progress += 1;
      }

      return counts;
    }

    function toDateTimeLocalValue(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return [
        date.getFullYear(),
        "-",
        pad(date.getMonth() + 1),
        "-",
        pad(date.getDate()),
        "T",
        pad(date.getHours()),
        ":",
        pad(date.getMinutes()),
      ].join("");
    }

    function fromDateTimeLocalValue(value) {
      if (!value) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toISOString();
    }

    function parsePositiveInteger(value) {
      const parsed = Number.parseInt(String(value || "").trim(), 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function buildReminderScheduleArgs(cadenceInput, maxCountInput, untilDoneInput, nextFireInput) {
      const args = { reminder_action: "schedule" };
      const cadence = parsePositiveInteger(cadenceInput?.value);
      const maxCount = parsePositiveInteger(maxCountInput?.value);
      const nextFireAt = fromDateTimeLocalValue(nextFireInput?.value);
      if (cadence !== null) args.reminder_cadence_minutes = cadence;
      if (maxCount !== null) args.reminder_max_count = maxCount;
      if (untilDoneInput) args.reminder_until_done = Boolean(untilDoneInput.checked);
      if (nextFireAt) args.next_fire_at = nextFireAt;
      return Object.keys(args).length > 1 ? args : null;
    }

    function minutesFromNowIso(minutes) {
      return new Date(Date.now() + minutes * 60 * 1000).toISOString();
    }

    function tomorrowMorningIso(hour = 9) {
      const date = new Date();
      date.setDate(date.getDate() + 1);
      date.setHours(hour, 0, 0, 0);
      return date.toISOString();
    }

    function stringifyRequirements(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return "";
      const keys = Object.keys(value);
      if (keys.length === 1 && typeof value.notes === "string") return value.notes;
      if (keys.length === 1 && typeof value.text === "string") return value.text;
      if (keys.length === 1 && Array.isArray(value.items)) {
        return value.items.map((item) => `- ${String(item)}`).join("\n");
      }
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return "";
      }
    }

    function parseRequirementsDraft(raw, hasExistingValue) {
      const trimmed = String(raw || "").trim();
      if (!trimmed) {
        return {
          ok: true,
          value: hasExistingValue ? {} : null,
        };
      }
      if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
        try {
          const parsed = JSON.parse(trimmed);
          if (Array.isArray(parsed)) {
            return { ok: true, value: { items: parsed.map((item) => String(item)) } };
          }
          if (!parsed || typeof parsed !== "object") {
            return {
              ok: false,
              error: "Requirements can be plain text or a JSON object.",
            };
          }
          return { ok: true, value: parsed };
        } catch {
          return {
            ok: false,
            error: "Requirements can be plain text, or valid JSON when using structured fields.",
          };
        }
      }
      const lines = trimmed.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      const listItems = lines
        .map((line) => line.replace(/^[-*]\s+/, "").replace(/^\d+[.)]\s+/, "").trim())
        .filter(Boolean);
      if (listItems.length > 1) return { ok: true, value: { items: listItems } };
      return { ok: true, value: { notes: trimmed } };
    }

    function errorMessageFromUnknown(error, fallback = "Task request failed.") {
      if (error instanceof Error && error.message) return error.message;
      if (typeof error === "string" && error.trim()) return error;
      return fallback;
    }

    function isTaskNotFoundMessage(message) {
      return /api error 404|task not found|not found/i.test(String(message || ""));
    }

    function friendlyTaskErrorMessage(message) {
      const raw = String(message || "").trim();
      if (isTaskNotFoundMessage(raw)) {
        return "That task is no longer available. The task list has been refreshed.";
      }
      return raw || "Task request failed.";
    }

    function showTaskError(message, opts = {}) {
      const friendlyMessage = friendlyTaskErrorMessage(message);
      const staleTaskDetail = isTaskNotFoundMessage(message) && state.hydrated && state.view === "list";
      state.notice = staleTaskDetail
        ? { severity: "info", message: friendlyMessage }
        : { severity: "error", message: friendlyMessage };
      if (opts.bootstrap && !state.hydrated) {
        state.bootstrapping = false;
        state.bootstrapError = friendlyMessage;
      }
      render();
      notifyHostHeight();
    }

    function stripMarkdownSummary(value) {
      const source = String(value || "");
      if (!source) return "";
      return source
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/`([^`]*)`/g, "$1")
        .replace(/!\[([^\]]*)\]\([^)]+\)/g, "$1")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/(^|\n)\s{0,3}#{1,6}\s*/g, " ")
        .replace(/(^|\n)\s*[-*+]\s+/g, " ")
        .replace(/(^|\n)\s*\d+\.\s+/g, " ")
        .replace(/[*_~>#]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function appendInlineMarkdown(target, text) {
      const source = String(text || "");
      const tokenRe = /(\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*]+)\*|_([^_]+)_)/;
      let remaining = source;
      while (remaining) {
        const match = tokenRe.exec(remaining);
        if (!match) {
          target.appendChild(document.createTextNode(remaining));
          return;
        }
        if (match.index > 0) {
          target.appendChild(document.createTextNode(remaining.slice(0, match.index)));
        }
        if (match[2] && match[3]) {
          const anchor = document.createElement("a");
          anchor.href = match[3];
          anchor.target = "_blank";
          anchor.rel = "noreferrer noopener";
          appendInlineMarkdown(anchor, match[2]);
          target.appendChild(anchor);
        } else if (match[4]) {
          const code = document.createElement("code");
          code.textContent = match[4];
          target.appendChild(code);
        } else if (match[5] || match[6]) {
          const strong = document.createElement("strong");
          appendInlineMarkdown(strong, match[5] || match[6] || "");
          target.appendChild(strong);
        } else if (match[7] || match[8]) {
          const emphasis = document.createElement("em");
          appendInlineMarkdown(emphasis, match[7] || match[8] || "");
          target.appendChild(emphasis);
        } else {
          target.appendChild(document.createTextNode(match[0]));
        }
        remaining = remaining.slice(match.index + match[0].length);
      }
    }

    function isMarkdownBlockStart(line) {
      const trimmed = String(line || "").trim();
      return /^```/.test(trimmed)
        || /^#{1,6}\s+/.test(trimmed)
        || /^>\s?/.test(trimmed)
        || /^[-*+]\s+/.test(trimmed)
        || /^\d+[.)]\s+/.test(trimmed);
    }

    function renderMarkdown(markdown) {
      const fragment = document.createDocumentFragment();
      const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
      let index = 0;

      while (index < lines.length) {
        const rawLine = lines[index];
        const line = String(rawLine || "");
        const trimmed = line.trim();

        if (!trimmed) {
          index += 1;
          continue;
        }

        if (/^```/.test(trimmed)) {
          index += 1;
          const codeLines = [];
          while (index < lines.length && !/^```/.test(String(lines[index] || "").trim())) {
            codeLines.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = codeLines.join("\n");
          pre.appendChild(code);
          fragment.appendChild(pre);
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          const level = Math.min(heading[1].length, 6);
          const node = document.createElement(`h${level}`);
          appendInlineMarkdown(node, heading[2]);
          fragment.appendChild(node);
          index += 1;
          continue;
        }

        if (/^>\s?/.test(trimmed)) {
          const quoteLines = [];
          while (index < lines.length && /^>\s?/.test(String(lines[index] || "").trim())) {
            quoteLines.push(String(lines[index] || "").trim().replace(/^>\s?/, ""));
            index += 1;
          }
          const quote = document.createElement("blockquote");
          quote.appendChild(renderMarkdown(quoteLines.join("\n")));
          fragment.appendChild(quote);
          continue;
        }

        if (/^[-*+]\s+/.test(trimmed)) {
          const list = document.createElement("ul");
          while (index < lines.length) {
            const current = String(lines[index] || "").trim();
            const match = current.match(/^[-*+]\s+(.*)$/);
            if (!match) break;
            const item = document.createElement("li");
            appendInlineMarkdown(item, match[1]);
            list.appendChild(item);
            index += 1;
          }
          fragment.appendChild(list);
          continue;
        }

        if (/^\d+[.)]\s+/.test(trimmed)) {
          const list = document.createElement("ol");
          while (index < lines.length) {
            const current = String(lines[index] || "").trim();
            const match = current.match(/^\d+[.)]\s+(.*)$/);
            if (!match) break;
            const item = document.createElement("li");
            appendInlineMarkdown(item, match[1]);
            list.appendChild(item);
            index += 1;
          }
          fragment.appendChild(list);
          continue;
        }

        const paragraphLines = [];
        while (index < lines.length) {
          const current = String(lines[index] || "");
          const currentTrimmed = current.trim();
          if (!currentTrimmed) {
            index += 1;
            break;
          }
          if (paragraphLines.length > 0 && isMarkdownBlockStart(current)) break;
          paragraphLines.push(currentTrimmed);
          index += 1;
        }
        if (paragraphLines.length > 0) {
          const paragraph = document.createElement("p");
          appendInlineMarkdown(paragraph, paragraphLines.join(" "));
          fragment.appendChild(paragraph);
        }
      }

      if (!fragment.childNodes.length) {
        const paragraph = document.createElement("p");
        paragraph.textContent = String(markdown || "");
        fragment.appendChild(paragraph);
      }

      return fragment;
    }

    function shortenSummary(text, limit = 120) {
      if (!text || text.length <= limit) return text;
      let clipped = text.slice(0, limit - 1).trim();
      const lastSpace = clipped.lastIndexOf(" ");
      if (lastSpace > 48) clipped = clipped.slice(0, lastSpace);
      return clipped.replace(/[ ,;:-]+$/, "") + "...";
    }

    function comparableSummaryText(text) {
      return stripMarkdownSummary(text || "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    function shouldShowDetailSummary(task, summary) {
      if (!summary) return false;
      const description = task?.description || "";
      if (!description) return true;
      const comparableSummary = comparableSummaryText(summary);
      const comparableDescription = comparableSummaryText(description);
      if (!comparableSummary || !comparableDescription) return true;
      if (comparableSummary === comparableDescription) return false;
      // Detail pages already render the full description below. When the
      // summary is just the leading sentence/prefix of that description, showing
      // both reads as a duplicated description in live demos.
      if (comparableDescription.startsWith(comparableSummary)) return false;
      const firstDescriptionSentence = comparableDescription.split(/(?<=[.!?])\s+/)[0] || comparableDescription;
      return comparableSummary !== firstDescriptionSentence;
    }

    function summaryForTask(task) {
      const candidate = task?.ai_summary || task?.summary || task?.description;
      if (!candidate) return "";
      const cleaned = stripMarkdownSummary(candidate);
      if (!cleaned) return "";
      const firstSentence = cleaned.split(/(?<=[.!?])\s+/)[0] || cleaned;
      return shortenSummary(firstSentence);
    }

    function normalizeAgentOptions(result) {
      const data = extractData(result);
      const items = data?.items || data?.data?.items || data?.agents || [];
      if (!Array.isArray(items)) return [];
      return items
        .map((item) => {
          const id = item?.id || "";
          const handle = item?.handle || item?.name || "";
          const displayName = item?.display_name || item?.name || handle || "Unknown agent";
          if (!id && !handle) return null;
          return { id, handle, displayName };
        })
        .filter(Boolean)
        .sort((a, b) => a.displayName.localeCompare(b.displayName));
    }

    function normalizeAssigneeOptions(result) {
      const data = extractData(result);
      const items = data?.items || data?.data?.items || data?.members || [];
      if (!Array.isArray(items)) return [];
      return items
        .map((item) => {
          const id = item?.id || item?.user_id || item?.agent_id || "";
          const type = String(item?.type || item?.member_type || "").toLowerCase() === "human"
            ? "user"
            : String(item?.type || item?.member_type || "agent").toLowerCase();
          const handle = item?.handle || item?.username || item?.name || "";
          const displayName = item?.display_name || item?.full_name || item?.name || handle || (type === "user" ? "Unknown user" : "Unknown agent");
          if (!id) return null;
          if (type !== "user" && type !== "agent") return null;
          return { id, type, handle, displayName };
        })
        .filter(Boolean)
        .sort((a, b) => {
          if (a.type !== b.type) return a.type === "user" ? -1 : 1;
          return a.displayName.localeCompare(b.displayName);
        });
    }

    function truncateMiddle(value, limit = 54) {
      const text = String(value || "");
      if (text.length <= limit) return text;
      const headLength = Math.ceil((limit - 3) * 0.58);
      const tailLength = Math.floor((limit - 3) * 0.42);
      return text.slice(0, headLength).trimEnd() + "..." + text.slice(-tailLength).trimStart();
    }

    function assigneeOptionValue(assignee) {
      return assignee?.id ? `${assignee.type}:${assignee.id}` : "";
    }

    function parseAssigneeOptionValue(value) {
      const [type, ...idParts] = String(value || "").split(":");
      const id = idParts.join(":");
      if ((type === "user" || type === "agent") && id) return { assignee_type: type, assignee_id: id };
      return { assignee_type: null, assignee_id: null };
    }

    function agentOptionLabel(agent) {
      const prefix = agent?.type === "user" ? "User" : "Agent";
      const full = agent?.handle ? `${agent.displayName} (@${agent.handle})` : (agent?.displayName || `Unknown ${prefix.toLowerCase()}`);
      return `${prefix}: ${truncateMiddle(full, 56)}`;
    }

    function currentAssigneeValue(task) {
      const assignee = task?.assignee;
      if (!assignee?.id) return "";
      const type = assignee.type === "user" ? "user" : "agent";
      return `${type}:${assignee.id}`;
    }

    function assigneeOptionLabel(agent) {
      const prefix = agent?.type === "user" ? "User" : "Agent";
      const full = agent?.handle ? `${agent.displayName} (@${agent.handle})` : (agent?.displayName || `Unknown ${prefix.toLowerCase()}`);
      return truncateMiddle(full, 64);
    }

    function assigneeLabel(task) {
      const assignee = task?.assignee;
      if (!assignee) return "Unassigned";
      if (assignee.type === "user") return assignee.display_name || assignee.full_name || assignee.handle || "Assigned user";
      if (assignee.handle) return `@${assignee.handle}`;
      if (assignee.display_name) return assignee.display_name;
      const matched = state.assignees.find((agent) => agent.id && agent.id === assignee.id);
      if (matched) return matched.handle ? `@${matched.handle}` : matched.displayName;
      return assignee.id ? "Assigned" : "Unassigned";
    }

    function actorLabel(actor, fallback = "Not set") {
      if (!actor || typeof actor !== "object") return fallback;
      if (actor.handle) return `@${actor.handle}`;
      if (actor.display_name) return actor.display_name;
      if (actor.name) return actor.name;
      if (actor.username) return `@${actor.username}`;
      return actor.id ? "Set" : fallback;
    }

    function ownerLabel(task) {
      return actorLabel(task?.owner || task?.creator, "Unowned");
    }

    function creatorLabel(task) {
      return actorLabel(task?.creator, "Unknown");
    }

    function formatQueueLabel(value) {
      const queue = String(value || "").trim();
      if (!queue) return "";
      return queue.replace(/_/g, " ").replace(/\b\w/g, (ch) => ch.toUpperCase());
    }

    function taskCopyableRef(task) {
      const structuredRef = task?.task_reference?.copyable_ref;
      if (structuredRef) return String(structuredRef);
      if (task?.task_ref) return String(task.task_ref);
      const displayId = task?.task_display_id || task?.display_id;
      // Backend emits task_legacy for unnumbered tasks; prefer UUID over a non-copyable sentinel.
      if (displayId && displayId !== "task_legacy") return String(displayId);
      return task?.id ? String(task.id) : "";
    }

    function isSafeTaskLink(value) {
      const url = String(value || "").trim();
      return /^https?:\/\//i.test(url) || (url.startsWith("/") && !url.startsWith("//"));
    }

    function isExternalTaskLink(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function taskDeepLink(task) {
      const structuredLink = task?.task_reference?.deep_link;
      if (structuredLink && isSafeTaskLink(structuredLink)) return String(structuredLink);
      const flatLink = task?.task_deep_link;
      if (flatLink && isSafeTaskLink(flatLink)) return String(flatLink);
      const ref = taskCopyableRef(task);
      if (!ref) return "";
      const query = task?.space_id ? `?space_id=${encodeURIComponent(String(task.space_id))}` : "";
      return `/ax/tasks/${encodeURIComponent(ref)}${query}`;
    }

    async function copyTaskRef(task, button) {
      const ref = taskCopyableRef(task);
      if (!ref) return;
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(ref);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = ref;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        try {
          textarea.select();
          const ok = document.execCommand("copy");
          if (!ok) throw new Error("copy command failed");
        } finally {
          textarea.remove();
        }
      }
      if (button) {
        const original = button.textContent;
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = original; }, 1200);
      }
    }

    function latestActivityLabel(activity) {
      if (!Array.isArray(activity) || !activity.length) return "No activity yet";
      const item = activity[0] || {};
      const summary = [item.actor_label, item.summary].filter(Boolean).join(": ");
      if (summary) return shortenSummary(summary, 86);
      if (item.timestamp) return "Updated " + relDate(item.timestamp);
      return "Activity update";
    }

    function provenanceLabel(provenance) {
      if (!provenance || typeof provenance !== "object") return "No linked source";
      if (provenance.label) return provenance.label;
      if (provenance.kind && provenance.id) return `${provenance.kind}: ${truncateMiddle(provenance.id, 34)}`;
      if (provenance.id) return truncateMiddle(provenance.id, 34);
      return "Linked source";
    }

    function isUsefulSignal(value) {
      const text = String(value || "").trim();
      if (!text) return false;
      const normalized = text.toLowerCase().replace(/[.]+$/, "");
      return ![
        "unknown",
        "unowned",
        "unassigned",
        "not queued",
        "no reminder",
        "no reminder armed",
        "no reminder policy configured yet",
        "no supervisor pulse",
        "no linked source",
        "no activity yet",
        "not set",
      ].includes(normalized);
    }

    function appendPulseItem(root, label, value, testId, options = {}) {
      if (!options.always && !isUsefulSignal(value)) return false;
      const item = el("div", { className: "pulse-item", "data-testid": testId });
      item.appendChild(el("div", { className: "pulse-label" }, label));
      item.appendChild(el(
        "div",
        { className: "pulse-value" + (value ? "" : " pulse-muted") },
        value || "Not set",
      ));
      root.appendChild(item);
      return true;
    }

    function renderWorkPulse(detail, task) {
      const pulse = el("div", { className: "work-pulse", "data-testid": "task-work-pulse" });
      let count = 0;
      count += appendPulseItem(pulse, "Owner", ownerLabel(task), "task-work-pulse-owner") ? 1 : 0;
      count += appendPulseItem(pulse, "Assignee", assigneeLabel(task), "task-work-pulse-assignee") ? 1 : 0;
      count += appendPulseItem(pulse, "Supervisor", formatSupervisorPulseLabel(detail, task), "task-work-pulse-supervisor") ? 1 : 0;
      count += appendPulseItem(pulse, "Last received", formatPulseTimestamp(supervisorPulseSource(detail, task).last_received_at), "task-work-pulse-last-received") ? 1 : 0;
      count += appendPulseItem(pulse, "Working", formatSupervisorWorkingLabel(detail, task), "task-work-pulse-working") ? 1 : 0;
      count += appendPulseItem(pulse, "Last result", formatSupervisorResultLabel(detail, task), "task-work-pulse-last-result") ? 1 : 0;
      count += appendPulseItem(pulse, "Backlog", formatSupervisorBacklogLabel(detail, task), "task-work-pulse-backlog") ? 1 : 0;
      count += appendPulseItem(pulse, "Stale", formatStaleDuration(supervisorPulseSource(detail, task).stale_duration_seconds, supervisorPulseSource(detail, task).stale_since), "task-work-pulse-stale") ? 1 : 0;
      count += appendPulseItem(pulse, "Missing", formatMissingSignalsLabel(detail, task), "task-work-pulse-missing-signals") ? 1 : 0;
      count += appendPulseItem(pulse, "Queue", formatQueueLabel(task.queue_state) || "Not queued", "task-work-pulse-queue") ? 1 : 0;
      const pulseReminder = projectedReminder(task, detail);
      count += appendPulseItem(pulse, "Reminder", pulseReminder.label || "No reminder", "task-work-pulse-reminder") ? 1 : 0;
      count += appendPulseItem(pulse, "Latest", latestActivityLabel(detail.activity), "task-work-pulse-activity") ? 1 : 0;
      count += appendPulseItem(pulse, "Source", provenanceLabel(detail.provenance), "task-work-pulse-source") ? 1 : 0;
      if (!count) {
        pulse.className += " is-empty";
        pulse.textContent = "No assignment, reminder, queue, or supervisor activity yet.";
      }
      return pulse;
    }

    function appendDetailField(root, label, value, testId, options = {}) {
      if (!options.always && !isUsefulSignal(value)) return false;
      const field = el("div", { className: "field" + (options.optional ? " optional-signal" : "") });
      field.appendChild(el("div", { className: "field-label" }, label));
      field.appendChild(el("div", { className: "field-value", "data-testid": testId }, value || "Not set"));
      root.appendChild(field);
      return true;
    }

    function stripStateClass(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9_-]+/g, "_");
    }

    function renderStripChip(label, value, stateClass, testId) {
      const chip = el("div", { className: "strip-chip", "data-testid": testId });
      chip.appendChild(el("span", { className: "strip-dot " + stripStateClass(stateClass) }));
      chip.appendChild(el("span", { className: "strip-label" }, label));
      chip.appendChild(el("span", { className: value ? "" : "strip-chip-muted" }, value || "Not set"));
      return chip;
    }

    function renderReminderActionStrip(detail, task) {
      const reminder = projectedReminder(task, detail);
      const reminderState = reminder.state;
      const strip = el("div", { className: "reminder-action-strip", "data-testid": "task-reminder-action-strip" });
      const chips = el("div", { className: "reminder-strip-chips", "data-testid": "task-reminder-strip-chips" });
      chips.appendChild(renderStripChip(
        "Reminder",
        reminder.label || "No reminder armed",
        reminderState,
        "task-reminder-strip-state",
      ));
      chips.appendChild(renderStripChip(
        "Supervisor",
        formatSupervisorPulseLabel(detail, task),
        supervisorPulseState(detail, task),
        "task-supervisor-pulse-state",
      ));
      strip.appendChild(chips);

      const actions = el("div", { className: "strip-actions", "data-testid": "task-reminder-strip-actions" });
      const done = DONE_STATUSES.includes(String(task.status || "").toLowerCase());
      if (done) {
        actions.appendChild(el("button", { className: "strip-action-btn", type: "button", disabled: "disabled", "data-testid": "task-reminder-strip-terminal" }, "Closed"));
      } else {
        const completeBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": "task-reminder-strip-complete" }, "Mark done");
        completeBtn.addEventListener("click", async () => {
          await updateTask(task.id, { status: "completed" });
        });
        actions.appendChild(completeBtn);

        const cancelTaskBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": "task-reminder-strip-cancel-task" }, "Cancel task");
        cancelTaskBtn.addEventListener("click", async () => {
          await updateTask(task.id, { status: "cancelled" });
        });
        actions.appendChild(cancelTaskBtn);
      }
      if (!done) {
        const nudgeBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": "task-reminder-strip-nudge" }, "Nudge now");
        nudgeBtn.addEventListener("click", async () => {
          // Out-of-band nudge: fires immediately even while recurring reminder
          // delivery is paused. Rescheduling next_fire_at silently no-ops under
          // a pause, so it is NOT a substitute for this call.
          await nudgeTask(task.id);
        });
        actions.appendChild(nudgeBtn);
      }

      if (!done && hasArmedReminder(task, detail)) {
        for (const snooze of [
          { label: "Snooze 10m", until: () => minutesFromNowIso(10), testId: "task-reminder-strip-snooze" },
          { label: "Snooze 1h", until: () => minutesFromNowIso(60), testId: "task-reminder-strip-snooze-1h" },
          { label: "Snooze 4h", until: () => minutesFromNowIso(240), testId: "task-reminder-strip-snooze-4h" },
          { label: "Snooze tomorrow 9", until: () => tomorrowMorningIso(9), testId: "task-reminder-strip-snooze-tomorrow" },
          { label: "Snooze 3d", until: () => minutesFromNowIso(3 * 24 * 60), testId: "task-reminder-strip-snooze-3d" },
          { label: "Snooze 1w", until: () => minutesFromNowIso(7 * 24 * 60), testId: "task-reminder-strip-snooze-1w" },
        ]) {
          const snoozeBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": snooze.testId }, snooze.label);
          snoozeBtn.addEventListener("click", async () => {
            const snoozedUntil = snooze.until();
            // Backend treats reminder snooze as postponement of the existing
            // cadence, not enablement for unarmed tasks.
            await updateTask(task.id, { reminder_action: "snooze", snoozed_until: snoozedUntil });
          });
          actions.appendChild(snoozeBtn);
        }

        const indefiniteBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": "task-reminder-strip-snooze-indefinite" }, "Snooze until re-enabled");
        indefiniteBtn.addEventListener("click", async () => {
          await updateTask(task.id, { reminder_action: "snooze", snoozed_until: "9999-12-31T23:59:59.000Z" });
        });
        actions.appendChild(indefiniteBtn);

        const cancelReminderBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": "task-reminder-strip-cancel" }, "Cancel reminder");
        cancelReminderBtn.addEventListener("click", async () => {
          await updateTask(task.id, { reminder_action: "cancel" });
        });
        actions.appendChild(cancelReminderBtn);
      } else if (!done) {
        const scheduleUntilDoneBtn = el("button", { className: "strip-action-btn", type: "button", "data-testid": "task-reminder-strip-schedule-until-done" }, "Remind until done");
        scheduleUntilDoneBtn.addEventListener("click", async () => {
          await updateTask(task.id, { reminder_action: "schedule", reminder_cadence_minutes: 10, reminder_until_done: true, next_fire_at: minutesFromNowIso(10) });
        });
        actions.appendChild(scheduleUntilDoneBtn);
      }
      strip.appendChild(actions);
      return strip;
    }

    const MAX_REMINDER_AUDIT_ROWS = 5;

    function normalizeReminderHistory(reminder, detail) {
      const events = [];
      if (Array.isArray(reminder?.history)) events.push(...reminder.history);
      if (Array.isArray(detail?.activity)) {
        const reminderEventPattern = /reminder|snooze|nudge/i;
        events.push(...detail.activity.filter((item) => {
          const typedEvent = String(item?.type || item?.event || "");
          if (typedEvent) return reminderEventPattern.test(typedEvent);
          return reminderEventPattern.test(String(item?.summary || ""));
        }));
      }
      const timestamp = (item) => new Date(item?.created_at || item?.timestamp || item?.at || item?.fired_at || item?.updated_at || 0).getTime() || 0;
      const deduped = [];
      const seen = new Set();
      for (const event of events) {
        const key = JSON.stringify([
          event?.id || event?.dedupe_key || "",
          event?.event || event?.type || event?.action || "",
          event?.created_at || event?.timestamp || event?.at || event?.fired_at || event?.updated_at || "",
          event?.summary || event?.message || event?.details || "",
        ]);
        if (seen.has(key)) continue;
        seen.add(key);
        deduped.push(event);
      }
      deduped.sort((a, b) => timestamp(b) - timestamp(a));
      return { items: deduped.slice(0, MAX_REMINDER_AUDIT_ROWS), total: deduped.length };
    }

    function reminderAuditLabel(item) {
      const event = item?.event || item?.type || item?.action || item?.summary || "Reminder event";
      const actor = item?.actor_label || item?.actor || item?.created_by || item?.target_assignee || "system";
      const reason = item?.reason || item?.message || item?.details || item?.dedupe_key || "";
      return [String(actor), String(event), reason ? String(reason) : null].filter(Boolean).join(" · ");
    }

    function renderReminderHistoryDrawer(reminder, detail) {
      const drawer = el("details", { className: "metadata-drawer", "data-testid": "task-reminder-history-drawer" });
      drawer.appendChild(el("summary", null, "Reminder history / audit"));
      const history = normalizeReminderHistory(reminder, detail);
      const events = history.items;
      if (!events.length) {
        drawer.appendChild(el("div", { className: "audit-empty", "data-testid": "task-reminder-history-empty" }, "No reminder history returned yet."));
        return drawer;
      }
      for (const item of events) {
        const at = item?.created_at || item?.timestamp || item?.at || item?.fired_at || item?.updated_at;
        const row = el("div", { className: "audit-row", "data-testid": "task-reminder-history-row" });
        row.appendChild(el("strong", null, at ? relDate(at) : "recent"));
        row.appendChild(el("span", null, reminderAuditLabel(item)));
        drawer.appendChild(row);
      }
      if (history.total > events.length) {
        drawer.appendChild(el("div", { className: "audit-empty", "data-testid": "task-reminder-history-truncated" }, `Showing ${events.length} of ${history.total} reminder event(s).`));
      }
      return drawer;
    }

    function timeoutAfter(ms, message) {
      return new Promise((_, reject) => {
        window.setTimeout(() => reject(new Error(message)), ms);
      });
    }

    async function callServerToolWithTimeout(name, args, timeoutMs, message) {
      return Promise.race([
        host.callServerTool(name, args),
        timeoutAfter(timeoutMs, message),
      ]);
    }

    async function ensureAgentsLoaded() {
      if (state.agentsLoaded || state.loadingAgents) return;
      state.loadingAgents = true;
      state.agentsLoadError = null;
      try {
        const memberRes = await callServerToolWithTimeout(
          "spaces",
          { action: "members" },
          10000,
          "Space member list did not respond in time.",
        );
        const assignees = normalizeAssigneeOptions(memberRes);
        if (assignees.length) {
          state.assignees = assignees;
          state.agents = assignees.filter((item) => item.type === "agent");
        } else {
          const agentRes = await callServerToolWithTimeout(
            "agents",
            { action: "list", limit: 100, offset: 0 },
            10000,
            "Agent list did not respond in time.",
          );
          state.agents = normalizeAgentOptions(agentRes).map((agent) => ({ ...agent, type: "agent" }));
          state.assignees = state.agents;
        }
        state.agentsLoaded = true;
      } catch (error) {
