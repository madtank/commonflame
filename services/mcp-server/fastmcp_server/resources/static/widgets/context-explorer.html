<body>
  <div class="shell" id="app"><div class="loading">Loading context...</div></div>
  <script type="module">
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";

    const app = new App({ name: "Context Explorer", version: "1.0.0" });
    const OPENAI_SET_GLOBALS_EVENT = "openai:set_globals";

    function getOpenAiBridge() {
      return typeof window !== "undefined" ? window.openai : undefined;
    }

    function normalizeToolResult(result) {
      if (result && typeof result === "object" && ("structuredContent" in result || "content" in result)) {
        return result;
      }
      return { structuredContent: result };
    }

    function notifyHostHeight() {
      const openaiBridge = getOpenAiBridge();
      if (openaiBridge && typeof openaiBridge.notifyIntrinsicHeight === "function") {
        requestAnimationFrame(() => {
          try {
            const appRoot = document.getElementById("app");
            const bodyStyles = window.getComputedStyle(document.body);
            const paddingTop = parseFloat(bodyStyles.paddingTop || "0") || 0;
            const paddingBottom = parseFloat(bodyStyles.paddingBottom || "0") || 0;
            const contentHeight = appRoot
              ? Math.ceil(appRoot.getBoundingClientRect().height + paddingTop + paddingBottom)
              : Math.ceil(document.body.getBoundingClientRect().height);
            openaiBridge.notifyIntrinsicHeight(Math.max(120, contentHeight));
          } catch {}
        });
      }
    }

    const host = {
      _toolResultHandler: null,
      _globalsListener: null,
      _messageListener: null,
      setToolResultHandler(handler) {
        this._toolResultHandler = handler;
        app.ontoolresult = handler;
        if (!this._messageListener) {
          this._messageListener = (event) => {
            const msg = event?.data || {};
            if (msg.method === "ui/notifications/tool-result" && msg.params) {
              const params = msg.params;
              const payload = params.result ?? params.output ?? params;
              handler(normalizeToolResult(payload));
            } else if (msg.type === "tool_result" && msg.result) {
              handler(normalizeToolResult(msg.result));
            } else if (msg && (Object.prototype.hasOwnProperty.call(msg, "structuredContent") || Object.prototype.hasOwnProperty.call(msg, "kind"))) {
              handler(normalizeToolResult(msg));
            }
          };
          window.addEventListener("message", this._messageListener, { passive: true });
        }
      },
      _deliverToolOutput(globals) {
        const openaiBridge = getOpenAiBridge();
        const output = globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")
          ? globals.toolOutput
          : openaiBridge?.toolOutput;
        if (this._toolResultHandler && output !== undefined) {
          this._toolResultHandler(normalizeToolResult(output));
        }
      },
      async connect() {
        if (!this._globalsListener) {
          this._globalsListener = (event) => {
            const globals = event?.detail?.globals;
            if (globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")) {
              this._deliverToolOutput(globals);
            }
            notifyHostHeight();
          };
          window.addEventListener(OPENAI_SET_GLOBALS_EVENT, this._globalsListener, { passive: true });
        }
        await app.connect();
        this._deliverToolOutput();
        notifyHostHeight();
      },
      async callServerTool(name, args) {
        const openaiBridge = getOpenAiBridge();
        if (openaiBridge && typeof openaiBridge.callTool === "function") {
          return normalizeToolResult(await openaiBridge.callTool(name, args));
        }
        return app.callServerTool({ name, arguments: args });
      },
      setHostCommandHandler(handler) {
        window.addEventListener("message", (event) => {
          let msg = event.data;
          if (!msg) return;
          if (typeof msg === "string") {
            try { msg = JSON.parse(msg); } catch { return; }
          }
          if (!msg || typeof msg !== "object") return;
          if (msg.type === "ax/host-command") {
            handler(msg.command, msg);
          }
        });
      },
    };

    let state = {
      items: [],
      keys: [],
      count: 0,
      selectedKey: null,
      selectedItem: null,
      // Incremented by open/back navigation so stale detail requests cannot
      // overwrite a newer selection.
      detailRequestGeneration: 0,
      loadingList: false,
      loadingDetail: false,
      notice: null,
      debug: null,
      permissions: null,
      spaceContext: null,
      viewMode: "all",
      fileTypeFilter: "",
      query: "",
      restoreSearchFocus: false,
      searchRenderTimer: null,
      topicFilter: "",
      favoriteKeys: new Set(),
      favoriteScope: null,
      vaultKeys: new Set(),
      vaultScope: null,
      htmlMessageAbortController: null,
    };

    function resetHtmlMessageListener() {
      if (!state.htmlMessageAbortController) return;
      state.htmlMessageAbortController.abort();
      state.htmlMessageAbortController = null;
    }

    function h(tag, attrs, text) {
      const e = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === "className") e.className = v;
        else if (k === "style") e.style.cssText = v;
        else if (k === "disabled") e.disabled = !!v;
        else if (k.startsWith("data-")) e.setAttribute(k, v);
        else e.setAttribute(k, v);
      });
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function permissionState() {
      return state.permissions || {};
    }

    function canDeleteContext() {
      return Boolean(permissionState().can_delete);
    }

    function canApproveContext() {
      const perms = permissionState();
      return Boolean(perms.can_create || perms.can_update);
    }

    function itemCanTimeOut(item) {
      if (!item) return false;
      return Boolean(item.ttl) || Boolean(item.expires_at);
    }

    function canPromoteContext() {
      return !isReadOnlyMode();
    }

    function isReadOnlyMode() {
      return Boolean(permissionState().read_only);
    }

    function readOnlyMessage() {
      return permissionState().blocked_reason || "This explorer is currently browse-only.";
    }

    function formatValue(value) {
      if (value === null || value === undefined) return "No value stored.";
      if (typeof value === "string") return value;
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    function shorten(text, limit) {
      const source = String(text || "").replace(/\s+/g, " ").trim();
      return source.length > limit ? source.slice(0, limit - 1) + "..." : source;
    }

    function publicSourceLabel(value) {
      const source = String(value || "").trim().toLowerCase();
      if (!source) return "";
      if (source === "url_fetch") return "Fetched URL";
      if (source === "local") return "Local upload";
      if (source === "message_attachment") return "Message attachment";
      // Internal storage/provenance labels are diagnostics, not user-facing UI.
      if (["redis", "postgres", "postgresql", "database", "s3"].includes(source)) return "";
      if (source.startsWith("axctl_") || source.startsWith("qa_")) return "";
      return "";
    }

    function plainTextSummary(value) {
      const source = String(value || "")
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/[`*_>#-]+/g, " ")
        .replace(/\[[^\]]+\]\([^)]+\)/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
      if (!source) return "";
      const sentence = source.match(/.+?[.!?](\s|$)/);
      return sentence ? sentence[0].trim() : source;
    }

    function relDate(value) {
      if (!value) return "";
      const ts = new Date(value).getTime();
      if (isNaN(ts)) return String(value);
      const diff = Date.now() - ts;
      if (diff < 60000) return "Just now";
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins + "m ago";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      const days = Math.floor(hrs / 24);
      if (days < 14) return days + "d ago";
      return new Date(ts).toLocaleDateString();
    }

    function ttlLabel(item) {
      if (item.expires_at) {
        const diff = Math.round((Number(item.expires_at) * 1000 - Date.now()) / 1000);
        if (diff <= 0) return "expired";
        if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + "m left";
        if (diff < 86400) return Math.round(diff / 3600) + "h left";
        return Math.round(diff / 86400) + "d left";
      }
      if (item.ttl) {
        if (item.ttl < 3600) return item.ttl + "s TTL";
        if (item.ttl < 86400) return Math.round(item.ttl / 3600) + "h TTL";
        return Math.round(item.ttl / 86400) + "d TTL";
      }
      return "No TTL";
    }

    function inferTopic(item) {
      if (item.topic) return item.topic;
      const key = item.key || "";
      const token = key.split(/[:/]/).find(Boolean);
      return token || "general";
    }

    function spaceScopeId() {
      const ctx = state.spaceContext || {};
      return String(ctx.id || ctx.space_id || ctx.slug || ctx.name || "default");
    }

    function favoriteStorageKey() {
      return "ax-context-explorer:favorites:" + spaceScopeId();
    }

    function vaultStorageKey() {
      return "ax-context-explorer:vault-keys:" + spaceScopeId();
    }

    function loadFavoritesForCurrentSpace() {
      const scope = favoriteStorageKey();
      if (state.favoriteScope === scope) return;
      state.favoriteScope = scope;
      try {
        const raw = window.localStorage && window.localStorage.getItem(scope);
        const parsed = raw ? JSON.parse(raw) : [];
        state.favoriteKeys = new Set(Array.isArray(parsed) ? parsed.filter((key) => typeof key === "string") : []);
      } catch {
        state.favoriteKeys = new Set();
      }
    }

    function saveFavoritesForCurrentSpace() {
      try {
        window.localStorage && window.localStorage.setItem(favoriteStorageKey(), JSON.stringify([...state.favoriteKeys].sort()));
      } catch {
        // Storage can be unavailable in some embedded hosts; favorites remain session-local.
      }
    }

    function loadVaultKeysForCurrentSpace() {
      const scope = vaultStorageKey();
      if (state.vaultScope === scope) return;
      state.vaultScope = scope;
      try {
        const raw = window.localStorage && window.localStorage.getItem(scope);
        const parsed = raw ? JSON.parse(raw) : [];
        state.vaultKeys = new Set(Array.isArray(parsed) ? parsed.filter((key) => typeof key === "string") : []);
      } catch {
        state.vaultKeys = new Set();
      }
    }

    function saveVaultKeysForCurrentSpace() {
      try {
        window.localStorage && window.localStorage.setItem(vaultStorageKey(), JSON.stringify([...state.vaultKeys].sort()));
      } catch {
        // Storage can be unavailable in some embedded hosts; vault markers remain session-local.
      }
    }

    function markKeyAsVault(key) {
      if (!key) return;
      loadVaultKeysForCurrentSpace();
      state.vaultKeys.add(String(key));
      saveVaultKeysForCurrentSpace();
    }

    function isVaultItem(item) {
      const key = String(item.key || "");
      const storage = String(item.storage || "").toLowerCase();
      return (
        state.vaultKeys.has(key)
        || storage === "vault"
        || storage === "intelligence"
        || storage === "workspace_intelligence"
        || key.toLowerCase().startsWith("vault/")
      );
    }

    function hasExpiry(item) {
      if (isVaultItem(item)) return false;
      return Boolean(item.expires_at || item.ttl);
    }

    function contextExpiryLabel(item) {
      // Keep the vault guard client-side too: standalone fixtures and older
      // server responses may still carry expiry fields before normalization.
      if (isVaultItem(item)) return "Permanent";
      if (hasExpiry(item)) return ttlLabel(item);
      return "Permanent";
    }

    function isFavoriteItem(item) {
      const key = String(item.key || "");
      return state.favoriteKeys.has(key) || key.toLowerCase().startsWith("favorite/") || item.favorite === true || item.pinned === true;
    }

    function isExpiringItem(item) {
      return hasExpiry(item);
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      state.selectedKey = null;
      state.selectedItem = null;
      render();
    }

    function setTopicFilter(topic) {
      state.topicFilter = state.topicFilter === topic ? "" : topic;
      state.selectedKey = null;
      state.selectedItem = null;
      render();
    }

    function toggleFavorite(item) {
      if (!item?.key) return;
      loadFavoritesForCurrentSpace();
      if (state.favoriteKeys.has(item.key)) state.favoriteKeys.delete(item.key);
      else state.favoriteKeys.add(item.key);
      saveFavoritesForCurrentSpace();
      render();
    }

    function titleForItem(item) {
      if (item.subject) return item.subject;
      const value = resolvedItemValue(item);
      if (value && typeof value === "object") {
        const uploadValue = uploadValueFor(value);
        if (uploadValue && uploadValue.filename) return uploadValue.filename;
        const candidates = [value.subject, value.title, value.name, value.summary];
        for (const candidate of candidates) {
          if (typeof candidate === "string" && candidate.trim()) return candidate.trim();
        }
      }
      const key = item.key || "untitled";
      const segments = key.split(/[:/]/).filter(Boolean);
      return segments[segments.length - 1] || key;
    }

    function parseJsonString(value) {
      if (typeof value !== "string") return null;
      const trimmed = value.trim();
      if (!trimmed || (trimmed[0] !== "{" && trimmed[0] !== "[")) return null;
      try {
        return JSON.parse(trimmed);
      } catch {
        return null;
      }
    }

    function resolvedItemValue(item) {
      const val = item?.value;
      // Direct string parse
      const parsed = parseJsonString(val);
      if (parsed !== null) return parsed;
      // If value is an object with a nested 'value' string, try parsing that
      if (val && typeof val === "object" && typeof val.value === "string") {
        const innerParsed = parseJsonString(val.value);
        if (innerParsed !== null) return innerParsed;
      }
      if (val === undefined && item?.file_upload && typeof item.file_upload === "object" && !Array.isArray(item.file_upload)) {
        return { ...item.file_upload, type: item.file_upload.type || "file_upload" };
      }
      return val;
    }

    function contextKindLabel(uploadValue, htmlValue, item) {
      if (uploadValue) return uploadKindLabel(uploadValue);
      if (htmlValue) return "HTML";
      return itemArtifactKindLabel(item) || inferTopic(item);
    }

    function firstString(value, keys) {
      if (!value || typeof value !== "object") return "";
      for (const key of keys) {
        const candidate = value[key];
        if (typeof candidate === "string" && candidate.trim()) return candidate.trim();
      }
      return "";
    }

    function normalizedToken(value) {
      return String(value || "").trim().toLowerCase().replace(/[\s_-]+/g, "_");
    }

    // Keep in sync with the server-side context normalizer; the widget also
    // handles legacy responses that have not been normalized yet.
    const DECLARED_UPLOAD_CONTENT_TYPES = {
      audio: "audio/*",
      csv: "text/csv",
      file: "application/octet-stream",
      image: "image/*",
      json: "application/json",
      markdown: "text/markdown",
      md: "text/markdown",
      pdf: "application/pdf",
      svg: "image/svg+xml",
      text: "text/plain",
      txt: "text/plain",
      video: "video/*",
      xml: "application/xml",
    };

    function declaredContentTypeFor(value) {
      const declared = firstString(value, ["type", "kind", "artifact_type", "artifact kind"]);
      if (!declared) return "";
      if (declared.includes("/")) return declared;
      return DECLARED_UPLOAD_CONTENT_TYPES[normalizedToken(declared)] || "";
    }

    function firstNumber(value, keys) {
      if (!value || typeof value !== "object") return null;
      for (const key of keys) {
        const candidate = value[key];
        if (typeof candidate === "number" && Number.isFinite(candidate)) return candidate;
      }
      return null;
    }

    function contentTypeFor(value) {
      const explicit = firstString(value, [
        "content_type",
        "content type",
        "contentType",
        "mime_type",
        "mime type",
        "mimeType",
        "resource_mime_type",
        "resource mime type",
        "resourceMimeType",
        "media_type",
        "media type",
        "mediaType",
        "file_type",
        "file type",
        "fileType",
      ]);
      if (explicit) return explicit;
      return contentTypeFromFilename(value) || declaredContentTypeFor(value);
    }

    function fileUrlFor(value) {
      return firstString(value, [
        "url",
        "href",
        "download_url",
        "download url",
        "downloadUrl",
        "file_url",
        "file url",
        "fileUrl",
        "resource_url",
        "resource url",
        "resourceUrl",
        "src",
        "data_url",
        "data url",
        "dataUrl",
      ]);
    }

    function fileNameFor(value) {
      return firstString(value, [
        "filename",
        "file_name",
        "file name",
        "fileName",
        "name",
        "title",
      ]);
    }

    function fileSizeFor(value) {
      return firstNumber(value, ["size", "size_bytes", "size bytes", "sizeBytes", "byte_size", "byte size", "byteSize", "bytes"]);
    }

    function contentTypeFromFilename(value) {
      const source = (fileNameFor(value) || fileUrlFor(value)).toLowerCase().split(/[?#]/)[0];
      if (!source) return "";
      if (source.endsWith(".html") || source.endsWith(".htm")) return "text/html";
      if (source.endsWith(".jpg") || source.endsWith(".jpeg")) return "image/jpeg";
      if (source.endsWith(".png")) return "image/png";
      if (source.endsWith(".gif")) return "image/gif";
      if (source.endsWith(".webp")) return "image/webp";
      if (source.endsWith(".avif")) return "image/avif";
      if (source.endsWith(".svg")) return "image/svg+xml";
      if (source.endsWith(".pdf")) return "application/pdf";
      if (source.endsWith(".md") || source.endsWith(".markdown")) return "text/markdown";
      if (source.endsWith(".json")) return "application/json";
      if (source.endsWith(".txt") || source.endsWith(".log")) return "text/plain";
      if (source.endsWith(".mp3")) return "audio/mpeg";
      if (source.endsWith(".wav")) return "audio/wav";
      if (source.endsWith(".mp4")) return "video/mp4";
      if (source.endsWith(".webm")) return "video/webm";
      return "";
    }

    function filenameFromContextKey(key) {
      const tokens = String(key || "").split(/[:/\\]+/).reverse();
      for (const token of tokens) {
        const candidate = token.trim().split("?")[0].split("#")[0];
        if (candidate && contentTypeFromFilename({ filename: candidate })) return candidate;
      }
      return "";
    }

    function isUploadLocatorString(value) {
      return /^(https?:\/\/|data:)/i.test(String(value || "").trim());
    }

    function hasExplicitUploadMetadata(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return false;
      // Keep this list in sync with _EXPLICIT_FILE_UPLOAD_METADATA_KEYS in
      // fastmcp_server/tools/context.py; test_widget_call_contract.py enforces
      // the cross-language set equality.
      return [
        "attachment_id",
        "attachment id",
        "attachmentId",
        "base64",
        "content base64",
        "content_base64",
        "contentBase64",
        "content type",
        "content_type",
        "contentType",
        "data base64",
        "data url",
        "data_base64",
        "data_url",
        "dataBase64",
        "dataUrl",
        "download url",
        "download_url",
        "downloadUrl",
        "file name",
        "file type",
        "file url",
        "file_name",
        "file_type",
        "file_url",
        "fileName",
        "fileType",
        "fileUrl",
        "filename",
        "media type",
        "media_type",
        "mediaType",
        "mime type",
        "mime_type",
        "mimeType",
        "resource mime type",
        "resource url",
        "resource_mime_type",
        "resource_url",
        "resourceMimeType",
        "resourceUrl",
      ].some((key) => Object.prototype.hasOwnProperty.call(value, key));
    }

    function uploadValueFromContextKey(key, value) {
      const filename = filenameFromContextKey(key);
      const contentType = contentTypeFromFilename({ filename });
      if (!filename || !contentType) return null;

      if (typeof value === "string") {
        if (isUploadLocatorString(value)) {
          return { type: "file_upload", filename, content_type: contentType, url: value.trim() };
        }
        if (isInlineTextUploadContentType(contentType)) {
          return { type: "file_upload", filename, content_type: contentType, content: value };
        }
        return null;
      }

      if (!value || typeof value !== "object" || Array.isArray(value)) return null;
      if (contentType === "application/json" && !hasExplicitUploadMetadata(value)) {
        return {
          type: "file_upload",
          filename,
          content_type: contentType,
          content: JSON.stringify(value, null, 2),
        };
      }
      return uploadValueFor({
        ...value,
        type: value.type || "file_upload",
        filename: fileNameFor(value) || filename,
        content_type: contentTypeFor(value) || contentType,
      });
    }

    function inlineUploadDataUrlFor(value, contentType) {
      if (!value || typeof value !== "object") return "";
      const dataUrl = firstString(value, ["data_url", "data url", "dataUrl"]);
      if (dataUrl.toLowerCase().startsWith("data:")) return dataUrl;

      const base64 = firstString(value, [
        "content_base64",
        "content base64",
        "contentBase64",
        "data_base64",
        "data base64",
        "dataBase64",
        "base64",
      ]);
      if (base64) {
        return "data:" + (contentType || "application/octet-stream") + ";base64," + base64.replace(/\s+/g, "");
      }

      const text = firstString(value, ["content", "body", "text"]);
      const ct = String(contentType || "").toLowerCase();
      if (text && isInlineTextUploadContentType(ct)) {
        return "data:" + (contentType || "text/plain") + ";charset=utf-8," + encodeURIComponent(text);
      }
      return "";
    }

    function isInlineTextUploadContentType(contentType) {
      const ct = String(contentType || "").toLowerCase();
      return ct.startsWith("text/")
        || ct === "application/json"
        || ct === "application/xml"
        || ct === "image/svg+xml";
    }

    function itemArtifactText(item) {
      return [
        firstString(item, ["artifact_type", "artifact_kind", "content_type", "mime_type", "resource_mime_type"]),
        item?.summary || "",
        item?.description || "",
        item?.value_preview || "",
      ].join(" ").toLowerCase();
    }

    function itemArtifactKindLabel(item) {
      const text = itemArtifactText(item);
      if (!text.trim()) return "";
      if (text.includes("html") || text.includes("text/html")) return "HTML";
      if (text.includes("pdf") || text.includes("application/pdf")) return "PDF";
      if (text.includes("markdown") || text.endsWith(".md")) return "Markdown";
      if (text.includes("image/") || /\.(avif|gif|jpe?g|png|svg|webp)\b/.test(text)) return "Image";
      if (text.includes("video/") || /\.(mp4|webm)\b/.test(text)) return "Video";
      if (text.includes("audio/") || /\.(mp3|wav)\b/.test(text)) return "Audio";
      if (text.includes("application/json") || text.endsWith(".json")) return "JSON";
      if (text.includes("text/") || /\.(log|txt)\b/.test(text)) return "Text";
      return "";
    }

    function itemArtifactGlyph(item) {
      const label = itemArtifactKindLabel(item);
      if (label === "Markdown") return "MD";
      if (label === "Image") return "IMG";
      if (label === "Video") return "VID";
      if (label === "Audio") return "AUD";
      if (label === "PDF") return "PDF";
      if (label === "JSON") return "{}";
      if (label === "Text") return "TXT";
      if (label === "HTML") return "HTML";
      return "CTX";
    }

    function htmlValueFor(value) {
      if (typeof value === "string") {
        const trimmed = value.trim();
        if (trimmed.toLowerCase().startsWith("<!doctype html") || trimmed.toLowerCase().startsWith("<html")) {
          return { type: "html", html: value };
        }
        return null;
      }
      if (!value || typeof value !== "object" || Array.isArray(value)) return null;
      const declared = [
        firstString(value, ["type", "kind", "artifact_type"]),
        contentTypeFor(value),
      ].some((candidate) => {
        const normalized = candidate.toLowerCase();
        return normalized === "html" || normalized === "text/html" || normalized.endsWith(".html");
      });
      const html = typeof value.html === "string"
        ? value.html
        : declared && typeof value.content === "string"
          ? value.content
          : declared && typeof value.body === "string"
            ? value.body
            : "";
      if (!html) return null;
      return { ...value, type: "html", html };
    }

    function uploadValueFor(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return null;
      if (htmlValueFor(value)) return null;
      const contentType = contentTypeFor(value);
      const url = fileUrlFor(value) || inlineUploadDataUrlFor(value, contentType);
      const filename = fileNameFor(value);
      const size = fileSizeFor(value);
      const declaredType = normalizedToken(value.type);
      const declaredKind = normalizedToken(value.kind);
      const declaredContentType = declaredContentTypeFor(value);
      const explicitlyFile = declaredType === "file_upload"
        || declaredType === "file"
        || declaredType === "attachment"
        || declaredKind === "file"
        || declaredKind === "attachment";
      const declaredTextType = declaredType === "text" || declaredType === "txt";
      const hasUrlLocator = Boolean(fileUrlFor(value)) && !declaredTextType;
      const hasInlineBinaryPayload = Boolean(
        "data_url" in value
        || "data url" in value
        || "dataUrl" in value
        || "content_base64" in value
        || "content base64" in value
        || "contentBase64" in value
        || "data_base64" in value
        || "data base64" in value
        || "dataBase64" in value
        || "base64" in value
      );
      const hasInlineTextPayload = Boolean(
        "content" in value || "body" in value || "data" in value || "text" in value
      );
      const hasFileMetadata = Boolean(
        size !== null
        || "filename" in value
        || "file_name" in value
        || "file name" in value
        || "fileName" in value
        || "content_type" in value
        || "content type" in value
        || "contentType" in value
        || "mime_type" in value
        || "mime type" in value
        || "mimeType" in value
        || "resource_mime_type" in value
        || "resource mime type" in value
        || "resourceMimeType" in value
        || "media_type" in value
        || "media type" in value
        || "mediaType" in value
        || "file_type" in value
        || "file type" in value
        || "fileType" in value
        || "download_url" in value
        || "download url" in value
        || "downloadUrl" in value
        || "file_url" in value
        || "file url" in value
        || "fileUrl" in value
        || "resource_url" in value
        || "resource url" in value
        || "resourceUrl" in value
        || "data_url" in value
        || "data url" in value
        || "dataUrl" in value
        || "content_base64" in value
        || "content base64" in value
        || "contentBase64" in value
        || "data_base64" in value
        || "data base64" in value
        || "dataBase64" in value
        || "base64" in value
      );
      const hasDeclaredUploadEvidence = Boolean(
        declaredContentType && (
          filename
          || size !== null
          || hasUrlLocator
          || hasInlineBinaryPayload
          || (hasInlineTextPayload && !declaredTextType && isInlineTextUploadContentType(contentType))
        )
      );
      if (!explicitlyFile && !hasFileMetadata && !hasDeclaredUploadEvidence) return null;
      return {
        ...value,
        type: "file_upload",
        content_type: contentType || value.content_type || "application/octet-stream",
        url: url || value.url || "",
        filename: filename || value.filename || "",
        size: size ?? value.size,
      };
    }

    function isFileUploadValue(value) {
      return Boolean(uploadValueFor(value));
    }

    function isHtmlValue(value) {
      return Boolean(htmlValueFor(value));
    }

    function shouldRenderHtml() {
      const ctx = state.spaceContext;
      if (!ctx || typeof ctx !== "object") return true;
      if (ctx.allow_html_render === false) return false;
      return true;
    }

    function isImageContentType(contentType) {
      return typeof contentType === "string" && contentType.toLowerCase().startsWith("image/");
    }

    function isRasterImageContentType(contentType) {
      if (typeof contentType !== "string") return false;
      return [
        "image/avif",
        "image/gif",
        "image/jpeg",
        "image/png",
        "image/webp",
      ].includes(contentType.toLowerCase());
    }

    const MAX_UPLOAD_OBJECT_URL_CACHE_ENTRIES = 16;
    const uploadObjectUrlCache = new Map();

    function uploadObjectUrlCacheKey(url, contentType) {
      return String(contentType || "") + "\n" + String(url || "");
    }

    function getStoredUserToken() {
      const keys = [
        "ax_development_userToken",
        "ax_dev_userToken",
        "ax_local_userToken",
        "ax_staging_userToken",
        "ax_production_userToken",
        "auth_token",
        "userToken",
      ];
      const stores = [];
      try {
        if (window.localStorage) stores.push(window.localStorage);
      } catch {
        // Some future iframe sandbox modes may block localStorage access.
      }
      try {
        if (window.sessionStorage) stores.push(window.sessionStorage);
      } catch {
        // Same as above for sessionStorage.
      }
      function readToken(store, key) {
        try {
          const token = store && store.getItem(key);
          if (token) return token;
        } catch {
          // Storage can be unavailable in some embedded hosts.
        }
        return null;
      }
      for (const key of keys) {
        for (const store of stores) {
          const token = readToken(store, key);
          if (token) return token;
        }
      }
      return null;
    }

    function isInlineUploadUrl(url) {
      const normalized = String(url || "").trim().toLowerCase();
      return normalized.startsWith("data:") || normalized.startsWith("blob:");
    }

    function shouldIncludeUploadCredentials(url) {
      if (!url || isInlineUploadUrl(url)) return false;
      try {
        const target = new URL(url, window.location.href);
        const currentHost = String(window.location.hostname || "").toLowerCase();
        const targetHost = String(target.hostname || "").toLowerCase();
        if (target.origin === window.location.origin) return true;
        const loopbackHosts = ["localhost", "127.0.0.1", "::1"];
        const currentIsLocal = loopbackHosts.includes(currentHost) || window.location.protocol === "file:";
        // Keep cross-origin cookies loopback-to-loopback only. This supports
        // local MCP/browser tests, including file:// harnesses with no host,
        // without letting production widgets attach cookies to arbitrary
        // services on a user's localhost.
        return currentIsLocal && loopbackHosts.includes(targetHost);
      } catch {
        return false;
      }
    }

    function shouldIncludeUploadAuthorization(url) {
      if (!url || isInlineUploadUrl(url)) return false;
      try {
        const target = new URL(url, window.location.href);
        if (target.origin === window.location.origin) return true;
        const loopbackHosts = ["localhost", "127.0.0.1", "::1"];
        const targetHost = String(target.hostname || "").toLowerCase();
        const currentHost = String(window.location.hostname || "").toLowerCase();
        const currentIsLocal = loopbackHosts.includes(currentHost) || window.location.protocol === "file:";
        const targetIsLocalUploadApi = currentIsLocal && loopbackHosts.includes(targetHost);
        return targetIsLocalUploadApi && target.pathname.startsWith("/api/v1/uploads/");
      } catch {
        return false;
      }
    }

    function rememberUploadObjectUrl(cacheKey, objectUrl) {
      if (uploadObjectUrlCache.has(cacheKey)) {
        const previous = uploadObjectUrlCache.get(cacheKey);
        if (previous && previous !== objectUrl) URL.revokeObjectURL(previous);
        uploadObjectUrlCache.delete(cacheKey);
      }
      uploadObjectUrlCache.set(cacheKey, objectUrl);
      while (uploadObjectUrlCache.size > MAX_UPLOAD_OBJECT_URL_CACHE_ENTRIES) {
        const oldestKey = uploadObjectUrlCache.keys().next().value;
        const oldestObjectUrl = uploadObjectUrlCache.get(oldestKey);
        uploadObjectUrlCache.delete(oldestKey);
        if (oldestObjectUrl) URL.revokeObjectURL(oldestObjectUrl);
      }
      return objectUrl;
    }

    async function blobLooksLikePdf(blob) {
      const bytes = new Uint8Array(await blob.slice(0, 1024).arrayBuffer());
      for (let index = 0; index <= bytes.length - 5; index += 1) {
        if (
          bytes[index] === 0x25
          && bytes[index + 1] === 0x50
          && bytes[index + 2] === 0x44
          && bytes[index + 3] === 0x46
          && bytes[index + 4] === 0x2d
        ) return true;
      }
      return false;
    }

    async function fetchUploadObjectUrl(url, contentType) {
      if (!url) throw new Error("Missing upload URL");
      const headers = {};
      const token = shouldIncludeUploadAuthorization(url) ? getStoredUserToken() : "";
      if (token) headers.Authorization = "Bearer " + token;
      const fetchOptions = { headers };
      if (!token && shouldIncludeUploadCredentials(url)) {
        fetchOptions.credentials = "include";
      }
      const response = await fetch(url, fetchOptions);
      if (!response.ok) throw new Error("Upload fetch failed: " + response.status);
      let blob = await response.blob();
      const expectedType = String(contentType || "").toLowerCase();
      const actualType = String(blob.type || "").toLowerCase();
      const expectedIsText = /^text\//i.test(String(contentType || ""));
      if (expectedType === "application/pdf") {
        if (!(await blobLooksLikePdf(blob))) {
          throw new Error("Upload payload is not a PDF document");
        }
        blob = new Blob([blob], { type: contentType });
      } else if (
        contentType
        && (
          !actualType
          || actualType === "application/octet-stream"
          || (actualType === "text/plain" && !expectedIsText)
        )
      ) {
        blob = new Blob([blob], { type: contentType });
      }
      return URL.createObjectURL(blob);
    }

    async function resolveUploadObjectUrl(url, contentType) {
      if (!url) throw new Error("Missing upload URL");
      const cacheKey = uploadObjectUrlCacheKey(url, contentType);
      if (uploadObjectUrlCache.has(cacheKey)) {
        const objectUrl = uploadObjectUrlCache.get(cacheKey);
        uploadObjectUrlCache.delete(cacheKey);
        uploadObjectUrlCache.set(cacheKey, objectUrl);
        return objectUrl;
      }
      return rememberUploadObjectUrl(cacheKey, await fetchUploadObjectUrl(url, contentType));
    }

    function hydrateUploadImage(img, url, contentType) {
      resolveUploadObjectUrl(url, contentType)
        .then((objectUrl) => { img.src = objectUrl; })
        .catch(() => {
          img.src = url;
          img.dataset.loadState = "fallback";
        });
    }

    function hydrateUploadSource(element, url, contentType) {
      const reloadElement = function(src, state) {
        element.dataset.loadState = state;
        element.src = src;
        if (typeof element.load === "function") {
          element.load();
        }
      };
      resolveUploadObjectUrl(url, contentType)
        .then((objectUrl) => { reloadElement(objectUrl, "loaded"); })
        .catch(() => {
          reloadElement(url, "fallback");
        });
    }

    function hydratePdfSource(frame, url, contentType) {
      resolveUploadObjectUrl(url, contentType)
        .then((objectUrl) => {
          if (!String(objectUrl || "").startsWith("blob:")) {
            throw new Error("PDF source must be hydrated as a blob URL");
          }
          frame.dataset.loadState = "loaded";
          frame.src = objectUrl;
        })
        .catch(() => {
          frame.dataset.loadState = "error";
        });
    }

    function fetchUploadText(url) {
      // Data URLs: decode inline (UTF-8 safe) with no network fetch. The sandbox
      // CSP can block fetch() of data:/blob: (connect-src); images survive via an
      // img.src fallback, but text has none — so decoding here is what stops
      // md/json/csv from failing with "Could not load file".
      if (typeof url === "string" && url.slice(0, 5).toLowerCase() === "data:") {
        try {
          const comma = url.indexOf(",");
          if (comma === -1) return Promise.reject(new Error("malformed data URL"));
          const meta = url.slice(5, comma);
          const raw = url.slice(comma + 1);
          if (/;base64/i.test(meta)) {
            const bin = atob(raw);
            const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
            return Promise.resolve(new TextDecoder().decode(bytes));
          }
          return Promise.resolve(decodeURIComponent(raw));
        } catch (err) {
          return Promise.reject(err);
        }
      }
      if (isInlineUploadUrl(url)) {
        return fetch(url).then(function(r) { return r.ok ? r.text() : Promise.reject(r.status); });
      }
      return resolveUploadObjectUrl(url)
        .then((objectUrl) => fetch(objectUrl))
        .catch(() => {
          // Public/signed URLs can still render without a local auth token.
          // Auth-gated URLs fail closed with a non-ok response and show a load error.
          return fetch(url);
        })
        .then(function(r) { return r.ok ? r.text() : Promise.reject(r.status); });
    }

    function openUploadUrl(url) {
      resolveUploadObjectUrl(url)
        .then((objectUrl) => window.open(objectUrl, "_blank", "noopener,noreferrer"))
        .catch(() => window.open(url, "_blank", "noopener,noreferrer"));
    }

    function triggerUploadDownload(url, filename, options) {
      const link = document.createElement("a");
      link.href = url;
      link.download = filename || "download";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      link.remove();
      if (options && options.revokeAfterClick) {
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
      }
    }

    function downloadUploadUrl(url, filename) {
      fetchUploadObjectUrl(url)
        .then((objectUrl) => triggerUploadDownload(objectUrl, filename, { revokeAfterClick: true }))
        .catch(() => triggerUploadDownload(url, filename));
    }

    function handleUploadAction(uploadValue) {
      if (!uploadValue || !uploadValue.url) return;
      if (isRasterImageContentType(uploadValue.content_type)) {
        openUploadUrl(uploadValue.url);
        return;
      }
      downloadUploadUrl(uploadValue.url, uploadValue.filename);
    }

    function isVideoContentType(contentType) {
      return typeof contentType === "string" && contentType.toLowerCase().startsWith("video/");
    }

    function isAudioContentType(contentType) {
      return typeof contentType === "string" && contentType.toLowerCase().startsWith("audio/");
    }

    function isPdfContentType(contentType) {
      return typeof contentType === "string" && contentType.toLowerCase() === "application/pdf";
    }

    function isMarkdownContentType(contentType) {
      if (typeof contentType !== "string") return false;
      const ct = contentType.toLowerCase();
      return ct === "text/markdown" || ct === "text/x-markdown";
    }

    function isTextContentType(contentType) {
      if (typeof contentType !== "string") return false;
      const ct = contentType.toLowerCase();
      return ct.startsWith("text/") || ct === "application/json" || ct === "application/xml";
    }

    function isRenderableUpload(contentType) {
      return isImageContentType(contentType) || isVideoContentType(contentType) ||
             isAudioContentType(contentType) || isPdfContentType(contentType) ||
             isMarkdownContentType(contentType) || isTextContentType(contentType);
    }

    function uploadKindLabel(uploadValue) {
      // Strip MIME parameters (e.g. "text/html; charset=utf-8") so exact media-type
      // comparisons below match parameterized content types, not just bare ones.
      const contentType = String(uploadValue?.content_type || "").toLowerCase().split(";")[0].trim();
      if (isMarkdownContentType(contentType)) return "Markdown";
      if (contentType === "image/svg+xml") return "SVG";
      if (isImageContentType(contentType)) return "Image";
      if (isVideoContentType(contentType)) return "Video";
      if (isAudioContentType(contentType)) return "Audio";
      if (isPdfContentType(contentType)) return "PDF";
      if (contentType === "application/json") return "JSON";
      if (contentType === "text/html") return "HTML";
      if (contentType === "text/csv") return "CSV";
      if (isTextContentType(contentType)) return "Text";
      return contentType ? "File" : "Unknown";
    }

    function fileTypeKeyForItem(item) {
      const value = resolvedItemValue(item);
      const uploadValue = uploadValueFor(value);
      if (uploadValue) {
        const label = uploadKindLabel(uploadValue).toLowerCase();
        if (label === "unknown") return "file";
        return label;
      }
      if (htmlValueFor(value)) return "html";
      const label = itemArtifactKindLabel(item).toLowerCase();
      return label || "context";
    }

    function fileTypeLabel(type) {
      const labels = {
        audio: "Audio",
        context: "Context",
        csv: "CSV",
        file: "File",
        html: "HTML",
        image: "Image",
        json: "JSON",
        markdown: "Markdown",
        pdf: "PDF",
        svg: "SVG",
        text: "Text",
        video: "Video",
      };
      return labels[type] || (type ? type.charAt(0).toUpperCase() + type.slice(1) : "All types");
    }

    function uploadGlyph(uploadValue) {
      const label = uploadKindLabel(uploadValue);
      if (label === "Markdown") return "MD";
      if (label === "Image") return "IMG";
      if (label === "Video") return "VID";
      if (label === "Audio") return "AUD";
      if (label === "PDF") return "PDF";
      if (label === "JSON") return "{}";
      if (label === "HTML") return "HTML";
      if (label === "CSV") return "CSV";
      if (label === "Text") return "TXT";
      if (label === "SVG") return "SVG";
      return "FILE";
    }

    function publicActorLabel(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      return text.replace(/^(user|agent):/i, "");
    }

    function renderEntryThumb(item, uploadValue, htmlValue) {
      const thumb = h("div", { className: "entry-preview-thumb" });
      if (uploadValue && isImageContentType(uploadValue.content_type) && uploadValue.url) {
        const img = h("img", { alt: uploadValue.filename || item.key || "Context image" });
        hydrateUploadImage(img, uploadValue.url, uploadValue.content_type);
        thumb.appendChild(img);
        return thumb;
      }
      thumb.appendChild(h("span", null, uploadValue ? uploadGlyph(uploadValue) : htmlValue ? "HTML" : itemArtifactGlyph(item)));
      return thumb;
    }

    // Lightweight markdown → HTML (covers 90% of cases, zero dependencies)
    function renderMarkdown(text) {
      if (typeof text !== "string") return "";
      let html = text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        // Headers
        .replace(/^### (.+)$/gm, "<h4>$1</h4>")
        .replace(/^## (.+)$/gm, "<h3>$1</h3>")
        .replace(/^# (.+)$/gm, "<h2>$1</h2>")
        // Bold/italic
        .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        // Code
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre class="md-code"><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code class="md-inline">$1</code>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        // Lists
        .replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>")
        .replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>")
        // Horizontal rule
        .replace(/^---+$/gm, "<hr>")
        // Paragraphs (double newline)
        .replace(/\n\n/g, "</p><p>")
        // Single newlines → <br>
        .replace(/\n/g, "<br>");
      return "<p>" + html + "</p>";
    }

    function formatBytes(size) {
      if (typeof size !== "number" || !Number.isFinite(size) || size < 0) return "Unknown";
      if (size < 1024) return size + " B";
      const units = ["KB", "MB", "GB", "TB"];
      let value = size;
      let unitIndex = -1;
      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }
      const rounded = value >= 10 || unitIndex === 0 ? Math.round(value * 10) / 10 : Math.round(value * 100) / 100;
      return rounded + " " + units[unitIndex];
    }

    function previewForItem(item) {
      const value = resolvedItemValue(item);
      const uploadValue = uploadValueFor(value);
      if (uploadValue) {
        if (typeof item.summary === "string" && item.summary.trim()) {
          return shorten(item.summary, 140);
        }
        const parts = [uploadKindLabel(uploadValue)];
        if (uploadValue.content_type) parts.push(uploadValue.content_type);
        if (typeof uploadValue.size === "number") parts.push(formatBytes(uploadValue.size));
        return parts.join(" • ");
      }
      const htmlValue = htmlValueFor(value);
      if (htmlValue) {
        if (typeof item.summary === "string" && item.summary.trim()) {
          return shorten(plainTextSummary(item.summary), 120);
        }
        return "Sandboxed HTML document";
      }
      const artifactLabel = itemArtifactKindLabel(item);
      if (artifactLabel) return artifactLabel + " artifact";
      if (typeof item.value_preview === "string" && item.value_preview.trim()) {
        return shorten(plainTextSummary(item.value_preview), 120);
      }
      if (typeof item.note_preview === "string" && item.note_preview.trim()) {
        return shorten(plainTextSummary(item.note_preview), 120);
      }
      if (typeof item.summary === "string" && item.summary.trim()) {
        return shorten(plainTextSummary(item.summary), 120);
      }
      if (typeof value === "string" && value.trim()) {
        return shorten(plainTextSummary(value), 120);
      }
      if (value && typeof value === "object") {
        return shorten(plainTextSummary(formatValue(value)), 120);
      }
      return "No preview available yet.";
    }

    function initials(text) {
      const cleaned = String(text || "").trim();
      if (!cleaned) return "?";
      const parts = cleaned.split(/[\s:_/-]+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function toneForSeed(seed) {
      let hash = 0;
      const text = String(seed || "context");
      for (let i = 0; i < text.length; i += 1) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      const hue = hash % 360;
      return {
        background: "background: hsla(" + hue + ", 78%, 90%, 0.9);",
        border: "border-color: hsla(" + hue + ", 48%, 54%, 0.38);",
        color: "color: hsl(" + hue + ", 46%, 24%);",
      };
    }

    function sortItems(items) {
      return [...items].sort((a, b) => {
        const aTime = new Date(a.updated_at || a.created_at || 0).getTime();
        const bTime = new Date(b.updated_at || b.created_at || 0).getTime();
        if (aTime !== bTime) return bTime - aTime;
        return (a.key || "").localeCompare(b.key || "");
      });
    }

    function mergeItem(items, nextItem) {
      const merged = [];
      let replaced = false;
      for (const item of items) {
        if (item.key === nextItem.key) {
          merged.push({ ...item, ...nextItem });
          replaced = true;
        } else {
          merged.push(item);
        }
      }
      if (!replaced) merged.unshift(nextItem);
      return sortItems(merged);
    }

    function summarize(items) {
      const topics = new Set();
      let scratchpads = 0;
      let expiringSoon = 0;
      for (const item of items) {
        topics.add(inferTopic(item));
        if (inferTopic(item) === "scratchpad") scratchpads += 1;
        if (hasExpiry(item) && item.expires_at && Number(item.expires_at) * 1000 - Date.now() < 6 * 3600 * 1000) {
          expiringSoon += 1;
        }
      }
      return {
        topics: topics.size,
        scratchpads,
        expiringSoon,
      };
    }

    function topTopics(items) {
      const counts = new Map();
      for (const item of items) {
        const topic = inferTopic(item);
        counts.set(topic, (counts.get(topic) || 0) + 1);
      }
      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 6);
    }

    function groupedItems(items) {
      const groups = new Map();
      for (const item of items) {
        const topic = inferTopic(item);
        if (!groups.has(topic)) groups.set(topic, []);
        groups.get(topic).push(item);
      }
      return [...groups.entries()]
        .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
        .map(([topic, topicItems]) => ({ topic, items: sortItems(topicItems) }));
    }

    function searchableText(item) {
      return [
        item.key,
        titleForItem(item),
        previewForItem(item),
        inferTopic(item),
        fileTypeLabel(fileTypeKeyForItem(item)),
        item.storage,
        item.agent_name,
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function viewCounts(items) {
      return {
        all: items.length,
        favorites: items.filter(isFavoriteItem).length,
        vault: items.filter(isVaultItem).length,
        expiring: items.filter(isExpiringItem).length,
      };
    }

    function itemsForView(items, mode = state.viewMode) {
      if (mode === "favorites") return items.filter(isFavoriteItem);
      if (mode === "vault") return items.filter(isVaultItem);
      if (mode === "expiring") return items.filter(isExpiringItem);
      return items;
    }

    function filterItems(items) {
      const query = String(state.query || "").trim().toLowerCase();
      return sortItems(itemsForView(items))
        .filter((item) => !state.topicFilter || inferTopic(item) === state.topicFilter)
        .filter((item) => !state.fileTypeFilter || fileTypeKeyForItem(item) === state.fileTypeFilter)
        .filter((item) => !query || searchableText(item).includes(query));
    }

    function fileTypeCounts(items) {
      const counts = new Map();
      for (const item of items) {
        const type = fileTypeKeyForItem(item);
        counts.set(type, (counts.get(type) || 0) + 1);
      }
      return [...counts.entries()].sort((a, b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        return fileTypeLabel(a[0]).localeCompare(fileTypeLabel(b[0]));
      });
    }

    function viewLabel(mode) {
      if (mode === "favorites") return "Favorites";
      if (mode === "vault") return "Vault";
      if (mode === "expiring") return "Expiring";
      return "All";
    }

    const CONTEXT_WRAPPER_KEYS = [
      "action",
      "count",
      "detail",
      "entries",
      "error",
      "items",
      "keys",
      "kind",
      "limit",
      "message",
      "offset",
      "results",
      "status",
      "version",
    ];

    function looksLikeWrappedValue(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return false;
      if (!Object.prototype.hasOwnProperty.call(value, "value") && !Object.prototype.hasOwnProperty.call(value, "value_preview")) {
        return false;
      }
      return [
        "agent_name",
        "artifact_kind",
        "artifact_type",
        "content_type",
        "created_at",
        "expires_at",
        "mime_type",
        "resource_mime_type",
        "source",
        "storage",
        "summary",
        "summary_snippet",
        "topic",
        "ttl",
        "updated_at",
        "value_preview",
      ].some((key) => Object.prototype.hasOwnProperty.call(value, key));
    }

    function normalizeItem(raw, defaultKey) {
      if (typeof raw === "string") {
        return { key: raw, value: undefined };
      }
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
        return { key: defaultKey || "", value: raw };
      }

      const item = { key: typeof raw.key === "string" ? raw.key : (defaultKey || "") };
      const payload = looksLikeWrappedValue(raw.value) ? raw.value : raw;

      if (looksLikeWrappedValue(payload)) {
        if (Object.prototype.hasOwnProperty.call(payload, "value")) item.value = payload.value;
        if (typeof payload.value_preview === "string") item.value_preview = payload.value_preview;
      } else if (Object.prototype.hasOwnProperty.call(raw, "value")) {
        item.value = raw.value;
      }

      const metaKeys = [
        "agent_name",
        "artifact_kind",
        "artifact_type",
        "content_type",
        "created_at",
        "expires_at",
        "mime_type",
        "resource_mime_type",
        "source",
        "storage",
        "summary",
        "summary_snippet",
        "topic",
        "ttl",
        "updated_at",
        "value_preview",
        "value_omitted",
        "value_size",
        "value_type",
        "file_upload",
        "status",
      ];
      for (const key of metaKeys) {
        if (Object.prototype.hasOwnProperty.call(payload, key)) item[key] = payload[key];
        else if (Object.prototype.hasOwnProperty.call(raw, key)) item[key] = raw[key];
      }

      const resolvedValue = resolvedItemValue(item);
      if (resolvedValue && typeof resolvedValue === "object" && !Array.isArray(resolvedValue)) {
        if (typeof resolvedValue.subject === "string" && resolvedValue.subject.trim()) item.subject = resolvedValue.subject.trim();
        if (typeof resolvedValue.note === "string" && resolvedValue.note.trim()) item.note_preview = resolvedValue.note.trim();
        if (typeof resolvedValue.summary === "string" && resolvedValue.summary.trim()) item.summary = resolvedValue.summary.trim();
      }

      if (!uploadValueFor(item.value) && !htmlValueFor(item.value)) {
        const inferredUpload = uploadValueFromContextKey(item.key, item.value);
        if (inferredUpload) item.value = inferredUpload;
      }

      return item;
    }

    function normalizeKeys(keys) {
      if (!Array.isArray(keys)) return [];
      return keys
        .map((entry) => {
          if (typeof entry === "string") return entry.trim();
          if (entry && typeof entry === "object" && typeof entry.key === "string") return entry.key.trim();
          return "";
        })
        .filter(Boolean);
    }

    function normalizeItems(items) {
      if (!Array.isArray(items)) return [];
      return items
        .filter((item) => item && typeof item === "object" && !Array.isArray(item))
        .map((item) => normalizeItem(item))
        .filter((item) => typeof item.key === "string" && item.key.trim());
    }

    function looksLikeContextMap(payload) {
      if (!payload || typeof payload !== "object" || Array.isArray(payload)) return false;
      const entries = Object.entries(payload).filter(([key]) => !CONTEXT_WRAPPER_KEYS.includes(key));
      if (!entries.length) return false;
      return entries.some(([key, value]) => (
        looksLikeWrappedValue(value)
        || typeof value === "string"
        || typeof value === "number"
        || typeof value === "boolean"
        || (value && typeof value === "object" && !Array.isArray(value))
      ) && (key.includes(":") || key.includes("/") || key.includes("_") || key.includes("-")));
    }

    function buildCanonicalPayload(payload, source) {
      if (!payload || typeof payload !== "object" || Array.isArray(payload)) return null;

      const hasCanonicalFields = payload.kind === "context"
        || typeof payload.action === "string"
        || Array.isArray(payload.items)
        || Array.isArray(payload.keys);
      if (!hasCanonicalFields) return null;

      const items = normalizeItems(payload.items);
      const keys = normalizeKeys(payload.keys);
      return {
        kind: "context",
        version: typeof payload.version === "number" ? payload.version : 1,
        action: typeof payload.action === "string" ? payload.action : "list",
        items,
        keys: keys.length ? keys : items.map((item) => item.key).filter(Boolean),
        count: typeof payload.count === "number" ? payload.count : (keys.length || items.length),
        selected_key: typeof payload.selected_key === "string" ? payload.selected_key : null,
        notice: payload.notice && typeof payload.notice === "object" ? payload.notice : null,
        permissions: payload.permissions && typeof payload.permissions === "object" ? payload.permissions : null,
        space_context: payload.space_context && typeof payload.space_context === "object" ? payload.space_context : null,
        source,
      };
    }

    function buildLegacyPayload(payload, source) {
      if (!payload || typeof payload !== "object" || Array.isArray(payload)) return null;

      if (payload.context && typeof payload.context === "object" && !Array.isArray(payload.context)) {
        const items = Object.entries(payload.context).map(([key, value]) => normalizeItem({ value }, key));
        return {
          kind: "context",
          version: 1,
          action: "list",
          items,
          keys: items.map((item) => item.key).filter(Boolean),
          count: typeof payload.count === "number" ? payload.count : items.length,
          selected_key: typeof payload.selected_key === "string" ? payload.selected_key : null,
          notice: payload.notice && typeof payload.notice === "object" ? payload.notice : null,
          permissions: payload.permissions && typeof payload.permissions === "object" ? payload.permissions : null,
          space_context: payload.space_context && typeof payload.space_context === "object" ? payload.space_context : null,
          source,
        };
      }

      if (typeof payload.key === "string") {
        const item = normalizeItem(payload);
        return {
          kind: "context",
          version: 1,
          action: "get",
          items: [item],
          keys: [item.key],
          count: 1,
          selected_key: typeof payload.selected_key === "string" ? payload.selected_key : item.key,
          notice: payload.notice && typeof payload.notice === "object" ? payload.notice : null,
          permissions: payload.permissions && typeof payload.permissions === "object" ? payload.permissions : null,
          space_context: payload.space_context && typeof payload.space_context === "object" ? payload.space_context : null,
          source,
        };
      }

      if (looksLikeContextMap(payload)) {
        const items = Object.entries(payload)
          .filter(([key]) => !CONTEXT_WRAPPER_KEYS.includes(key))
          .map(([key, value]) => normalizeItem({ value }, key));
        return {
          kind: "context",
          version: 1,
          action: "list",
          items,
          keys: items.map((item) => item.key).filter(Boolean),
          count: typeof payload.count === "number" ? payload.count : items.length,
          selected_key: typeof payload.selected_key === "string" ? payload.selected_key : null,
          notice: payload.notice && typeof payload.notice === "object" ? payload.notice : null,
          source,
        };
      }

      return null;
    }

    function extractRawPayload(result) {
      if (result && result.rawPayload && typeof result.rawPayload === "object") return result.rawPayload;
      const blocks = Array.isArray(result?.content) ? result.content : [];
      for (const block of blocks) {
        if (!block || block.type !== "text" || typeof block.text !== "string") continue;
        try {
          const parsed = JSON.parse(block.text);
          return parsed.structuredContent || parsed;
        } catch {}
      }
      return null;
    }

    function extractData(result) {
      const structured = result?.structuredContent && typeof result.structuredContent === "object"
        ? result.structuredContent
        : null;
      const raw = extractRawPayload(result);
      return (
        buildCanonicalPayload(structured, "structuredContent")
        || buildCanonicalPayload(raw, "raw-content")
        || buildLegacyPayload(structured, "structured-legacy")
        || buildLegacyPayload(raw, "raw-legacy")
      );
    }

    function unwrapV2(data) {
      // Unwrap v2 envelope: {kind, version, state, data: {...}, actions}
      if (data && data.version && data.data && typeof data.data === "object") return data.data;
      return data;
    }


    function buildDebugInfo(result, data) {
      const structured = result?.structuredContent && typeof result.structuredContent === "object"
        ? result.structuredContent
        : null;
      const raw = extractRawPayload(result);
      return {
        rendered_items: Array.isArray(data?.items) ? data.items.length : 0,
        rendered_keys: Array.isArray(data?.keys) ? data.keys.length : 0,
        structured_keys: structured ? Object.keys(structured).slice(0, 12) : [],
        raw_keys: raw && typeof raw === "object" ? Object.keys(raw).slice(0, 12) : [],
        count: data?.count,
        action: data?.action,
        source: data?.source,
      };
    }

    function buildDisplayItems(items = state.items, keys = state.keys) {
      if (items.length) return items;
      return [];
    }

    function applyListData(data) {
      const items = sortItems(unwrapV2(data).items || []);
      const keys = Array.isArray(data.keys)
        ? normalizeKeys(data.keys)
        : items.map((item) => item.key).filter(Boolean);
      state.items = items;
      state.keys = keys;
      state.count = typeof data.count === "number" ? data.count : items.length;

      const displayItems = buildDisplayItems(items, keys);
      if (state.selectedKey) {
        const selected = displayItems.find((item) => item.key === state.selectedKey);
        state.selectedItem = selected || null;
        if (!selected) state.selectedKey = null;
      } else {
        state.selectedItem = null;
      }
    }

    function handleToolResult(result, options = {}) {
      const data = extractData(result);
      if (!data) {
        state.loadingList = false;
        return;
      }
      state.permissions = data.permissions || state.permissions;
      state.spaceContext = data.space_context || state.spaceContext;
      loadFavoritesForCurrentSpace();
      loadVaultKeysForCurrentSpace();
      state.debug = buildDebugInfo(result, data);
      if (data.notice?.message) {
        state.notice = data.notice;
      }
      if (typeof window !== "undefined") {
        window.__axContextDebug = {
          result,
          data,
          debug: state.debug,
        };
      }

      if (data.action === "get" && data.items && data.items.length === 1) {
        const item = data.items[0];
        if (options.expectedKey && item.key !== options.expectedKey) return;
        state.items = mergeItem(state.items, item);
        if (!state.keys.includes(item.key)) state.keys = [...state.keys, item.key].sort();
        state.selectedKey = item.key;
        state.selectedItem = state.items.find((entry) => entry.key === item.key) || item;
        state.loadingList = false;
        state.loadingDetail = false;
        render();
        return;
      }

      applyListData(data);
      if (data.selected_key) {
        const selected = buildDisplayItems().find((item) => item.key === data.selected_key);
        state.selectedKey = data.selected_key;
        state.selectedItem = selected || null;
      }
      state.loadingList = false;
      state.loadingDetail = false;
      render();
    }

    async function loadList(notice) {
      if (state.loadingList) return;
      if (notice) state.notice = notice;
      state.loadingList = true;
      state.loadingDetail = false;
      render();
      try {
        // Request a larger page than the agent default (50) so a human can browse
        // a whole space; the server caps this at its hard max. Rows are metadata-only.
        handleToolResult(await host.callServerTool("context", { action: "list", limit: 200 }));
      } catch {
        state.loadingList = false;
        state.loadingDetail = false;
        state.notice = { severity: "error", message: "Unable to load context." };
        render();
      }
    }

    function showAllContext() {
      cancelSearchRender();
      state.detailRequestGeneration += 1;
      closeHtmlFullscreenOverlays({ suppressFocus: true });
      state.selectedKey = null;
      state.selectedItem = null;
      state.loadingDetail = false;
      state.viewMode = "all";
      state.fileTypeFilter = "";
      state.topicFilter = "";
      state.query = "";
      state.notice = null;
      resetHtmlMessageListener();
      render();
    }

    async function openItem(item) {
      const requestGeneration = state.detailRequestGeneration + 1;
      state.detailRequestGeneration = requestGeneration;
      state.selectedKey = item.key;
      state.selectedItem = state.items.find((entry) => entry.key === item.key) || item;
      state.loadingDetail = true;
      state.notice = null;
      render();
      try {
        const result = await host.callServerTool("context", { action: "get", key: item.key });
        if (
          state.detailRequestGeneration !== requestGeneration
          || state.selectedKey !== item.key
        ) {
          return;
        }
        handleToolResult(result, { expectedKey: item.key });
      } catch (error) {
        if (
          state.detailRequestGeneration !== requestGeneration
          || state.selectedKey !== item.key
        ) {
          return;
        }
        state.loadingDetail = false;
        state.notice = {
          severity: "error",
          message: "Unable to load " + item.key + ".",
        };
        render();
      }
    }

    async function deleteSelected() {
      if (!state.selectedItem?.key) return;
      if (!canDeleteContext()) {
        state.notice = { severity: "error", message: readOnlyMessage() };
        render();
        return;
      }
      const key = state.selectedItem.key;
      if (typeof window !== "undefined" && typeof window.confirm === "function") {
        const confirmed = window.confirm("Delete context entry '" + key + "'?");
        if (!confirmed) return;
      }

      state.loadingDetail = true;
      render();
      try {
        handleToolResult(await host.callServerTool("context", { action: "delete", key }));
      } catch {
        state.loadingDetail = false;
        state.notice = { severity: "error", message: "Delete failed for " + key + "." };
        render();
      }
    }

    async function approveSelected() {
      if (!state.selectedItem?.key) return;
      if (!canApproveContext()) {
        state.notice = { severity: "error", message: readOnlyMessage() };
        render();
        return;
      }
      const key = state.selectedItem.key;
      state.loadingDetail = true;
      render();
      try {
        handleToolResult(await host.callServerTool("context", { action: "approve", key }));
      } catch {
        state.loadingDetail = false;
        state.notice = { severity: "error", message: "Approve failed for " + key + "." };
        render();
      }
    }

    async function declineSelected() {
      if (!state.selectedItem?.key) return;
      if (!canDeleteContext()) {
        state.notice = { severity: "error", message: readOnlyMessage() };
        render();
        return;
      }
      const key = state.selectedItem.key;
      if (typeof window !== "undefined" && typeof window.confirm === "function") {
        const confirmed = window.confirm("Decline and remove context entry '" + key + "'?");
        if (!confirmed) return;
      }
      state.loadingDetail = true;
      render();
      try {
        handleToolResult(await host.callServerTool("context", { action: "decline", key }));
      } catch {
        state.loadingDetail = false;
        state.notice = { severity: "error", message: "Decline failed for " + key + "." };
        render();
      }
    }

    async function promoteSelected() {
      if (!state.selectedItem?.key) return;
      if (!canPromoteContext()) {
        state.notice = { severity: "error", message: readOnlyMessage() };
        render();
        return;
      }
      const key = state.selectedItem.key;
      state.loadingDetail = true;
      render();
      try {
        const result = await host.callServerTool("context", {
          action: "promote",
          key,
        });
        const data = extractData(result);
        const promoted = data?.notice?.code === "context_promoted"
          || (Array.isArray(data?.items) && data.items.some((item) => item.key === key && isVaultItem(item)));
        if (!promoted) {
          state.loadingDetail = false;
          state.notice = data?.notice?.message
            ? data.notice
            : { severity: "error", message: "Promote failed for " + key + "." };
          render();
          return;
        }
        const promotedItem = Array.isArray(data?.items)
          ? data.items.find((item) => item.key === key)
          : null;
        if (promotedItem) {
          state.items = mergeItem(state.items, promotedItem);
        }
        markKeyAsVault(key);
        await loadList(data?.notice?.message
          ? data.notice
          : { severity: "success", message: "Promoted context \"" + key + "\" to vault." });
      } catch {
        state.loadingDetail = false;
        state.notice = { severity: "error", message: "Promote failed for " + key + "." };
        render();
      }
    }

      root.appendChild(h("div", { className: cls }, state.notice.message));

      const lines = [

    function restoreSearchFocusIfNeeded() {
      if (!state.restoreSearchFocus) return;
      state.restoreSearchFocus = false;
      requestAnimationFrame(() => {
        const input = document.querySelector('[data-testid="context-search-input"]');
        if (!(input instanceof HTMLInputElement)) return;
        input.focus();
        const position = input.value.length;
        try {
          input.setSelectionRange(position, position);
        } catch {}
      });
    }

    function cancelSearchRender() {
      if (!state.searchRenderTimer) return;
      clearTimeout(state.searchRenderTimer);
      state.searchRenderTimer = null;
    }

    function scheduleSearchRender(input) {
      cancelSearchRender();
      state.searchRenderTimer = setTimeout(() => {
        state.searchRenderTimer = null;
        state.restoreSearchFocus = document.activeElement === input;
        render();
      }, 80);
    }

    const MARKDOWN_ALLOWED_TAGS = new Set([
      "a", "blockquote", "br", "code", "del", "em", "h1", "h2", "h3", "h4", "h5", "h6",
      "hr", "img", "li", "ol", "p", "pre", "s", "strong", "table", "tbody", "td",
      "th", "thead", "tr", "ul",
    ]);
    const MARKDOWN_ALLOWED_ATTRS = {
      a: new Set(["href", "title"]),
      code: new Set(["class"]),
      img: new Set(["alt", "src", "title"]),
      td: new Set(["align"]),
      th: new Set(["align"]),
    };
    const MARKDOWN_ALLOWED_URL_ATTRS = new Set(["href", "src"]);

    function isUnsafeMarkdownUrl(value) {
      const normalized = String(value).trim().replace(/[\u0000-\u001F\u007F\s]+/g, "").toLowerCase();
      if (!normalized) return false;
      if (normalized.startsWith("javascript:") || normalized.startsWith("data:")) return true;
      const schemeMatch = normalized.match(/^([a-z][a-z0-9+.-]*):/);
      // blob: is allowed only for this page's object URLs created from fetched
      // uploads; every other explicit non-web scheme is stripped.
      return Boolean(schemeMatch && !["http:", "https:", "blob:"].includes(schemeMatch[0]));
    }

    function sanitizeMarkdownFragment(frag) {
      frag.querySelectorAll("*").forEach(function(el) {
        if (!frag.contains(el)) return;
        const tag = el.tagName.toLowerCase();
        if (!MARKDOWN_ALLOWED_TAGS.has(tag)) {
          el.replaceWith(document.createTextNode(el.textContent || ""));
          return;
        }

        const allowedAttrs = MARKDOWN_ALLOWED_ATTRS[tag] || null;
        for (var a of [...el.attributes]) {
          const attr = a.name.toLowerCase();
          if (attr.startsWith("on") || !allowedAttrs || !allowedAttrs.has(attr)) {
            el.removeAttribute(a.name);
            continue;
          }
          if (MARKDOWN_ALLOWED_URL_ATTRS.has(attr) && isUnsafeMarkdownUrl(a.value)) {
            el.removeAttribute(a.name);
          }
        }

        if (tag === "a" && el.getAttribute("href")) {
          el.setAttribute("target", "_blank");
          el.setAttribute("rel", "noopener noreferrer");
        }
      });
    }

    function appendSafeMarkdown(container, text) {
      var rendered = renderMarkdown(text);
      var tpl = document.createElement("template");
      tpl.innerHTML = rendered;
      var frag = tpl.content;
      sanitizeMarkdownFragment(frag);
      container.textContent = "";
      container.appendChild(frag);
    }
