        ["Filename", uploadValue.filename || "Unknown"],
        ["Type", uploadValue.content_type || "Unknown"],
        ["Size", formatBytes(uploadValue.size)],
        ["Attachment ID", uploadValue.attachment_id || "-"],
      ]);

      const provenance = [];
      if (item.key) provenance.push(["Context key", item.key]);
      if (item.agent_name) provenance.push(["Author", item.agent_name]);
      const detailDate = relDate(item.updated_at || item.created_at);
      if (detailDate) provenance.push(["Updated", detailDate]);
      provenance.push(["Expires", contextExpiryLabel(item)]);
      const sourceLabel = publicSourceLabel(item.source);
      if (sourceLabel) provenance.push(["Source", sourceLabel]);
      appendUploadMeta(body, provenance);

      const actions = h("div", { className: "artifact-detail-actions" });
      if (uploadValue.url) {
        const uploadLink = h("button", { className: "btn", type: "button" },
          isRasterImageContentType(uploadValue.content_type) ? "Open full image" : "Download file");
        uploadLink.addEventListener("click", function() { handleUploadAction(uploadValue); });
        actions.appendChild(uploadLink);
      }
      const refresh = h("button", { className: "btn", type: "button", disabled: state.loadingDetail }, "Refresh");
      refresh.addEventListener("click", () => openItem(item));
      actions.appendChild(refresh);
      appendApprovalActions(actions, item, "document");
      if (canDeleteContext()) {
        const deleteBtn = h("button", { className: "btn btn-danger", type: "button", disabled: state.loadingDetail }, "Delete");
        deleteBtn.addEventListener("click", deleteSelected);
        actions.appendChild(deleteBtn);
      }
      body.appendChild(actions);
      details.appendChild(body);
      return details;
    }

    function renderArtifactPanel() {
      const item = state.selectedItem;
      const uploadValue = uploadValueFor(resolvedItemValue(item));
      const panel = h("section", { className: "artifact-panel" });
      const toolbar = h("div", { className: "artifact-toolbar" });

      const stage = h("div", { className: "artifact-stage" });
      if (uploadValue && isImageContentType(uploadValue.content_type) && uploadValue.url) {
        const img = h("img", {
          className: "artifact-image",
          alt: uploadValue.filename || "Uploaded image",
        });
        hydrateUploadImage(img, uploadValue.url, uploadValue.content_type);
        stage.appendChild(img);
      } else if (uploadValue && isVideoContentType(uploadValue.content_type) && uploadValue.url) {
        const video = h("video", { className: "artifact-video", controls: true, preload: "metadata" });
        hydrateUploadSource(video, uploadValue.url, uploadValue.content_type);
        stage.appendChild(video);
      } else if (uploadValue && isAudioContentType(uploadValue.content_type) && uploadValue.url) {
        const card = h("div", { className: "artifact-audio-card" });
        card.appendChild(h("div", { className: "artifact-file-title" }, uploadValue.filename || "Audio"));
        const audio = h("audio", { className: "upload-audio", controls: true, preload: "metadata" });
        const status = h("div", { className: "artifact-media-status", role: "status" }, "Loading audio preview...");
        audio.addEventListener("loadedmetadata", () => {
          status.classList.remove("is-error");
          status.textContent = "Audio preview ready.";
        });
        audio.addEventListener("error", () => {
          status.classList.add("is-error");
          status.textContent = "Audio preview could not load. Open or download the file from Details.";
        });
        hydrateUploadSource(audio, uploadValue.url, uploadValue.content_type);
        card.appendChild(audio);
        card.appendChild(status);
        stage.appendChild(card);
      } else if (uploadValue && isPdfContentType(uploadValue.content_type) && uploadValue.url) {
        stage.className = "artifact-stage is-pdf";
        const viewer = h("div", { className: "artifact-pdf-viewer" });
        const frame = h("iframe", {
          className: "artifact-pdf",
          title: uploadValue.filename || item.key || "PDF document",
        });
        // Chrome's native PDF viewer needs same-origin inside a sandboxed blob
        // frame. hydratePdfSource never falls back to the original upload URL,
        // so the wider sandbox only applies to object URLs we created here.
        // HTML artifacts remain sandboxed in their stricter srcdoc renderer.
        frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-downloads");
        frame.setAttribute("referrerpolicy", "no-referrer");
        hydratePdfSource(frame, uploadValue.url, uploadValue.content_type);
        viewer.appendChild(frame);
        stage.appendChild(viewer);

        const controlBox = h("div", { className: "artifact-control-box" });
        controlBox.setAttribute("role", "group");
        controlBox.setAttribute("aria-label", "PDF actions");
        const controlTitle = h("div", { className: "artifact-control-title" });
        controlTitle.appendChild(h("strong", null, uploadValue.filename || item.key || "PDF document"));
        controlTitle.appendChild(h("span", null, "PDF / " + formatBytes(uploadValue.size)));
        controlBox.appendChild(controlTitle);
        const controlActions = h("div", { className: "artifact-control-actions" });
        const openBtn = h("button", { className: "btn", type: "button" }, "Open");
        openBtn.addEventListener("click", function() { openUploadUrl(uploadValue.url); });
        controlActions.appendChild(openBtn);
        const downloadBtn = h("button", { className: "btn", type: "button" }, "Download");
        downloadBtn.addEventListener("click", function() { downloadUploadUrl(uploadValue.url, uploadValue.filename); });
        controlActions.appendChild(downloadBtn);
        const fullscreenBtn = h("button", { className: "btn", type: "button" }, "Fullscreen");
        fullscreenBtn.addEventListener("click", function() {
          if (document.fullscreenElement === viewer && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
            return;
          }
          if (viewer.requestFullscreen) {
            viewer.requestFullscreen().catch(function() {
              viewer.classList.add("is-focused");
              viewer.scrollIntoView({ block: "center", behavior: "smooth" });
            });
            return;
          }
          viewer.classList.add("is-focused");
          viewer.scrollIntoView({ block: "center", behavior: "smooth" });
        });
        controlActions.appendChild(fullscreenBtn);
        controlBox.appendChild(controlActions);
        toolbar.appendChild(controlBox);
      } else if (uploadValue && isMarkdownContentType(uploadValue.content_type) && uploadValue.url) {
        stage.className = "artifact-stage is-document";
        const mdContainer = h("div", { className: "artifact-document upload-markdown" }, "Loading markdown...");
        stage.appendChild(mdContainer);
        fetchUploadText(uploadValue.url)
          .then(function(text) { appendSafeMarkdown(mdContainer, text); })
          .catch(function() { mdContainer.textContent = "Could not load markdown file."; });
      } else if (uploadValue && isTextContentType(uploadValue.content_type) && uploadValue.url) {
        stage.className = "artifact-stage is-document";
        const pre = h("div", { className: "artifact-document artifact-text" }, "Loading...");
        stage.appendChild(pre);
        fetchUploadText(uploadValue.url)
          .then(function(text) { pre.textContent = text; })
          .catch(function() { pre.textContent = "Could not load file."; });
      } else if (uploadValue) {
        const card = h("div", { className: "artifact-file-card" });
        card.appendChild(h("div", { className: "artifact-file-title" }, uploadValue.filename || item.key || "Uploaded file"));
        const typeBadge = h("div", { className: "detail-badges" });
        typeBadge.appendChild(h("span", { className: "mini-pill" }, uploadValue.content_type || "file"));
        typeBadge.appendChild(h("span", { className: "mini-pill neutral" }, formatBytes(uploadValue.size)));
        card.appendChild(typeBadge);
        stage.appendChild(card);
      } else {
        stage.appendChild(h("div", { className: "artifact-file-card" }, "This context item is not a file upload."));
      }

      if (toolbar.childElementCount > 0) {
        // Only PDFs currently add the floating control box to this toolbar.
        // The embedding shell owns return navigation via the context/all host
        // command, keeping MCP app headers consistent across widgets.
        panel.appendChild(toolbar);
      }
      panel.appendChild(stage);
      if (uploadValue) {
        panel.appendChild(renderArtifactDetails(item, uploadValue));
      }
      return panel;
    }

    function renderDetailPanel() {
      const panel = h("section", { className: "panel detail-panel context-detail-panel" });

      if (!state.selectedItem) {
        const header = h("div", { className: "panel-header" });
        const titleBlock = h("div");
        titleBlock.appendChild(h("div", { className: "panel-title" }, "Context detail"));
        titleBlock.appendChild(h("div", { className: "panel-subtitle" }, "Choose an entry to open its full value."));
        header.appendChild(titleBlock);
        panel.appendChild(header);

        const empty = h("div", { className: "detail-empty" });
        empty.appendChild(h("strong", null, "Pick a context row"));
        empty.appendChild(h(
          "p",
          null,
          "Choose a summary row to inspect the full stored value, metadata, and expiry details."
        ));
        panel.appendChild(empty);
        return panel;
      }

      const item = state.selectedItem;
      const displayValue = resolvedItemValue(item);
      const uploadValue = uploadValueFor(displayValue);
      const htmlValue = (!uploadValue && shouldRenderHtml()) ? htmlValueFor(displayValue) : null;

      const managementActions = h("div", { className: "detail-action-bar" });
      const favoriteBtn = h(
        "button",
        { className: "btn", type: "button", disabled: state.loadingDetail },
        isFavoriteItem(item) ? "Favorited" : "Favorite"
      );
      favoriteBtn.addEventListener("click", () => toggleFavorite(item));
      managementActions.appendChild(favoriteBtn);
      const promoteBtn = h("button", {
        className: "btn",
        type: "button",
        disabled: state.loadingDetail || !canPromoteContext() || isVaultItem(item),
        title: isVaultItem(item) ? "Already in the vault" : (canPromoteContext() ? "Save this context entry to the durable vault" : readOnlyMessage()),
      }, isVaultItem(item) ? "In vault" : "Promote to vault");
      promoteBtn.addEventListener("click", promoteSelected);
      managementActions.appendChild(promoteBtn);
      panel.appendChild(managementActions);

      // --- CONTENT-FIRST LAYOUT for sandboxed HTML ---
      if (htmlValue) {
        const hero = h("div", { className: "upload-hero" });
        const chrome = h("div", { className: "html-card-chrome" });
        chrome.appendChild(h("span", { className: "sandbox-label" }, "Sandboxed HTML"));
        const toolbar = h("div", { className: "toolbar" });
        const reloadBtn = h("button", { className: "tool-btn", type: "button", title: "Reload and reset card state" }, "Reload");
        const rawBtn = h("button", { className: "tool-btn", type: "button", title: "View raw HTML source" }, "View raw");
        const fullscreenBtn = h("button", {
          className: "tool-btn",
          type: "button",
          title: "Open HTML preview fullscreen",
          "aria-label": "Open fullscreen",
        }, "Fullscreen");
        const copyKeyBtn = h("button", { className: "tool-btn", type: "button", title: "Copy context key" }, "Copy key");
        toolbar.appendChild(reloadBtn);
        toolbar.appendChild(rawBtn);
        toolbar.appendChild(fullscreenBtn);
        toolbar.appendChild(copyKeyBtn);
        chrome.appendChild(toolbar);
        hero.appendChild(chrome);

        const stage = h("div", { className: "html-stage" });

        function createSandboxedIframe() {
          const frame = document.createElement("iframe");
          frame.className = "html-iframe";
          frame.setAttribute("sandbox", "allow-scripts");
          frame.setAttribute("referrerpolicy", "no-referrer");
          frame.setAttribute("loading", "lazy");
          frame.setAttribute("title", "Sandboxed HTML: " + (item.key || "context entry"));
          frame.setAttribute("data-context-key", item.key || "");
          frame.srcdoc = htmlValue.html;
          return frame;
        }

        function buildIframe() {
          const frame = createSandboxedIframe();
          stage.replaceChildren(frame);
          return frame;
        }
        let iframe = buildIframe();

        reloadBtn.addEventListener("click", () => {
          iframe = buildIframe();
        });

        let rawShown = false;
        rawBtn.addEventListener("click", () => {
          if (rawShown) {
            iframe = buildIframe();
            rawBtn.textContent = "View raw";
            rawShown = false;
          } else {
            const pre = document.createElement("pre");
            pre.className = "html-raw";
            pre.textContent = htmlValue.html;
            stage.replaceChildren(pre);
            rawBtn.textContent = "View rendered";
            rawShown = true;
          }
        });

        fullscreenBtn.addEventListener("click", () => {
          if (document.querySelector(".html-fullscreen-overlay")) return;
          const overlay = h("div", {
            className: "html-fullscreen-overlay",
            role: "dialog",
            "aria-modal": "true",
            "aria-labelledby": "html-fullscreen-title",
          });
          const header = h("div", { className: "html-fullscreen-header" });
          const titleEl = h(
            "div",
            { className: "html-fullscreen-title", id: "html-fullscreen-title" },
            htmlValue.title || item.key || "Sandboxed HTML"
          );
          header.appendChild(titleEl);
          const backToContextBtn = h("button", {
            className: "html-fullscreen-close",
            type: "button",
            "aria-label": "Back to context",
          }, "Back to context");
          header.appendChild(backToContextBtn);
          const closeBtn = h("button", {
            className: "html-fullscreen-close",
            type: "button",
            "aria-label": "Close fullscreen",
          }, "Close");
          header.appendChild(closeBtn);

          const fullscreenStage = h("div", { className: "html-fullscreen-stage" });
          fullscreenStage.appendChild(createSandboxedIframe());
          overlay.appendChild(header);
          overlay.appendChild(fullscreenStage);
          document.body.appendChild(overlay);
          closeBtn.focus();

          function closeFullscreen(options) {
            window.removeEventListener("keydown", onFullscreenKeydown);
            delete overlay.__axCloseFullscreen;
            overlay.remove();
            if (options?.backToContext) {
              clearSelectedItem();
            } else if (options?.suppressFocus) {
              // Host-level navigation is replacing the detail view, so there is no stable button to refocus.
              notifyHostHeight();
            } else {
              fullscreenBtn.focus();
              notifyHostHeight();
            }
          }
          function onFullscreenKeydown(event) {
            if (event.key === "Escape") {
              event.preventDefault();
              closeFullscreen();
            }
          }
          overlay.__axCloseFullscreen = closeFullscreen;
          closeBtn.addEventListener("click", closeFullscreen, { once: true });
          backToContextBtn.addEventListener("click", () => closeFullscreen({ backToContext: true }), { once: true });
          window.addEventListener("keydown", onFullscreenKeydown);
        });

        copyKeyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(item.key || "");
            const original = copyKeyBtn.textContent;
            copyKeyBtn.textContent = "Copied";
            setTimeout(() => { copyKeyBtn.textContent = original; }, 1200);
          } catch (_) {
            // Clipboard can be unavailable in sandboxed hosts.
          }
        });

        // Sandboxed srcdoc iframes report event.origin as "null", so source
        // identity is the trust check. Only bounded resize messages are used.
        function onIframeMessage(e) {
          if (!iframe || e.source !== iframe.contentWindow) return;
          const m = e.data;
          if (!m || typeof m !== "object" || m.type !== "ax-resize") return;
          if (typeof m.height !== "number" || !Number.isFinite(m.height)) return;
          const clamped = Math.min(1200, Math.max(100, Math.round(m.height)));
          iframe.style.height = clamped + "px";
          notifyHostHeight();
        }
        state.htmlMessageAbortController = new AbortController();
        window.addEventListener("message", onIframeMessage, {
          signal: state.htmlMessageAbortController.signal,
        });

        hero.appendChild(stage);
        panel.appendChild(hero);
      }

      // --- STANDARD LAYOUT for non-upload values ---
      panel.appendChild(h("div", { className: "detail-label" }, state.loadingDetail ? "Loading latest value..." : "Selected entry"));
      panel.appendChild(h("div", { className: "detail-topic" }, inferTopic(item)));
      panel.appendChild(h("div", { className: "detail-title" }, item.key || titleForItem(item)));
      const detailSummary = previewForItem(item);
      if (detailSummary) {
        panel.appendChild(h("div", { className: "detail-summary" }, detailSummary));
      }
      const alternateTitle = titleForItem(item);
      if (alternateTitle && alternateTitle !== item.key) {
        panel.appendChild(h("div", { className: "detail-key" }, alternateTitle));
      }

      const badges = h("div", { className: "detail-badges" });
      const detailDate = relDate(item.updated_at || item.created_at);
      if (detailDate) {
        badges.appendChild(h("span", { className: "mini-pill neutral" }, detailDate));
      }
      if (hasExpiry(item)) {
        badges.appendChild(h("span", { className: "mini-pill warn" }, ttlLabel(item)));
      }
      const sourceLabel = publicSourceLabel(item.source);
      if (sourceLabel) {
        badges.appendChild(h("span", { className: "mini-pill" }, "source: " + sourceLabel));
      }
      if (badges.children.length) {
        panel.appendChild(badges);
      }

      const metaGrid = h("div", { className: "detail-meta-grid" });
      const metaEntries = [];
      const topic = inferTopic(item);
      if (topic) metaEntries.push(["Topic", topic]);
      if (item.agent_name) metaEntries.push(["Author", item.agent_name]);
      if (item.created_at) metaEntries.push(["Created", new Date(item.created_at).toLocaleString()]);
      metaEntries.push(["Expires", contextExpiryLabel(item)]);
      for (const [label, value] of metaEntries) {
        const card = h("div", { className: "meta-card" });
        card.appendChild(h("strong", null, label));
        card.appendChild(h("span", null, String(value)));
        metaGrid.appendChild(card);
      }
      if (metaGrid.children.length) {
        panel.appendChild(metaGrid);
      }

      const valueCard = h("div", { className: "value-card" });
      const valueHead = h("div", { className: "value-head" });
      valueHead.appendChild(h("div", { className: "value-title" }, "Stored value"));
      const kind = displayValue === null || displayValue === undefined
        ? "empty"
        : Array.isArray(displayValue)
          ? "array"
          : typeof displayValue;
      valueHead.appendChild(h("div", { className: "value-kind" }, kind));
      valueCard.appendChild(valueHead);
      valueCard.appendChild(h("div", { className: "value-body" }, formatValue(displayValue)));
      panel.appendChild(valueCard);

      const actions = h("div", { className: "action-row" });
      const refresh = h("button", { className: "btn", type: "button", disabled: state.loadingDetail }, "Refresh");
      refresh.addEventListener("click", () => openItem(item));
      actions.appendChild(refresh);
      appendApprovalActions(actions, item, "entry");

      if (canDeleteContext()) {
        const deleteBtn = h("button", { className: "btn btn-danger", type: "button", disabled: state.loadingDetail }, "Delete");
        deleteBtn.addEventListener("click", deleteSelected);
        actions.appendChild(deleteBtn);
      }
      panel.appendChild(actions);

      return panel;
    }

    function render() {
      const displayItems = buildDisplayItems();
      const root = document.getElementById("app");
      resetHtmlMessageListener();
      root.textContent = "";
      const selectedValue = state.selectedItem ? resolvedItemValue(state.selectedItem) : null;
      const selectedUpload = uploadValueFor(selectedValue);
      document.body.classList.toggle("artifact-mode", Boolean(selectedUpload));
      if (selectedUpload) {
        root.appendChild(renderArtifactPanel());
        notifyHostHeight();
        restoreSearchFocusIfNeeded();
        return;
      }

      if (state.selectedItem) {
        renderNotice(root);
        renderPermissionNotice(root);
        renderDebug(root);
        root.appendChild(renderDetailPanel());
        notifyHostHeight();
        restoreSearchFocusIfNeeded();
        return;
      }

      renderHero(root);
      renderNotice(root);
      renderPermissionNotice(root);
      renderDebug(root);

      if (!displayItems.length) {
        renderEmpty(root);
        notifyHostHeight();
        restoreSearchFocusIfNeeded();
        return;
      }

      root.appendChild(renderBrowserPanel());
      notifyHostHeight();
      restoreSearchFocusIfNeeded();
    }

    host.setHostCommandHandler((command) => {
      if (command === "context/all" || command === "context:return-to-list") {
        showAllContext();
      }
    });

    host.setToolResultHandler(handleToolResult);
    await host.connect();
    await loadList();
  </script>
</body>
</html>
