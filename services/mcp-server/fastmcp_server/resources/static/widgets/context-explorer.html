<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Explorer - Waystation</title>
  <style>
    :root {
      --ax-bg: var(--color-background-primary, #0a0f1a);
      --ax-surface: var(--color-background-secondary, rgba(15,23,42,0.92));
      --ax-surface-strong: var(--color-background-tertiary, rgba(30,41,59,0.96));
      --ax-text: var(--color-foreground-primary, hsl(210, 40%, 98%));
      --ax-text-dim: var(--color-foreground-secondary, hsl(215, 20.2%, 65.1%));
      --ax-border: var(--color-border-default, rgba(255,255,255,0.1));
      --ax-accent: var(--color-accent-primary, #22d3ee);
      --ax-accent-soft: rgba(6,182,212,0.12);
      --ax-warning: #fbbf24;
      --ax-danger: #fb7185;
      --ax-shadow: 0 12px 24px -8px rgba(0,0,0,0.25);
      --ax-radius: 18px;
      --ax-font: var(--font-family-body, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      --ax-mono: var(--font-family-mono, "SF Mono", "Fira Code", monospace);
    }

    * { box-sizing: border-box; margin: 0; }
    html, body {
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(6,182,212,0.12), transparent 34%),
        radial-gradient(circle at top right, rgba(148,163,184,0.16), transparent 28%),
        var(--ax-bg);
      color: var(--ax-text);
      font-family: var(--ax-font);
    }
    body { padding: 16px; }
    button, input, textarea { font: inherit; }
    .shell { width: 100%; max-width: 1180px; margin: 0 auto; }
    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--ax-border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 18px;
      background:
        linear-gradient(140deg, rgba(6,182,212,0.12), transparent 42%),
        linear-gradient(180deg, var(--ax-surface-strong), var(--ax-surface));
      box-shadow: var(--ax-shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(0deg, transparent 0, transparent 74%, rgba(255,255,255,0.03) 74.2%, transparent 74.6%, transparent 100%);
      opacity: 0.45;
    }
    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .eyebrow {
      display: none;
    }
    .hero h2 {
      font-size: 16px;
      line-height: 1.2;
      margin-bottom: 0;
      letter-spacing: -0.01em;
    }
    .hero-copy {
      display: none;
    }
    .hero-stats {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .stat {
      border-radius: 10px;
      border: 1px solid var(--ax-border);
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-value {
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      color: var(--ax-accent);
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ax-text-dim);
    }
    .topic-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .topic-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--ax-border);
      background: var(--ax-surface);
      font-size: 12px;
      color: var(--ax-text-dim);
    }
    button.topic-pill {
      cursor: pointer;
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
    }
    button.topic-pill:hover,
    button.topic-pill.is-active {
      border-color: var(--ax-accent);
      background: var(--ax-accent-soft);
      color: var(--ax-accent);
    }
    .topic-pill strong { color: var(--ax-text); font-weight: 600; }
    .catalog-controls {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }
    .catalog-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .catalog-tab {
      border: 1px solid var(--ax-border);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      color: var(--ax-text-dim);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
    }
    .catalog-tab:hover,
    .catalog-tab.is-active {
      border-color: var(--ax-accent);
      background: var(--ax-accent-soft);
      color: var(--ax-accent);
    }
    .catalog-search {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--ax-border);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(2,6,23,0.38);
    }
    .catalog-search span {
      color: var(--ax-text-dim);
      font-size: 13px;
    }
    .catalog-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ax-text);
      font-size: 13px;
    }
    .catalog-search input::placeholder {
      color: rgba(148,163,184,0.8);
    }
    .catalog-filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(160px, 240px);
      gap: 10px;
      align-items: center;
    }
    .catalog-select {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--ax-border);
      border-radius: 14px;
      padding: 8px 10px;
      background: rgba(2,6,23,0.38);
      color: var(--ax-text-dim);
      font-size: 13px;
      min-width: 0;
    }
    .catalog-select select {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ax-text);
      font: inherit;
    }
    .curated-rail {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .curated-card {
      width: 100%;
      border: 1px solid var(--ax-border);
      border-radius: 16px;
      padding: 12px;
      background:
        linear-gradient(135deg, rgba(251,191,36,0.08), transparent 55%),
        rgba(255,255,255,0.03);
      color: var(--ax-text);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }
    .curated-card:hover,
    .curated-card:focus-visible {
      border-color: var(--ax-accent);
      background:
        linear-gradient(135deg, rgba(34,211,238,0.14), transparent 58%),
        rgba(255,255,255,0.05);
      outline: none;
      transform: translateY(-1px);
    }
    .curated-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ax-text-dim);
      font-weight: 800;
      margin-bottom: 7px;
    }
    .curated-link {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ax-text);
      cursor: pointer;
      text-align: left;
      font-weight: 750;
      line-height: 1.35;
    }
    .curated-card:hover .curated-link,
    .curated-card:focus-visible .curated-link {
      color: var(--ax-accent);
    }
    .notice {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid transparent;
    }
    .notice-info {
      background: var(--ax-accent-soft);
      color: var(--ax-accent);
      border-color: rgba(6,182,212,0.18);
    }
    .notice-error {
      background: rgba(186,59,45,0.12);
      color: var(--ax-danger);
      border-color: rgba(186,59,45,0.2);
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 16px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--ax-border);
      border-radius: 22px;
      background: var(--ax-surface);
      box-shadow: var(--ax-shadow);
    }
    .browser-panel { padding: 18px; }
    .detail-panel {
      position: sticky;
      top: 16px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(6,182,212,0.12), transparent 32%),
        var(--ax-surface-strong);
    }
    .context-detail-panel {
      position: static;
      max-width: 1180px;
      margin: 0 auto;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }
    .panel-subtitle {
      font-size: 13px;
      color: var(--ax-text-dim);
      margin-top: 4px;
    }
    .summary-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--ax-border);
      background: var(--ax-surface-strong);
      font-size: 12px;
      color: var(--ax-text-dim);
      white-space: nowrap;
    }
    .panel-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .group-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .group {
      padding-top: 2px;
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .group-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--ax-accent);
      box-shadow: 0 0 0 6px rgba(6,182,212,0.12);
      flex-shrink: 0;
    }
    .group-name {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .group-count {
      font-size: 12px;
      color: var(--ax-text-dim);
    }
    .entry-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .entry-chip {
      width: 100%;
      text-align: left;
      border: 1px solid var(--ax-border);
      border-radius: 16px;
      padding: 14px 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), transparent 55%),
        var(--ax-surface-strong);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      color: inherit;
    }
    .entry-chip:hover {
      transform: translateY(-1px);
      border-color: var(--ax-accent);
      box-shadow: 0 10px 24px rgba(6,182,212,0.12);
    }
    .entry-chip.is-active {
      border-color: var(--ax-accent);
      box-shadow: 0 0 0 1px rgba(18,106,82,0.28), 0 14px 28px rgba(18,106,82,0.14);
    }
    .entry-card-body {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .entry-preview-thumb {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,0.18);
      background:
        linear-gradient(135deg, rgba(6,182,212,0.16), rgba(148,163,184,0.08)),
        rgba(15,23,42,0.72);
      display: grid;
      place-items: center;
      color: var(--ax-accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .entry-preview-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .entry-content {
      min-width: 0;
      flex: 1;
    }
    .entry-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .entry-head {
      min-width: 0;
      flex: 1;
    }
    .entry-title {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
      margin-bottom: 3px;
    }
    .entry-key {
      font-size: 11px;
      line-height: 1.4;
      color: var(--ax-text-dim);
      font-family: var(--ax-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-preview {
      font-size: 12px;
      line-height: 1.45;
      color: var(--ax-text-dim);
      display: block;
      margin-bottom: 10px;
    }
    .entry-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(6,182,212,0.12);
      color: var(--ax-accent);
      font-size: 11px;
      font-weight: 600;
    }
    .mini-pill.warn {
      background: rgba(148,163,184,0.16);
      color: var(--ax-warning);
    }
    .mini-pill.neutral {
      background: rgba(127,127,127,0.1);
      color: var(--ax-text-dim);
    }
    .detail-empty,
    .empty-state {
      padding: 26px 20px;
      border: 1px dashed var(--ax-border);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(6,182,212,0.04), transparent 68%);
      text-align: center;
    }
    .empty-state strong,
    .detail-empty strong {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .empty-state p,
    .detail-empty p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--ax-text-dim);
    }
    .detail-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ax-text-dim);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .detail-topic {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--ax-accent-soft);
      color: var(--ax-accent);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .detail-title {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .detail-summary {
      font-size: 14px;
      line-height: 1.6;
      color: var(--ax-text-dim);
      margin-bottom: 12px;
    }
    .detail-key {
      font-family: var(--ax-mono);
      font-size: 12px;
      color: var(--ax-text-dim);
      margin-bottom: 14px;
      word-break: break-all;
    }
    .detail-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .detail-action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta-card {
      border: 1px solid var(--ax-border);
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
    }
    .meta-card strong {
      display: block;
      font-size: 11px;
      color: var(--ax-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
    .meta-card span {
      display: block;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .value-card {
      margin-bottom: 16px;
      border: 1px solid var(--ax-border);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(12,20,34,0.04);
    }
    .value-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--ax-border);
      background: rgba(255,255,255,0.03);
    }
    .value-title {
      font-size: 13px;
      font-weight: 700;
    }
    .value-kind {
      font-size: 11px;
      color: var(--ax-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .value-body {
      padding: 14px;
      font-family: var(--ax-mono);
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 420px;
      overflow: auto;
    }
    /* Media rendering */
    .upload-video {
      width: 100%;
      max-height: 400px;
      border-radius: 0;
      background: #000;
    }
    .upload-audio {
      width: 100%;
      min-height: 46px;
      padding: 0;
      color-scheme: dark;
    }
    .upload-pdf {
      width: 100%;
      min-height: 500px;
      border: none;
      border-radius: 0;
      background: rgba(255,255,255,0.95);
    }
    .html-card-chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--ax-surface-strong, #1e293b);
      border-bottom: 1px solid var(--ax-border, rgba(255,255,255,0.08));
      font-size: 12px;
    }
    .html-card-chrome .sandbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ax-text-dim, #94a3b8);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .html-card-chrome .toolbar {
      display: inline-flex;
      gap: 4px;
    }
    .html-card-chrome .tool-btn {
      background: transparent;
      border: 1px solid var(--ax-border, rgba(255,255,255,0.12));
      color: var(--ax-text, #e2e8f0);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--ax-font);
    }
    .html-card-chrome .tool-btn:hover {
      background: rgba(255,255,255,0.08);
    }
    .html-stage {
      background: rgba(2,6,23,0.72);
    }
    .html-iframe {
      width: 100%;
      min-height: 240px;
      border: 0;
      background: #fff;
      display: block;
    }
    .html-fullscreen-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      background: var(--ax-bg, #020617);
      color: var(--ax-text, #e2e8f0);
    }
    .html-fullscreen-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 10px 16px;
      background: var(--ax-surface-strong, #1e293b);
      border-bottom: 1px solid var(--ax-border, rgba(255,255,255,0.08));
    }
    .html-fullscreen-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
    }
    .html-fullscreen-close {
      flex: 0 0 auto;
      background: transparent;
      border: 1px solid var(--ax-border, rgba(255,255,255,0.14));
      color: var(--ax-text, #e2e8f0);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--ax-font);
    }
    .html-fullscreen-close:hover {
      background: rgba(255,255,255,0.08);
    }
    .html-fullscreen-stage {
      flex: 1 1 auto;
      min-height: 0;
      background: #050b12;
    }
    .html-fullscreen-stage .html-iframe {
      height: 100%;
      min-height: 0;
      background: #fff;
    }
    .html-raw {
      padding: 12px 16px;
      font-family: var(--ax-mono, ui-monospace, monospace);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--ax-surface, #0a0f1a);
      color: var(--ax-text, #e2e8f0);
      max-height: 600px;
      overflow: auto;
    }
    .upload-markdown {
      padding: 16px 20px;
      font-family: var(--ax-font);
      font-size: 14px;
      line-height: 1.7;
      color: var(--ax-text);
      max-height: 500px;
      overflow: auto;
    }
    .upload-markdown h2 { font-size: 20px; margin: 16px 0 8px; font-weight: 700; }
    .upload-markdown h3 { font-size: 17px; margin: 14px 0 6px; font-weight: 600; }
    .upload-markdown h4 { font-size: 15px; margin: 12px 0 4px; font-weight: 600; }
    .upload-markdown strong { font-weight: 700; }
    .upload-markdown em { font-style: italic; }
    .upload-markdown ul { padding-left: 20px; margin: 8px 0; }
    .upload-markdown li { margin: 4px 0; }
    .upload-markdown hr { border: none; border-top: 1px solid var(--ax-border); margin: 16px 0; }
    .upload-markdown a { color: var(--ax-accent); text-decoration: none; }
    .upload-markdown a:hover { text-decoration: underline; }
    .upload-markdown pre.md-code {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      font-family: var(--ax-mono);
      font-size: 12px;
      line-height: 1.5;
      margin: 8px 0;
    }
    .upload-markdown code.md-inline {
