<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Results - Commonflame</title>
  <style>
    :root {
      --ax-bg: var(--color-background-primary, #0a0f1a);
      --ax-surface: var(--color-background-secondary, rgba(15,23,42,0.92));
      --ax-surface-strong: var(--color-background-tertiary, rgba(30,41,59,0.96));
      --ax-text: var(--color-foreground-primary, hsl(210, 40%, 98%));
      --ax-text-dim: var(--color-foreground-secondary, hsl(215, 20.2%, 65.1%));
      --ax-border: var(--color-border-default, rgba(255,255,255,0.1));
      --ax-accent: var(--color-accent-primary, #22d3ee);
      --ax-accent-soft: rgba(6,182,212,0.12);
      --ax-warning: #fbbf24;
      --ax-danger: #fb7185;
      --ax-shadow: 0 12px 24px -8px rgba(0,0,0,0.25);
      --ax-radius: 16px;
      --ax-font: var(--font-family-body, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; background: var(--ax-bg); color: var(--ax-text); font-family: var(--ax-font); }
    body { padding: 16px; }
    .shell { width: 100%; max-width: 1180px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header h2 { font-size: 18px; font-weight: 600; }
    .header-meta { font-size: 13px; color: var(--ax-text-dim); }
    .query-label { font-size: 14px; color: var(--ax-text-dim); margin-bottom: 16px; }
    .query-text { color: var(--ax-accent); font-weight: 600; }
    .result-list { display: flex; flex-direction: column; gap: 8px; }
    .result-card { background: var(--ax-surface); border: 1px solid var(--ax-border); border-radius: var(--ax-radius); padding: 14px 16px; cursor: pointer; transition: all 0.15s; }
    .result-card:hover { border-color: var(--ax-accent); }
    .result-card.expanded { background: var(--ax-surface-strong); box-shadow: var(--ax-shadow); cursor: pointer; }
    .result-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .result-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--ax-accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; flex-shrink: 0; }
    .result-sender { font-size: 13px; font-weight: 600; flex: 1; }
    .result-time { font-size: 12px; color: var(--ax-text-dim); }
    .result-score { font-size: 11px; color: var(--ax-text-dim); }
    .score-bar { display: inline-block; width: 40px; height: 4px; border-radius: 2px; background: var(--ax-border); margin-left: 6px; vertical-align: middle; overflow: hidden; }
    .score-fill { height: 100%; background: var(--ax-accent); border-radius: 2px; }
    .result-preview { font-size: 13px; color: var(--ax-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-full { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .empty { text-align: center; padding: 40px; color: var(--ax-text-dim); font-size: 14px; }
    .search-bar { display: flex; gap: 8px; margin-top: 16px; }
    .search-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text); font-size: 14px; font-family: inherit; }
    .search-input:focus { outline: none; border-color: var(--ax-accent); }
    .search-input::placeholder { color: var(--ax-text-dim); }
    .search-btn { padding: 10px 18px; border-radius: 10px; border: none; background: var(--ax-accent); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .search-btn:hover { opacity: 0.9; }
    .search-btn:disabled { opacity: 0.5; cursor: default; }
    .notice { margin-bottom: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
    .notice-error { background: rgba(186,59,45,0.12); color: var(--ax-danger); border: 1px solid rgba(186,59,45,0.2); }
    .searching { text-align: center; padding: 20px; color: var(--ax-text-dim); font-size: 14px; }
  </style>
</head>
<body>
  <div class="shell" id="app"></div>
  <script type="module">
    import { App } from "__COMMONFLAME_MCP_APPS_BRIDGE_URL__";
    const app = new App({ name: "Search Results", version: "1.0.0" });
    const OPENAI_SET_GLOBALS_EVENT = "openai:set_globals";

    function getOpenAiBridge() {
      return typeof window !== "undefined" ? window.openai : undefined;
    }

    function normalizeToolResult(result) {
      if (result && typeof result === "object" && ("structuredContent" in result || "content" in result)) {
        return result;
      }
      return { structuredContent: result };
    }

    function notifyHostHeight() {
      const openaiBridge = getOpenAiBridge();
      if (openaiBridge && typeof openaiBridge.notifyIntrinsicHeight === "function") {
        requestAnimationFrame(() => {
          try {
            const appRoot = document.getElementById("app");
            const bodyStyles = window.getComputedStyle(document.body);
            const paddingTop = parseFloat(bodyStyles.paddingTop || "0") || 0;
            const paddingBottom = parseFloat(bodyStyles.paddingBottom || "0") || 0;
            const contentHeight = appRoot
              ? Math.ceil(appRoot.getBoundingClientRect().height + paddingTop + paddingBottom)
              : Math.ceil(document.body.getBoundingClientRect().height);
            openaiBridge.notifyIntrinsicHeight(Math.max(120, contentHeight));
          } catch {}
        });
      }
    }

    const host = {
      _toolResultHandler: null,
      _globalsListener: null,
      setToolResultHandler(handler) {
        this._toolResultHandler = handler;
        app.ontoolresult = handler;
        // Fallback: listen for raw postMessage from hosts that send
        // ui/notifications/tool-result directly (e.g., Commonflame frontend)
        window.addEventListener("message", (event) => {
          let msg = event.data;
          if (!msg) return;
          if (typeof msg === "string") {
            try { msg = JSON.parse(msg); } catch { return; }
          }
          if (typeof msg !== "object") return;
          if (msg.method === "ui/notifications/tool-result" && msg.params) {
            handler(normalizeToolResult(msg.params));
            return;
          }
          if (msg.type === "tool_result" && (msg.initial_data || msg.structuredContent || msg.content)) {
            handler(normalizeToolResult(msg.initial_data || msg));
            return;
          }
          if (msg.structuredContent || msg.kind) {
            handler(normalizeToolResult(msg));
          }
        });
      },
      _deliverToolOutput(globals) {
        const openaiBridge = getOpenAiBridge();
        const output = globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")
          ? globals.toolOutput
          : openaiBridge?.toolOutput;
        if (this._toolResultHandler && output !== undefined) {
          this._toolResultHandler(normalizeToolResult(output));
        }
      },
      async connect() {
        if (!this._globalsListener) {
          this._globalsListener = (event) => {
            const globals = event?.detail?.globals;
            if (globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")) {
              this._deliverToolOutput(globals);
            }
            notifyHostHeight();
          };
          window.addEventListener(OPENAI_SET_GLOBALS_EVENT, this._globalsListener, { passive: true });
        }
        await app.connect();
        this._deliverToolOutput();
        notifyHostHeight();
      },
      async callServerTool(name, args) {
        const openaiBridge = getOpenAiBridge();
        if (openaiBridge && typeof openaiBridge.callTool === "function") {
          return normalizeToolResult(await openaiBridge.callTool(name, args));
        }
        return app.callServerTool({ name, arguments: args });
      },
    };

    let state = { results: [], query: "", count: 0, total: 0, expandedIdx: null, searching: false, notice: null, hasData: false };

    function relDate(d) {
      if (!d) return "";
      const ts = new Date(d).getTime();
      if (isNaN(ts)) return String(d).slice(0, 10);
      const diff = Date.now() - ts;
      if (diff < 0) return "just now";
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + "d ago";
      return new Date(ts).toLocaleDateString();
    }

    function initials(name) {
      if (!name) return "?";
      return name.split(/[\s_-]+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
    }

    function senderName(result) {
      return result?.display_name || result?.handle || result?.agent_name || result?.username || (result?.sender_type === "user" ? "user" : "agent");
    }

    function h(tag, attrs, text) {
      const e = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === "className") e.className = v;
        else if (k.startsWith("data-")) e.setAttribute(k, v);
        else if (k === "style") e.style.cssText = v;
        else e.setAttribute(k, v);
      });
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function extractData(result) {
      if (result.structuredContent) return result.structuredContent;
      const text = result.content?.find(c => c.type === "text");
      if (!text) return null;
      try {
        const parsed = JSON.parse(text.text);
        return parsed.structuredContent || parsed;
      } catch { return null; }
    }

    function unwrapV2(data) {
      // Unwrap v2 envelope: {kind, version, state, data: {...}, actions}
      if (data && data.version && data.data && typeof data.data === "object") return data.data;
      return data;
    }

    function firstArray() {
      for (const value of arguments) {
        if (Array.isArray(value)) return value;
      }
      return [];
    }

    function firstNumber() {
      for (const value of arguments) {
        if (typeof value === "number" && Number.isFinite(value)) return value;
      }
      return null;
    }


    async function doSearch(query) {
      const trimmedQuery = query.trim();
      if (!trimmedQuery) return;
      state.query = trimmedQuery;
      state.searching = true;
      state.notice = null;
      state.expandedIdx = null;
      render();
      try {
        const res = await host.callServerTool("search", { query: trimmedQuery, limit: 20 });
        const data = extractData(res);
        if (data) {
          applyData(data);
        } else {
          state.notice = "No response from search.";
          state.searching = false;
          render();
        }
      } catch (err) {
        state.notice = "Search failed: " + (err.message || "unknown error");
        state.searching = false;
        render();
      }
    }

    function applyData(data) {
      if (data.error || data.state === "error") {
        state.notice = data.error || "Search failed.";
        state.searching = false;
        render();
        return;
      }

      const payload = unwrapV2(data) || {};
      state.results = firstArray(
        payload.results,
        payload.items,
        payload.data?.results,
        payload.data?.items,
        data.results,
        data.items,
        data.data?.results,
        data.data?.items,
      );
      state.query = payload.query || payload.data?.query || data.query || data.data?.query || state.query || "";
      state.count = firstNumber(
        payload.count,
        payload.data?.count,
        data.count,
        data.data?.count,
        state.results.length,
      );
      state.total = firstNumber(
        payload.total,
        payload.data?.total,
        data.total,
        data.data?.total,
        state.count,
      );
      state.expandedIdx = null;
      state.searching = false;
      state.hasData = true;
      state.notice = null;
      render();
      requestAnimationFrame(notifyHostHeight);
    }

    function render() {
      const root = document.getElementById("app");
      root.textContent = "";

      if (state.notice) {
        root.appendChild(h("div", { className: "notice notice-error" }, state.notice));
      }

      // Header
      const header = h("div", { className: "header" });
      header.appendChild(h("h2", null, "Search Results"));
      if (state.hasData) {
        header.appendChild(h("span", { className: "header-meta" }, state.count + " of " + state.total + " results"));
      }
      root.appendChild(header);

      // Query label
      if (state.query && state.hasData) {
        const ql = h("div", { className: "query-label" });
        ql.appendChild(document.createTextNode("Results for "));
        ql.appendChild(h("span", { className: "query-text" }, '"' + state.query + '"'));
        root.appendChild(ql);
      }

      // Searching indicator
      if (state.searching) {
        root.appendChild(h("div", { className: "searching" }, "Searching..."));
        renderSearchBar(root);
        return;
      }

      // Results list
      const list = h("div", { className: "result-list" });
      if (state.hasData && state.results.length === 0) {
        list.appendChild(h("div", { className: "empty" }, "No results found for \"" + state.query + "\""));
      } else if (!state.hasData) {
        list.appendChild(h("div", { className: "empty" }, "Enter a search query below."));
      }

      for (let i = 0; i < state.results.length; i++) {
        const r = state.results[i];
        const isExpanded = state.expandedIdx === i;
        const sender = senderName(r);
        const content = r.content || r.text || r.snippet || "";
        const score = r.relevance || r.relevance_score || r.score || 0;

        let cls = "result-card";
        if (isExpanded) cls += " expanded";
        const card = h("div", { className: cls });

        const top = h("div", { className: "result-top" });
        top.appendChild(h("div", { className: "result-avatar" }, initials(sender)));
        top.appendChild(h("div", { className: "result-sender" }, sender));
        top.appendChild(h("div", { className: "result-time" }, relDate(r.created_at || r.timestamp)));

        if (score > 0) {
          const pct = Math.round(score * 100);
          const scoreEl = h("div", { className: "result-score" }, pct + "%");
          const bar = h("span", { className: "score-bar" });
          const fill = h("span", { className: "score-fill", style: "width:" + pct + "%" });
          bar.appendChild(fill);
          scoreEl.appendChild(bar);
          top.appendChild(scoreEl);
        }
        card.appendChild(top);

        if (isExpanded) {
          card.appendChild(h("div", { className: "result-full" }, content));
          card.addEventListener("click", () => { state.expandedIdx = null; render(); });
        } else {
          card.appendChild(h("div", { className: "result-preview" }, content.slice(0, 150)));
          card.addEventListener("click", () => { state.expandedIdx = i; render(); });
        }
        list.appendChild(card);
      }
      root.appendChild(list);

      // Search bar at bottom
      renderSearchBar(root);

      notifyHostHeight();
    }

    function renderSearchBar(root) {
      const bar = h("div", { className: "search-bar" });
      const input = document.createElement("input");
      input.type = "text";
      input.className = "search-input";
      input.placeholder = "Search messages...";
      input.value = state.query || "";
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doSearch(input.value);
      });
      bar.appendChild(input);

      const btn = h("button", { className: "search-btn" }, "Search");
      if (state.searching) btn.disabled = true;
      btn.addEventListener("click", () => doSearch(input.value));
      bar.appendChild(btn);

      root.appendChild(bar);

      // Auto-focus input if no data yet
      if (!state.hasData) {
        requestAnimationFrame(() => input.focus());
      }
    }

    // Handle tool results from host (agent's search)
    host.setToolResultHandler((result) => {
      const data = extractData(result);
      if (data) applyData(data);
    });

    await host.connect();
    render(); // Show default state (search input)
    notifyHostHeight();
  </script>
</body>
</html>
