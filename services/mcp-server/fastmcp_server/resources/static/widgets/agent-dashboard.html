          : (isPersistedDraft ? "Approve and create" : "Create review draft")
      );
      createBtn.disabled = state.draftSending;
      createBtn.addEventListener("click", async () => {
        if (state.draftSending) return;
        const name = (state.draftFields.name || "").trim();
        if (!name) { state.notice = "Agent name is required."; state.noticeKind = "error"; render(); return; }
        const currentMissing = missingCreateFields(state.draftFields, requiredFields);
        if (currentMissing.length > 0) {
          state.notice = "Fill in the core profile before creating: " + currentMissing.join(", ") + ".";
          state.noticeKind = "error";
          render();
          return;
        }
        state.draftSending = true; state.notice = null; render();
        try {
          let data;
          if (!isPersistedDraft) {
            const args = {
              action: "create_draft",
              name,
              agent_mode: state.draftFields.agent_mode || "sandbox",
            };
            for (const k of ["description", "system_prompt", "model"]) {
              const v = (state.draftFields[k] || "").trim();
              if (v) args[k] = v;
            }
            const res = await host.callServerTool("agents", args);
            data = extractPayload(res);
          } else {
            let nextDraftId = draftId;
            let nextVersion = draftVersion;
            const changes = draftEditableChanges();
            if (Object.keys(changes).length > 0) {
              const editRes = await host.callServerTool("agents", {
                action: "edit_draft",
                draft_id: nextDraftId,
                version: nextVersion,
                changes,
              });
              const editData = extractPayload(editRes);
              if (editData?.scope === "create" && editData.draft) {
                nextDraftId = editData.draft.draft_id;
                nextVersion = Number(editData.draft.version || nextVersion);
                applyDraftPayload(editData.draft, editData.required_fields);
              } else if (editData?.scope === "create_error" || editData?.error) {
                data = editData;
              }
            }
            if (!data) {
              const approveRes = await host.callServerTool("agents", {
                action: "approve_draft",
                draft_id: nextDraftId,
                version: nextVersion,
              });
              data = extractPayload(approveRes);
            }
          }
          if (data && data.error) {
            state.draftSending = false; state.notice = typeof data.error === "string" ? data.error : JSON.stringify(data.error); state.noticeKind = "error"; render(); return;
          }
          if (data && (data.scope === "create_blocked" || data.scope === "create_error")) {
            state.draftSending = false;
            state.notice = data.hint || "Agent creation is not available right now.";
            state.noticeKind = "error";
            render();
            return;
          }
          if (data && data.scope === "create" && data.draft) {
            state.draftSending = false;
            applyDraftPayload(data.draft, data.required_fields);
            state.notice = "Draft ready for review.";
            state.noticeKind = "info";
            render();
            return;
          }
          state.draftSending = false;
          if (data && data.scope === "created" && data.created) {
            state.draft = null;
            state.draftFields = {};
            state.selected = data.created;
            state.view = "profile";
            state.notice = "Agent '" + (data.created.name || name) + "' created!";
            state.noticeKind = "info";
            if (data.items && data.items.length) {
              state.agents = [...state.agents, ...data.items.filter(a => !state.agents.some(e => e.id === a.id || e.name === a.name))];
              state.count = state.agents.length;
            }
          } else {
            state.notice = "The draft action returned an unexpected response.";
            state.noticeKind = "error";
            state.view = "grid";
          }
          render();
        } catch (err) {
          state.draftSending = false; state.notice = err instanceof Error ? err.message : "Failed to create agent."; state.noticeKind = "error"; render();
        }

              draft_id: draftId,
              version: draftVersion,

            state.draftSending = false;
            if (data?.scope === "draft_dismissed") {
              state.draft = null;
              state.draftFields = {};
              state.notice = "Draft dismissed.";
              state.noticeKind = "info";
              state.view = "grid";
              render();
              return;
            }
            state.notice = data?.hint || "Failed to reject draft.";
            state.noticeKind = "error";
            render();
            return;
          } catch (err) {
            state.draftSending = false;
            state.notice = err instanceof Error ? err.message : "Failed to reject draft.";
            state.noticeKind = "error";
            render();
            return;
          }
        }
        state.draft = null; state.draftFields = {}; state.draftRefreshedFor = ""; state.notice = null; render();
      });
      actions.appendChild(discardBtn);

      card.appendChild(actions);
      if (missing.length > 0) {
        card.appendChild(
          h(
            "div",
            { className: "field-help", style: "margin-top:12px" },
            "Still missing: ", missing.join(", "), "."
          )
        );
      }
      root.appendChild(card);
    }

    function extractData(result) {
      if (result.structuredContent) return result.structuredContent;
      const text = result.content?.find(c => c.type === "text");
      if (!text) return null;
      try {
        const parsed = JSON.parse(text.text);
        return parsed.structuredContent || parsed;
      } catch { return null; }
    }

    function unwrapV2(data) {
      // Unwrap v2 envelope: {kind, version, state, data: {...}, actions}
      if (data && data.version && data.data && typeof data.data === "object") return data.data;
      return data;
    }

    function extractPayload(result) {
      return unwrapV2(extractData(result));
    }


    function handleToolResult(result, source = "tool") {
      const data = extractData(result);
      if (!data) return;
      const payload = syncPermissionState(data) || data;
      state.hydrated = true;

      // Draft detection — create proposal from concierge
      if (payload?.draft && payload.scope === "create") {
        const draftId = payload.draft.draft_id || "";
        const terminal = readTerminalDraft(draftId);
        if (terminal) {
          applyTerminalDraft(terminal);
          render();
          return;
        }
        applyDraftPayload(payload.draft, payload.required_fields);
        state.notice = null;
        render();
        if (draftId && state.draftRefreshedFor !== draftId && !state.draftRefreshInFlight) {
          refreshDraftStatus(draftId);
        }
        return;
      }

      // Created agent — show the profile immediately
      if (payload?.scope === "created" && payload.created) {
        const draftId = payload?.draft?.draft_id || state.draft?.draft_id || "";
        if (draftId) {
          const terminal = { status: "created", created: payload.created };
          storeTerminalDraft(draftId, terminal);
          applyTerminalDraft(terminal);
          if (payload.items && payload.items.length) {
            state.agents = [...state.agents, ...payload.items.filter(a => !state.agents.some(e => e.id === a.id || e.name === a.name))];
            state.count = state.agents.length;
          }
          render();
          return;
        }
        state.draft = null;
        state.draftFields = {};
        state.draftRequiredFields = DEFAULT_CREATE_REQUIRED_FIELDS;
        state.draftRefreshedFor = "";
        state.controlDraft = null;
        state.selected = payload.created;
        state.view = "profile";
        state.notice = "Agent '" + (payload.created.name || "") + "' created!";
        state.noticeKind = "info";
        // Also put it in the agents list so Back works
        if (payload.items && payload.items.length) {
          state.agents = [...state.agents, ...payload.items.filter(a => !state.agents.some(e => e.id === a.id || e.name === a.name))];
          state.count = state.agents.length;
        }
        render();
        return;
      }

      if (payload?.scope === "draft_dismissed") {
        const draftId = payload?.draft?.draft_id || state.draft?.draft_id || "";
        if (draftId) {
          const terminal = { status: "dismissed", hint: payload.hint || "Draft dismissed." };
          storeTerminalDraft(draftId, terminal);
          applyTerminalDraft(terminal);
          render();
          return;
        }
        state.draft = null;
        state.draftFields = {};
        state.draftRequiredFields = DEFAULT_CREATE_REQUIRED_FIELDS;
        state.draftRefreshedFor = "";
        state.controlDraft = null;
        state.view = "grid";
        state.notice = payload.hint || "Draft dismissed.";
        state.noticeKind = "info";
        render();
        return;
      }

      if (payload?.scope === "create_blocked" || payload?.scope === "create_error") {
        state.draft = null;
        state.draftFields = {};
        state.draftRequiredFields = DEFAULT_CREATE_REQUIRED_FIELDS;
        state.draftRefreshedFor = "";
        state.controlDraft = null;
        state.view = "grid";
        state.notice = payload.hint || "Agent creation is not available right now.";
        state.noticeKind = "error";
        render();
        return;
      }

      if (payload?.scope === "control_review" && payload.control) {
        state.controlDraft = payload.control;
        state.controlSending = false;
        state.controlReturnView = state.view === "profile" ? "profile" : "grid";
        state.notice = null;
        render();
        return;
      }

      if (payload?.scope === "control_applied" && applyControlApplied(payload)) return;

      if (payload?.scope === "control_blocked" || payload?.scope === "control_error") {
        state.controlDraft = null;
        state.controlSending = false;
        state.notice = payload.hint || "That control action is not available here.";
        state.noticeKind = "error";
        render();
        return;
      }

      // Default: agent list — unwrap v2 envelope if present. If this widget
      // opened on a HITL draft, background/bootstrap list refreshes must not
      // dismiss the review surface.
      const payloadScope = payload.view_scope || payload.scope || "space";
      const payloadItems = Array.isArray(payload.items) ? payload.items : [];
      state.agents = isCrossSpaceScope(payloadScope)
        ? mergeAgentLists(state.agents, payloadItems)
        : payloadItems;
      state.count = payload.count ?? (isCrossSpaceScope(payloadScope) ? payloadItems.length : state.agents.length);
      state.total = payload.total ?? state.count;
      // AGENT-LIFECYCLE-UI: capture the availability_summary for the header line.
      // Always (re)assign — reset to null when a payload lacks it (scope switch /
      // older backend / cross-space fallback) so a stale prior count can't linger.
      state.availabilitySummary = (payload.availability_summary && typeof payload.availability_summary === "object")
        ? payload.availability_summary
        : null;
      state.crossSpaceLoading = false;
      state.crossSpaceLoadingScope = "";
      state.crossSpaceLoaded = isCrossSpaceScope(payloadScope)
        ? (Boolean(payload.cross_space_loaded) || state.crossSpaceLoaded)
        : false;
      state.crossSpaceScope = state.crossSpaceLoaded ? payloadScope : "";
      if (state.draft) {
        state.controlDraft = null;
        state.controlSending = false;
        render();
        return;
      }
      state.draft = null;
      state.draftFields = {};
      state.draftRequiredFields = DEFAULT_CREATE_REQUIRED_FIELDS;
      state.draftRefreshedFor = "";
      state.controlDraft = null;
      state.controlSending = false;
      state.view = "grid";
      render();
    }

    async function bootstrapAgents() {
      if (state.hydrated) return;
      try {
        const result = await host.callServerTool("agents", { action: "list" });
        handleToolResult(result, "bootstrap");
      } catch (err) {
        state.notice = err instanceof Error ? err.message : "Failed to load agents.";
        state.noticeKind = "error";
        render();
      }
    }

    async function loadCrossSpaceAgents(scope = state.agentScopeFilter) {
      const viewScope = requestedCrossSpaceScope(scope);
      state.crossSpaceLoading = true;
      state.crossSpaceLoadingScope = viewScope;
      render();
      let shouldLoadActiveScope = false;
      try {
        const result = await host.callServerTool("agents", {
          action: "list",
          limit: 200,
          offset: 0,
          view_scope: viewScope,
        });
        handleToolResult(result, "cross-space");
        const activeScope = state.agentScopeFilter;
        shouldLoadActiveScope = isCrossSpaceScope(activeScope) && !crossSpaceDataCoversScope(activeScope);
      } catch (err) {
        state.notice = err instanceof Error ? err.message : "Failed to load agents across spaces.";
        state.noticeKind = "error";
      } finally {
        state.crossSpaceLoading = false;
        state.crossSpaceLoadingScope = "";
        if (shouldLoadActiveScope) {
          void loadCrossSpaceAgents(state.agentScopeFilter);
        } else {
          render();
        }
      }
    }

    async function loadAvailableSpaces() {
      state.spacesLoading = true;
      render();
      try {
        const result = await host.callServerTool("spaces", { action: "list" });
        const payload = extractPayload(result) || {};
        const spaces = Array.isArray(payload.items)
          ? payload.items
          : (Array.isArray(payload.spaces) ? payload.spaces : []);
        state.availableSpaces = spaces;
        state.spacesLoaded = true;
        state.spacesLoading = false;
        render();
      } catch (err) {
        state.spacesLoading = false;
        state.notice = err instanceof Error ? err.message : "Failed to load visible spaces.";
        state.noticeKind = "error";
        render();
      }
    }

    async function refreshAgentsList() {
      try {
        state.crossSpaceLoaded = false;
        state.crossSpaceLoading = false;
        state.crossSpaceScope = "";
        state.crossSpaceLoadingScope = "";
        const result = await host.callServerTool("agents", { action: "list" });
        handleToolResult(result, "list");
      } catch (err) {
        state.notice = err instanceof Error ? err.message : "Failed to refresh agents.";
        state.noticeKind = "error";
        render();
      }
    }

    host.setToolResultHandler((result) => {
      handleToolResult(result, "push");
    });

    await host.connect();
    if (!state.hydrated) {
      await bootstrapAgents();
    }
  </script>
</body>
</html>
