<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Dashboard - Waystation</title>
  <style>
    :root {
      --ax-bg: var(--color-background-primary, #0a0f1a);
      --ax-surface: var(--color-background-secondary, rgba(15,23,42,0.92));
      --ax-surface-strong: var(--color-background-tertiary, rgba(30,41,59,0.96));
      --ax-text: var(--color-foreground-primary, hsl(210, 40%, 98%));
      --ax-text-dim: var(--color-foreground-secondary, hsl(215, 20.2%, 65.1%));
      --ax-border: var(--color-border-default, rgba(255,255,255,0.1));
      --ax-accent: var(--color-accent-primary, #22d3ee);
      --ax-accent-soft: rgba(6,182,212,0.12);
      --ax-warning: #fbbf24;
      --ax-danger: #fb7185;
      --ax-shadow: 0 12px 24px -8px rgba(0,0,0,0.25);
      --ax-radius: 16px;
      --ax-font: var(--font-family-body, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; background: var(--ax-bg); color: var(--ax-text); font-family: var(--ax-font); }
    body { padding: 16px; }
    .shell { width: 100%; max-width: 1180px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .header h2 { font-size: 18px; font-weight: 600; }
    .count { font-size: 13px; color: var(--ax-text-dim); }
    .count-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .availability-summary { font-size: 11px; color: var(--ax-text-dim); opacity: 0.85; }
    .availability-line { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; color: var(--ax-text); }
    .availability-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .availability-word { font-weight: 600; letter-spacing: 0.2px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
    .search-input { min-width: 220px; flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text); font-size: 13px; }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text-dim); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--ax-accent); color: var(--ax-accent); }
    .filter-btn.active { background: var(--ax-accent); border-color: var(--ax-accent); color: #fff; }
    .scope-tabs { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2px; }
    .scope-tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--ax-border); background: rgba(255,255,255,0.03); color: var(--ax-text-dim); font-size: 12px; font-weight: 650; cursor: pointer; transition: all 0.15s; }
    .scope-tab:hover { border-color: rgba(34,211,238,0.45); color: var(--ax-text); }
    .scope-tab.active { border-color: rgba(251,191,36,0.45); background: rgba(251,191,36,0.12); color: var(--ax-warning); }
    .scope-tab-count { font-size: 11px; opacity: 0.72; }
    .scope-note { width: 100%; margin-top: -4px; margin-bottom: 4px; color: var(--ax-text-dim); font-size: 12px; line-height: 1.45; }
    .section-title { margin: 0 0 10px; color: var(--ax-text); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
    .section-title span { color: var(--ax-text-dim); font-weight: 500; }
    .owner-section-title { grid-column: 1 / -1; margin: 6px 0 0; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(34,211,238,0.16); background: rgba(34,211,238,0.06); color: var(--ax-text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    /* AGENT-LIFECYCLE-UI: collapsible Inactive (dormant) group */
    .inactive-toggle { grid-column: 1 / -1; margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--ax-border); background: rgba(148,163,184,0.08); color: var(--ax-text-dim); cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
    .inactive-toggle:hover { color: var(--ax-text); }
    .inactive-toggle-static { cursor: default; }
    .inactive-toggle-static:hover { color: var(--ax-text-dim); }
    .agent-card.is-collapsed { display: none; }
    .lifecycle-badge { margin-top: 10px; font-size: 11px; color: var(--ax-text-dim); }
    .agent-card { background: var(--ax-surface); border: 1px solid var(--ax-border); border-radius: var(--ax-radius); padding: 16px; cursor: pointer; transition: all 0.15s; position: relative; }
    .agent-card:hover { border-color: var(--ax-accent); box-shadow: var(--ax-shadow); transform: translateY(-1px); }
    .agent-card.is-disabled { border-color: rgba(251,113,133,0.4); background: linear-gradient(var(--ax-surface), var(--ax-surface)) padding-box, rgba(251,113,133,0.08); }
    .agent-card.is-disabled:hover { border-color: var(--ax-danger); }
    .agent-card.is-disabled .avatar { filter: grayscale(60%); opacity: 0.75; }
    .disabled-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(251,113,133,0.14); color: var(--ax-danger); border: 1px solid rgba(251,113,133,0.25); }
    .disabled-badge::before { content: "■"; font-size: 8px; }
    .disabled-meta { font-size: 11px; color: var(--ax-danger); margin-top: 6px; line-height: 1.3; }
    .agent-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .avatar {
      --avatar-radius: 16px;
      width: 42px;
      height: 42px;
      border-radius: var(--avatar-radius);
      background:
        radial-gradient(circle at 30% 18%, rgba(255,255,255,0.94), rgba(255,255,255,0.14) 20%, transparent 38%),
        linear-gradient(135deg, rgba(34,211,238,0.95), rgba(99,102,241,0.92) 55%, rgba(251,191,36,0.72));
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.04em;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.36),
        inset 0 -14px 24px rgba(2,6,23,0.24),
        0 12px 28px -18px rgba(34,211,238,0.9);
    }
    .avatar::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: calc(var(--avatar-radius) - 3px);
      border: 1px solid rgba(255,255,255,0.24);
    }
    .avatar::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      right: -18px;
      bottom: -18px;
      border-radius: 999px;
      background: rgba(2,6,23,0.28);
    }
    .avatar .avatar-symbol { position: relative; z-index: 1; line-height: 1; text-shadow: 0 1px 10px rgba(2,6,23,0.55); }
    .avatar .avatar-image { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; border-radius: var(--avatar-radius); background: var(--ax-bg); }
    .avatar.has-image::before,
    .avatar.has-image::after { display: none; }
    .avatar.avatar-space {
      background:
        radial-gradient(circle at 28% 20%, rgba(255,255,255,0.95), rgba(255,255,255,0.18) 18%, transparent 36%),
        linear-gradient(135deg, #fbbf24, #22d3ee 48%, #0f172a);
    }
    .avatar.avatar-tool {
      background:
        radial-gradient(circle at 30% 18%, rgba(255,255,255,0.88), rgba(255,255,255,0.12) 18%, transparent 36%),
        linear-gradient(135deg, #10b981, #06b6d4 50%, #1e293b);
    }
    .avatar.avatar-human {
      background:
        radial-gradient(circle at 30% 18%, rgba(255,255,255,0.86), rgba(255,255,255,0.11) 18%, transparent 36%),
        linear-gradient(135deg, #64748b, #334155);
    }
    .agent-info { flex: 1; min-width: 0; }
    .agent-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-handle { font-size: 12px; color: var(--ax-text-dim); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .status-online { background: var(--ax-accent); }
    .status-offline { background: var(--ax-text-dim); opacity: 0.4; }
    .status-disabled { background: var(--ax-danger); box-shadow: 0 0 0 4px rgba(251,113,133,0.12); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .type-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(6,182,212,0.12); color: var(--ax-accent); }
    .origin-badge { background: rgba(148,163,184,0.16); color: var(--ax-warning); }
    .model-badge { background: rgba(127,127,127,0.12); color: var(--ax-text-dim); text-transform: none; letter-spacing: 0; }
    .relationship-badge { background: rgba(34,211,238,0.14); color: var(--ax-accent); }
    .space-badge { background: rgba(251,191,36,0.12); color: var(--ax-warning); text-transform: none; letter-spacing: 0; }
    .trust-badge { background: rgba(16,185,129,0.12); color: #34d399; }
    .readonly-badge { background: rgba(148,163,184,0.12); color: var(--ax-text-dim); }
    .availability-badge { background: rgba(34,211,238,0.12); color: var(--ax-accent); text-transform: none; letter-spacing: 0; }
    .availability-badge.is-degraded { background: rgba(251,191,36,0.12); color: var(--ax-warning); }
    .availability-badge.is-unavailable { background: rgba(251,113,133,0.14); color: var(--ax-danger); }
    .setup-badge { background: rgba(251,191,36,0.12); color: var(--ax-warning); text-transform: none; letter-spacing: 0; }
    .setup-badge.is-blocked { background: rgba(148,163,184,0.14); color: var(--ax-text-dim); }
    .availability-note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(251,191,36,0.22); background: rgba(251,191,36,0.08); color: var(--ax-warning); font-size: 12px; line-height: 1.45; }
    .availability-note.is-blocked { border-color: rgba(148,163,184,0.2); background: rgba(148,163,184,0.08); color: var(--ax-text-dim); }
    .availability-note.is-info { border-color: rgba(34,211,238,0.22); background: rgba(34,211,238,0.08); color: var(--ax-accent); }
    .agent-bio { font-size: 13px; color: var(--ax-text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 10px; min-height: 36px; }
    .tool-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tool-chip { padding: 3px 8px; border-radius: 999px; font-size: 11px; background: rgba(6,182,212,0.12); color: var(--ax-accent); }
    .tool-chip.off { background: rgba(127,127,127,0.1); color: var(--ax-text-dim); }
    .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .card-actions .btn-secondary { padding: 6px 10px; font-size: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text-dim); font-size: 13px; cursor: pointer; margin-bottom: 16px; }
    .back-btn:hover { border-color: var(--ax-accent); color: var(--ax-accent); }
    .profile-card { background: var(--ax-surface-strong); border: 1px solid var(--ax-border); border-radius: var(--ax-radius); padding: 24px; box-shadow: var(--ax-shadow); }
    .terminal-card {
      background:
        radial-gradient(circle at 20% 0%, rgba(6,182,212,0.16), transparent 34%),
        var(--ax-surface-strong);
      border: 1px solid rgba(6,182,212,0.26);
      border-radius: var(--ax-radius);
      padding: 24px;
      box-shadow: var(--ax-shadow);
    }
    .terminal-title { font-size: 20px; font-weight: 650; margin-bottom: 8px; }
    .terminal-copy { font-size: 14px; color: var(--ax-text-dim); line-height: 1.6; margin-bottom: 14px; }
    .terminal-detail { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ax-text-dim); font-size: 12px; margin-bottom: 14px; }
    .profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .profile-avatar { --avatar-radius: 20px; width: 56px; height: 56px; font-size: 18px; }
    .profile-name { font-size: 20px; font-weight: 600; }
    .profile-handle { font-size: 14px; color: var(--ax-text-dim); display: flex; align-items: center; gap: 8px; }
    .profile-bio { font-size: 14px; color: var(--ax-text-dim); line-height: 1.6; margin-bottom: 16px; }
    .profile-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .field { background: var(--ax-surface); border-radius: 10px; padding: 12px; }
    .field-label { font-size: 11px; color: var(--ax-text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .field-value { font-size: 14px; font-weight: 500; }
    .caps-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .cap-tag { padding: 3px 10px; border-radius: 12px; font-size: 12px; background: rgba(6,182,212,0.12); color: var(--ax-accent); }
    .msg-btn { padding: 8px 18px; border-radius: 8px; border: none; background: var(--ax-accent); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .msg-btn:hover { opacity: 0.9; }
    .profile-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .btn-secondary { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text); font-size: 13px; cursor: pointer; }
    .btn-secondary:hover { border-color: var(--ax-accent); color: var(--ax-accent); }
    .btn-warning { padding: 8px 14px; border-radius: 8px; border: none; background: rgba(182,106,16,0.16); color: var(--ax-warning); font-size: 13px; cursor: pointer; }
    .btn-warning:hover { opacity: 0.9; }
    .btn-danger { padding: 8px 14px; border-radius: 8px; border: none; background: rgba(186,59,45,0.12); color: var(--ax-danger); font-size: 13px; cursor: pointer; }
    .btn-danger:hover { opacity: 0.9; }
    .loading { text-align: center; padding: 40px; color: var(--ax-text-dim); }
    .empty { text-align: center; padding: 40px; color: var(--ax-text-dim); font-size: 14px; }
    .empty strong { display: block; font-size: 16px; color: var(--ax-text); margin-bottom: 8px; }
    .create-card { background: var(--ax-surface-strong); border: 2px dashed var(--ax-accent); border-radius: var(--ax-radius); padding: 24px; box-shadow: var(--ax-shadow); }
    .create-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ax-accent); font-weight: 600; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--ax-text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .compact-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 240px)); gap: 12px; align-items: start; margin: 8px 0 14px; }
    .compact-form-grid .form-group { margin-bottom: 0; }
    .field-required { color: var(--ax-warning); margin-left: 4px; font-weight: 700; }
    .field-help { margin-top: 6px; font-size: 12px; color: var(--ax-text-dim); line-height: 1.4; }
    .form-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text); font-size: 14px; font-family: var(--ax-font); }
    .form-input:focus { outline: none; border-color: var(--ax-accent); }
    .form-input.is-missing { border-color: var(--ax-warning); box-shadow: 0 0 0 1px rgba(182,106,16,0.18); }
    .form-input:disabled { opacity: 0.65; cursor: not-allowed; }
    textarea.form-input { min-height: 80px; resize: vertical; }
    .create-summary { margin-bottom: 14px; font-size: 13px; color: var(--ax-text-dim); line-height: 1.5; }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn-create { padding: 10px 20px; border-radius: 8px; border: none; background: var(--ax-accent); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-create:hover { opacity: 0.9; }
    .btn-create:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-discard { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--ax-border); background: var(--ax-surface); color: var(--ax-text-dim); font-size: 14px; cursor: pointer; }
    .btn-discard:hover { border-color: var(--ax-danger); color: var(--ax-danger); }
    .notice { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .notice-error { background: rgba(186,59,45,0.12); color: var(--ax-danger); }
    .notice-info { background: rgba(18,106,82,0.08); color: var(--ax-accent); }
    .notice-warning { background: rgba(251,191,36,0.08); color: var(--ax-warning); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .new-btn { padding: 6px 14px; border-radius: 8px; border: none; background: var(--ax-accent); color: #fff; font-size: 12px; font-weight: 500; cursor: pointer; }
    .new-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="shell" id="app"><div class="loading">Loading agents...</div></div>
  <script type="module">
    import { App } from "__WAYSTATION_MCP_APPS_BRIDGE_URL__";
    const app = new App({ name: "Agent Dashboard", version: "1.0.0" });
    const OPENAI_SET_GLOBALS_EVENT = "openai:set_globals";
    let hostRequestSeq = 0;

    function getOpenAiBridge() {
      return typeof window !== "undefined" ? window.openai : undefined;
    }

    const DEFAULT_CREATE_REQUIRED_FIELDS = ["name", "description"];
    const AGENT_MODE_OPTIONS = ["sandbox", "privileged"];

    let state = { view: "grid", agents: [], count: 0, total: 0, selected: null, search: "", searchCursor: null, restoreSearchFocus: false, agentScopeFilter: "space", statusFilter: "all", originFilter: "all", typeFilter: "all", crossSpaceLoaded: false, crossSpaceScope: "", crossSpaceLoading: false, crossSpaceLoadingScope: "", draft: null, draftFields: {}, draftSending: false, draftRefreshInFlight: false, draftRefreshedFor: "", terminalDraft: null, controlDraft: null, controlSending: false, controlReturnView: "grid", editAgent: null, editFields: {}, editSending: false, notice: null, noticeKind: "info", draftRequiredFields: DEFAULT_CREATE_REQUIRED_FIELDS, permissions: null, spaceContext: null, availableSpaces: [], spacesLoading: false, spacesLoaded: false, viewer: null, hydrated: false, showInactive: false, availabilitySummary: null };

    function normalizeToolResult(result) {
      if (result && typeof result === "object" && ("structuredContent" in result || "content" in result)) {
        return result;
      }
      return { structuredContent: result };
    }

    function notifyHostHeight() {
      const openaiBridge = getOpenAiBridge();
      if (openaiBridge && typeof openaiBridge.notifyIntrinsicHeight === "function") {
        requestAnimationFrame(() => {
          try {
            const appRoot = document.getElementById("app");
            const bodyStyles = window.getComputedStyle(document.body);
            const paddingTop = parseFloat(bodyStyles.paddingTop || "0") || 0;
            const paddingBottom = parseFloat(bodyStyles.paddingBottom || "0") || 0;
            const contentHeight = appRoot
              ? Math.ceil(appRoot.getBoundingClientRect().height + paddingTop + paddingBottom)
              : Math.ceil(document.body.getBoundingClientRect().height);
            openaiBridge.notifyIntrinsicHeight(Math.max(120, contentHeight));
          } catch {}
        });
      }
    }

    function missingCreateFields(fields, requiredFields = DEFAULT_CREATE_REQUIRED_FIELDS) {
      return requiredFields.filter((key) => {
        const value = fields[key];
        if (Array.isArray(value)) return value.length === 0;
        return !String(value || "").trim();
      });
    }

    const host = {
      _toolResultHandler: null,
      _globalsListener: null,
      setToolResultHandler(handler) {
        this._toolResultHandler = handler;
        app.ontoolresult = handler;
        window.addEventListener("message", (event) => {
          let msg = event.data;
          if (!msg) return;
          if (typeof msg === "string") {
            try { msg = JSON.parse(msg); } catch { return; }
          }
          if (typeof msg !== "object") return;
          if (msg.method === "ui/notifications/tool-result" && msg.params) {
            handler(normalizeToolResult(msg.params));
            return;
          }
          if (msg.type === "tool_result" && (msg.initial_data || msg.structuredContent || msg.content)) {
            handler(normalizeToolResult(msg.initial_data || msg));
            return;
          }
          if (msg.structuredContent || msg.kind) {
            handler(normalizeToolResult(msg));
          }
        });
      },
      _deliverToolOutput(globals) {
        const openaiBridge = getOpenAiBridge();
        const output = globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")
          ? globals.toolOutput
          : openaiBridge?.toolOutput;
        if (this._toolResultHandler && output !== undefined) {
          this._toolResultHandler(normalizeToolResult(output));
        }
      },
      async connect() {
        if (!this._globalsListener) {
          this._globalsListener = (event) => {
            const globals = event?.detail?.globals;
            if (globals && Object.prototype.hasOwnProperty.call(globals, "toolOutput")) {
              this._deliverToolOutput(globals);
            }
            notifyHostHeight();
          };
          window.addEventListener(OPENAI_SET_GLOBALS_EVENT, this._globalsListener, { passive: true });
        }
        await app.connect();
        this._deliverToolOutput();
        notifyHostHeight();
      },
      async callServerTool(name, args) {
        const openaiBridge = getOpenAiBridge();
        if (openaiBridge && typeof openaiBridge.callTool === "function") {
          return normalizeToolResult(await openaiBridge.callTool(name, args));
        }
        return app.callServerTool({ name, arguments: args });
      },
      requestHost(method, params) {
        return new Promise((resolve, reject) => {
          const id = "agent-dashboard:" + Date.now() + ":" + (++hostRequestSeq);
          let finished = false;
          const cleanup = () => {
            finished = true;
            window.clearTimeout(timeoutId);
            window.removeEventListener("message", handleMessage);
          };
          const handleMessage = (event) => {
            let msg = event.data;
            if (!msg) return;
            if (typeof msg === "string") {
              try { msg = JSON.parse(msg); } catch { return; }
            }
            if (!msg || typeof msg !== "object" || msg.id !== id) return;
            cleanup();
            if (msg.error) {
              reject(new Error(msg.error.message || (method + " failed.")));
              return;
            }
            resolve(msg.result || { ok: true });
          };
          const timeoutId = window.setTimeout(() => {
            if (finished) return;
            cleanup();
            reject(new Error(method + " timed out."));
          }, 2000);
          window.addEventListener("message", handleMessage);
          window.parent.postMessage({
            jsonrpc: "2.0",
            id,
            method,
            params,
          }, "*");
        });
      },
      async openCompose(params) {
        await this.requestHost("ui/open-compose", params);
        return { ok: true };
      },
    };

    function initials(name) {
      if (!name) return "?";
      return name.split(/[\s_-]+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
    }

    function agentAvatarRaw(agent) {
      return [
        agent?.type,
        agent?.agent_type,
        agent?.origin,
        agent?.role_label,
        agent?.template_type,
      ].join(" ").toLowerCase();
    }

    const AVATAR_RESOURCE_ORIGINS = new Set([
      "https://avatars.githubusercontent.com",
      "https://github.com",
      "https://raw.githubusercontent.com",
      "https://user-images.githubusercontent.com",
    ]);
    const AVATAR_UPLOAD_ORIGINS = new Set([
      window.location.origin,
    ]);
    const AVATAR_UPLOAD_PATH_PREFIX = "/api/v1/uploads/files/";

    function safeAvatarUrl(value) {
      if (typeof value !== "string") return "";
      const url = value.trim();
      if (!url) return "";
      const lower = url.toLowerCase();
      if (lower.startsWith("data:image/")) return url;
      try {
        const parsed = new URL(url, window.location.href);
        if (parsed.protocol === "https:" && AVATAR_RESOURCE_ORIGINS.has(parsed.origin)) return url;
        if (
          parsed.protocol === "https:"
          && AVATAR_UPLOAD_ORIGINS.has(parsed.origin)
          && parsed.pathname.startsWith(AVATAR_UPLOAD_PATH_PREFIX)
        ) {
          return parsed.href;
        }
      } catch (_) {
        return "";
      }
      return "";
    }

    function agentAvatarUrl(agent) {
      return safeAvatarUrl(
        agent?.avatar_url
          || agent?.avatarUrl
          || agent?.profile?.avatar_url
          || agent?.profile?.avatarUrl

    }

    function agentEmojiIcon(agent) {
      const value = agent?.avatar_emoji || agent?.avatarEmoji || agent?.emoji || agent?.icon;
      return typeof value === "string" && value.trim().length <= 16 ? value.trim() : "";

    // @test-extract:start quickActionAgentEmoji
    function quickActionAgentEmoji(handle, displayName) {
      const key = [handle, displayName].filter(Boolean).join(" ").toLowerCase();
      if (!key) return "🤖";
      if (key === "waystation" || /(^|\s)waystation(\s|$)/.test(key) || key === "ax" || key === "a_x" || /(^|\s)(ax|a_x)(\s|$)/.test(key) || key.includes("space agent")) return "✨";
      if (key.includes("claude")) return "🖥️";
      if (key.includes("atlas")) return "🗺️";
      if (key.includes("daimon")) return "🛰️";
      if (key.includes("zephyr")) return "🌬️";
      if (key.includes("peach")) return "🍑";
      if (key.includes("hermes")) return "🪽";
      if (key.includes("nyx")) return "🌘";
      if (key.includes("code_weaver") || key.includes("codex")) return "🛠️";
      if (key.includes("stack")) return "🧱";
      if (key.includes("canary")) return "🐤";
      if (key.includes("anvil")) return "⚒️";
      if (key.includes("god")) return "🔱";
      if (key.includes("audit")) return "🔎";
      if (key.includes("protocol")) return "🧭";
      if (key.includes("canvas")) return "🎨";
      if (key.includes("cipher")) return "🧠";
      if (key.includes("ranger")) return "🏹";
      if (key.includes("sentinel")) return "🛡️";
      return "🤖";
    }
    // @test-extract:end quickActionAgentEmoji

    function agentAvatarSymbol(agent, title) {
      const emojiIcon = agentEmojiIcon(agent);
      if (emojiIcon) return emojiIcon;
      const quickActionEmoji = quickActionAgentEmoji(publicId(agent), title);
      if (quickActionEmoji && quickActionEmoji !== "🤖") return quickActionEmoji;
      if (isSpaceAgent(agent)) return "✦";
      const raw = agentAvatarRaw(agent);
      if (raw.includes("backend") || raw.includes("api")) return "⌬";
      if (raw.includes("frontend") || raw.includes("ui")) return "◈";
      if (raw.includes("mcp")) return "◆";
      if (raw.includes("cli")) return "⌁";
      if (raw.includes("sentinel") || raw.includes("security")) return "◇";
      const fallback = initials(title);
      return fallback === "A" || fallback === "AG" ? "✶" : fallback;
    }

    function agentAvatarElement(agent, title, className = "") {
      const raw = agentAvatarRaw(agent);
      const avatarUrl = agentAvatarUrl(agent);
      const tone = isSpaceAgent(agent)
        ? "avatar-space"
        : raw.includes("mcp")
          || raw.includes("backend")
          || raw.includes("frontend")
          || raw.includes("cli")
          || raw.includes("sentinel")
          || raw.includes("security")
          ? "avatar-tool"
          : "avatar-human";
      const avatar = h("div", {
        className: ["avatar", tone, avatarUrl ? "has-image" : "", className].filter(Boolean).join(" "),
        title: title || "Agent",
        "aria-label": (title || "Agent") + " avatar",
      });

        avatar.appendChild(h("img", { className: "avatar-image", src: avatarUrl, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }));
      } else {
        avatar.appendChild(h("span", { className: "avatar-symbol" }, agentAvatarSymbol(agent, title)));
      }
