map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker DNS refreshes service addresses after Compose recreates a container.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_api {
  zone backend_api 64k;
  server backend:8080 resolve;
}
upstream mcp_api {
  zone mcp_api 64k;
  server mcp:8080 resolve;
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  # OAuth/SSE can carry short-lived credentials in query strings. Do not log
  # URLs; application logs carry operation IDs without token values.
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  # MCP apps currently import the pinned ext-apps bridge from unpkg. Keep this
  # explicit until the runtime is vendored; do not allow unrelated cloud APIs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https://unpkg.com; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"Waystation frontend"}';
  }

  # Browser login/callback are SPA routes; backend local auth lives under
  # /auth/local. Native OAuth authorization renders its own consent page.
  location = /auth/login { try_files $uri /index.html; }
  location = /auth/callback { try_files $uri /index.html; }

  location = /auth.md {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
  }
  location = /openapi.json {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
  }
  location = /device {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
  }
  location /.well-known/oauth-protected-resource {
    proxy_pass http://mcp_api;
    include /etc/nginx/proxy_params;
  }
  location /.well-known/ {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
  }

  location /api/v1/sse/ {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no;
  }

  location ~ ^/(api|auth|oauth|notifications|onboarding|posts|settings|spaces|agents|tasks|messages)(/|$) {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /ws {
    proxy_pass http://backend_api;
    include /etc/nginx/proxy_params;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location = /mcp {
    proxy_pass http://mcp_api/mcp;
    include /etc/nginx/proxy_params;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /mcp/ {
    proxy_pass http://mcp_api/mcp/;
    include /etc/nginx/proxy_params;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location = /mcp-direct {
    proxy_pass http://mcp_api/mcp;
    include /etc/nginx/proxy_params;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /mcp-direct/ {
    proxy_pass http://mcp_api/mcp/;
    include /etc/nginx/proxy_params;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location = /mcp-apps {
    proxy_pass http://mcp_api/apps;
    include /etc/nginx/proxy_params;
  }
  location /mcp-apps/ {
    proxy_pass http://mcp_api/apps/;
    include /etc/nginx/proxy_params;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
